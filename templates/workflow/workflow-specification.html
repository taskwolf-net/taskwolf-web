{% load static %}
{% load i18n %}
<script>
  let specificationSelectButtons = [];
  let specificationValues = {};
  let currentPlaceholderElement;
  let requiredSpecificationVariables = [];
  let componentsOutputVariables = [];
  let quillInputElements = [];
  let specificationPrefix;
  let adoptButton;
  let fetchSpecificationInputs;

  window.addEventListener('load', function () {
    new ResizeObserver(() => updateSpecificationsDividerHeight())
      .observe(document.getElementById(specificationPrefix + "-container"));
  });

  function updateSpecificationsDividerHeight() {
    let height = document.getElementById(specificationPrefix + "-container").offsetHeight;
    document.getElementById(specificationPrefix + "-divider").style.height =
      height + "px";
  }

  function prepareSpecifications() {
    document.getElementById(specificationPrefix + "-container").style.display = "flex";
    document.getElementById(specificationPrefix + "-unable").style.display = "none";
    preparePlaceholders(function () {
      fillSpecificationsInputs();
    });
  }

  function fillSpecificationsInputs() {
    fetchSpecificationInputs(function (status, responseText) {
      document.getElementById(specificationPrefix + "-input-list").innerHTML = "";
      let component = JSON.parse(responseText);
      let inputVariables = component.inputVariables;
      if (inputVariables.length === 0) {
        document.getElementById(specificationPrefix + "-container").style.display = "none";
        document.getElementById(specificationPrefix + "-redundant").style.display = "block";
        checkSetupCompletion();
        return;
      }
      for (let i = 0; i < inputVariables.length; i++) {
        let inputVariable = inputVariables[i];
        if (inputVariable.type === "REQUIRED") {
          requiredSpecificationVariables.push(inputVariable.identifier);
        }
      }
      for (let i = 0; i < inputVariables.length; i++) {
        let inputVariable = inputVariables[i];
        if (inputVariable.dataType === "TEXT" || inputVariable.dataType === "TEXT_AREA") {
          addSpecificationInput(inputVariable.identifier, inputVariable.name, inputVariable.description, inputVariable.placeholder,
            i, inputVariables.length, inputVariable.dataType);
        }
        if (inputVariable.dataType === "SELECT") {
          addSpecificationSelect(inputVariable.identifier, inputVariable.name, inputVariable.description, i);
        }
        if (inputVariable.dataType === "FILE") {
          addSpecificationFile(inputVariable.identifier, inputVariable.name, inputVariable.description);
        }
        if (inputVariable.dataType === "BOOLEAN") {
          addSpecificationSwitch(inputVariable.identifier, inputVariable.name, inputVariable.description);
        }
        if (inputVariable.dataType === "TIME") {
          addSpecificationTime(inputVariable.identifier, inputVariable.name, inputVariable.description);
          specificationValues["timezone"] = Intl.DateTimeFormat().resolvedOptions().timeZone;
        }
      }
      checkSetupCompletion();
      createResetButton(document.getElementById(specificationPrefix + "-input-list"), function() {
        specificationSelectButtons = [];
        specificationValues = {};
        updateAdoptability(false);
        fillSpecificationsInputs();
      });
      if (selectedApplication === "scheduler") {
        specificationValues["timezone"] = Intl.DateTimeFormat().resolvedOptions().timeZone;
      }
    });
  }

  function addSpecificationInput(identifier, name, description, placeholder, index, inputsLength, dataType) {
    let inputContainerElement = document.createElement("div");
    inputContainerElement.classList.add("workflow-specification-input-container", "form-outline", "mb-4");
    let labelElement = document.createElement("h5");
    labelElement.classList.add("workflow-specification-headline", "form-label");
    labelElement.innerHTML = name + ":";
    inputContainerElement.appendChild(labelElement);
    let informationElement = document.createElement("h5");
    informationElement.classList.add("workflow-specification-information", "fa", "fa-question-circle");
    applyTooltips(informationElement, inputContainerElement, description);
    inputContainerElement.appendChild(informationElement);
    let inputElement = document.createElement("div");
    if (dataType === "TEXT_AREA") {
      inputElement.style.minHeight = "110px";
    }
    inputElement.id = "workflow-specification-input-" + identifier;
    inputElement.classList.add("workflow-specification-input", "form-control");
    inputContainerElement.appendChild(inputElement);
    document.getElementById(specificationPrefix + "-input-list").appendChild(inputContainerElement);
    let quill = setupPlaceholderInput(inputElement.id, placeholder);
    quillInputElements.push(quill);
    quill.on('text-change', function(delta, oldDelta, source) {
      inputSpecificationInput(quill, identifier);
    });
    inputElement.ondragover = function (event) {
      event.preventDefault();
    };
    inputElement.ondrop = function (event) {
      addPlaceholder(quill, inputElement.id, event.dataTransfer.getData("placeholder-identifier"),
        event.dataTransfer.getData("placeholder-name"));
      inputSpecificationInput(quill, identifier);
    };
    prefillSpecificationInput(identifier, quill);
  }

  function prefillSpecificationInput(identifier, quill) {
    if (!("content" in selectedComponent)) {
      return;
    }
    let selectedComponentContent = JSON.parse(selectedComponent.content);
    if (identifier in selectedComponentContent) {
      for (let i = 0; i < componentsOutputVariables.length; i++) {
        let entry = componentsOutputVariables[i];
        let index = entry.index;
        let prefix = findPlaceholderPrefix(index);
        let variables = entry.variables;
        for (let i = 0; i < variables.length; i++) {
          let variable = variables[i];
          selectedComponentContent[identifier] = selectedComponentContent[identifier]
            .replaceAll("%" + prefix + variable.identifier + "%", '<span class="placeholder" data-placeholder="' +
              prefix + variable.identifier + ':' + variable.name + '">﻿<span contenteditable="false"> ' +
              variable.name + ' </span>﻿</span>')
        }
      }
      quill.clipboard.dangerouslyPasteHTML(0, selectedComponentContent[identifier]
        .split('\n').map(line => "<p>" + (line === "" ? "<br>" : line) + "</p>")
        .join(''));
      adjustEditorHeight(quill);
      inputSpecificationInput(quill, identifier);
    }
    checkSetupCompletion();
  }

  function inputSpecificationInput(quill, identifier) {
    let value = findPlaceholderInputContent(quill, componentsOutputVariables);
    if (value === "" && identifier in specificationValues) {
      delete specificationValues[identifier];
    }
    if (value !== "") {
      specificationValues[identifier] = value;
    }
    checkAdoptability();
  }

  function addSpecificationSelect(identifier, name, description, index) {
    let dropdownContainer = document.createElement("div");
    dropdownContainer.classList.add("mb-4");
    let labelElement = document.createElement("h5");
    labelElement.classList.add("workflow-specification-headline", "form-label");
    labelElement.innerHTML = name + ":";
    dropdownContainer.appendChild(labelElement);
    let informationElement = document.createElement("h5");
    informationElement.classList.add("workflow-specification-information", "fa", "fa-question-circle");
    applyTooltips(informationElement, dropdownContainer, description);
    dropdownContainer.appendChild(informationElement);
    dropdownContainer.classList.add("workflow-specification-select-container", "dropdown");
    let dropdownButton = document.createElement("button");
    dropdownButton.classList.add("btn", "btn-dark", "dropdown-toggle");
    if (document.getElementsByClassName("workflow-specification-select-container").length > 0) {
      dropdownButton.setAttribute("disabled", "disabled");
      specificationSelectButtons.push(dropdownButton);
    }
    $(dropdownButton).attr('data-bs-toggle','dropdown');
    dropdownButton.type = "button";
    dropdownButton.innerHTML = name;
    dropdownContainer.appendChild(dropdownButton);
    let dropdownList = document.createElement("ul");
    dropdownList.classList.add("workflow-specification-select-list", "dropdown-menu");
    dropdownContainer.appendChild(dropdownList);
    dropdownButton.addEventListener("click", function (event) {
      clickSpecificationSelect(identifier, dropdownContainer, dropdownList, dropdownButton);
    });
    document.getElementById(specificationPrefix + "-input-list").appendChild(dropdownContainer);
    if (selectedComponentSetup && "content" in selectedComponent) {
      setTimeout(function(){
        clickSpecificationSelect(identifier, dropdownContainer, dropdownList, dropdownButton);
      }, 500 * index);
    }
  }

  function clickSpecificationSelect(identifier, dropdownContainer, dropdownList, dropdownButton) {
    dropdownList.innerHTML = "";
    dropdownList.appendChild(createSpecificationSelectLoader());
    let request = new HttpRequest("https://api.dulno.com/v1/component/select/items/", "POST",
      [], {componentType: "{{type}}", module: selectedApplication.toLowerCase(), type: selectedEvent, previousInputs: specificationValues, select: identifier});
    request.send(function (status, responseText) {
      let items = JSON.parse(responseText).items;
      dropdownList.innerHTML = "";
      let found = false;
      for (let i = 0; i < items.length; i++) {
        let item = JSON.parse(items[i]);
        let itemElement = document.createElement("li");
        itemElement.classList.add("dropdown-item");
        let itemNameName = document.createElement("b");
        itemNameName.innerHTML = item.name;
        itemElement.appendChild(itemNameName);
        itemElement.onclick = function (event) {
          selectSpecificationSelect(identifier, item.identifier, item.name, dropdownContainer, dropdownButton, dropdownList);
        }
        dropdownList.appendChild(itemElement);
        if (selectedComponentSetup && selectedComponent.content !== undefined && JSON.parse(selectedComponent.content)[identifier] === item.identifier) {
          selectSpecificationSelect(identifier, item.identifier, item.name, dropdownContainer, dropdownButton, dropdownList);
          found = true;
        }
      }
      if (selectedComponentSetup && !found) {
        specificationValues[identifier] = "";
      }
      checkSetupCompletion();
      if (items.length === 0) {
        let itemElement = document.createElement("li");
        itemElement.classList.add("dropdown-item");
        itemElement.classList.add("workflow-specification-select-empty");
        let itemNameName = document.createElement("b");
        itemNameName.innerHTML = "{% trans 'product.workflow.specifications.empty' %}";
        itemElement.appendChild(itemNameName);
        dropdownList.appendChild(itemElement);
      }
    });
  }

  function createSpecificationSelectLoader() {
    let loaderEntry = document.createElement("li");
    loaderEntry.classList.add("dropdown-item");
    let loaderSpinnerContainer = document.createElement("div");
    loaderSpinnerContainer.classList.add("d-flex", "justify-content-center");
    let loaderSpinner = document.createElement("div");
    loaderSpinner.classList.add("spinner-border", "spinner-border-sm");
    loaderSpinner.role = "status";
    let loaderSpan = document.createElement("span");
    loaderSpan.classList.add("visually-hidden");
    loaderSpan.innerText = "Loading...";
    loaderSpinner.appendChild(loaderSpan);
    loaderSpinnerContainer.appendChild(loaderSpinner);
    loaderEntry.appendChild(loaderSpinnerContainer);
    return loaderEntry;
  }

  function selectSpecificationSelect(selectIdentifier, itemIdentifier, itemName, dropdownContainer, dropdownButton, dropdownList) {
    specificationValues[selectIdentifier] = itemIdentifier;
    dropdownContainer.removeChild(dropdownButton);
    dropdownContainer.removeChild(dropdownList);
    let itemElement = document.createElement("div");
    itemElement.classList.add("workflow-specification-selected-item");
    let itemNameElement = document.createElement("b");
    itemNameElement.innerHTML = itemName;
    itemElement.appendChild(itemNameElement);
    dropdownContainer.appendChild(itemElement);
    if (specificationSelectButtons.length > 0) {
      specificationSelectButtons.shift().removeAttribute("disabled");
    }
    checkAdoptability();
  }

  function addSpecificationFile(identifier, name, description) {
    let inputContainerElement = document.createElement("div");
    inputContainerElement.classList.add("workflow-specification-file-container", "form-outline", "mb-4");
    let labelElement = document.createElement("h5");
    labelElement.classList.add("workflow-specification-headline", "form-label");
    labelElement.innerHTML = name + ":";
    inputContainerElement.appendChild(labelElement);
    let informationElement = document.createElement("h5");
    informationElement.classList.add("workflow-specification-information", "fa", "fa-question-circle");
    applyTooltips(informationElement, inputContainerElement, description);
    inputContainerElement.appendChild(informationElement);
    let fileSelectorElement = document.createElement("input");
    fileSelectorElement.type = "file";
    fileSelectorElement.classList.add("d-none");
    fileSelectorElement.onchange = function (event) {
      let reader = new FileReader();
      reader.onload = function() {
        let binary = '';
        let bytes = new Uint8Array(reader.result);
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        selectSpecificationFile(identifier, btoa(binary), fileButton);
      }
      reader.readAsArrayBuffer(this.files[0]);
    }
    let fileButton = document.createElement("button");
    fileButton.type = "button";
    fileButton.innerText = "{% trans 'product.workflow.specifications.file.pending' %}";
    fileButton.classList.add("workflow-specification-file", "btn", "btn-dark");
    fileButton.onclick = function (event) {
      fileSelectorElement.click();
    }
    fileButton.ondragover = function (event) {
      event.preventDefault();
    };
    fileButton.ondrop = function (event) {
      let value = fileButton.value.substring(0, fileButton.selectionStart) +
        "%" + event.dataTransfer.getData("placeholder-identifier") + "%" +
        fileButton.value.substring(fileButton.selectionStart);
      selectSpecificationFile(identifier, value, fileButton);
    };
    inputContainerElement.appendChild(fileButton);
    document.getElementById(specificationPrefix + "-input-list").appendChild(inputContainerElement);
    if (selectedComponentSetup && "content" in selectedComponent) {
      let selectedComponentContent = JSON.parse(selectedComponent.content);
      if (identifier in selectedComponentContent) {
        selectSpecificationFile(identifier, selectedComponentContent[identifier],
          fileButton);
      }
      checkSetupCompletion();
    }
  }

  function selectSpecificationFile(identifier, value, fileButton) {
    if (value === "" && identifier in specificationValues) {
      delete specificationValues[identifier];
    }
    if (value !== "") {
      specificationValues[identifier] = value;
    }
    fileButton.classList.remove("btn-dark");
    fileButton.classList.add("btn-success");
    fileButton.innerText = "{% trans 'product.workflow.specifications.file.selected' %}";
    checkAdoptability();
  }

  function addSpecificationSwitch(identifier, name, description) {
    let inputContainerElement = document.createElement("div");
    inputContainerElement.classList.add("workflow-specification-switch-container", "form-outline", "mb-4");
    let labelElement = document.createElement("h5");
    labelElement.classList.add("workflow-specification-headline", "form-label");
    labelElement.innerHTML = name + ":";
    inputContainerElement.appendChild(labelElement);
    let informationElement = document.createElement("h5");
    informationElement.classList.add("workflow-specification-information", "fa", "fa-question-circle");
    applyTooltips(informationElement, inputContainerElement, description);
    inputContainerElement.appendChild(informationElement);
    let switchElement = document.createElement("label");
    switchElement.classList.add("switch", "mt-2");
    let switchInput = document.createElement("input");
    switchInput.type = "checkbox";
    switchInput.checked = true;
    specificationValues[identifier] = switchInput.checked.toString();
    checkAdoptability();
    switchElement.onclick = function (event) {
      specificationValues[identifier] = switchInput.checked.toString();
    }
    switchElement.appendChild(switchInput);
    let switchSpan = document.createElement("span");
    switchSpan.classList.add("slider", "round");
    switchElement.appendChild(switchSpan);
    inputContainerElement.appendChild(switchElement);
    document.getElementById(specificationPrefix + "-input-list").appendChild(inputContainerElement);
    if (selectedComponentSetup && "content" in selectedComponent) {
      let selectedComponentContent = JSON.parse(selectedComponent.content);
      if (identifier in selectedComponentContent) {
        specificationValues[identifier] = selectedComponentContent[identifier];
        switchInput.checked = selectedComponentContent[identifier] === "true";
      }
      checkSetupCompletion();
    }
  }

  function addSpecificationTime(identifier, name, description) {
    let inputContainerElement = document.createElement("div");
    inputContainerElement.classList.add("workflow-specification-time-container", "form-outline", "mb-4");
    let labelElement = document.createElement("h5");
    labelElement.classList.add("workflow-specification-headline", "form-label");
    labelElement.innerHTML = name + ":";
    inputContainerElement.appendChild(labelElement);
    let informationElement = document.createElement("h5");
    informationElement.classList.add("workflow-specification-information", "fa", "fa-question-circle");
    applyTooltips(informationElement, inputContainerElement, description);
    inputContainerElement.appendChild(informationElement);
    let timeInput = document.createElement("input");
    timeInput.type = "time";
    timeInput.classList.add("rounded-2", "py-1", "px-2");
    timeInput.oninput = function (event) {
      specificationValues[identifier] = timeInput.value;
      checkAdoptability();
    }
    inputContainerElement.appendChild(timeInput);
    document.getElementById(specificationPrefix + "-input-list").appendChild(inputContainerElement);
    if (selectedComponentSetup && "content" in selectedComponent) {
      let selectedComponentContent = JSON.parse(selectedComponent.content);
      if (identifier in selectedComponentContent) {
        specificationValues[identifier] = selectedComponentContent[identifier];
        timeInput.value = selectedComponentContent[identifier];
      }
      checkSetupCompletion();
    }
  }

  function resetSpecifications() {
    document.getElementById(specificationPrefix + "-container").style.display = "none";
    document.getElementById(specificationPrefix + "-unable").style.display = "block";
    document.getElementById(specificationPrefix + "-redundant").style.display = "none";
    document.getElementById(specificationPrefix + "-placeholders-empty").classList.add("d-none");
    document.getElementById(specificationPrefix + "-placeholders-tabs").classList.add("d-none");
    document.getElementById(specificationPrefix + "-placeholders-tabs").innerText = "";
    document.getElementById(specificationPrefix + "-placeholders-list").innerHTML = "";
    specificationSelectButtons = [];
    specificationValues = {};
    requiredSpecificationVariables = [];
    updateAdoptability(false);
  }

  function checkSetupCompletion() {
    if (checkAdoptability() && selectedComponentSetup) {
      selectedComponentSetup = false;
      let specifications = Object.keys(specificationValues);
      for (let i = specifications.length - 1; i >= 0; i--) {
        if (specificationValues[specifications[i]] === "") {
          delete specificationValues[specifications[i]];
        }
      }
      checkAdoptability();
      $('#' + specificationPrefix).collapse("toggle");
      setTimeout(removeLoader, 500);
    }
  }

  function checkAdoptability() {
    let isAdoptable = true;
    for (let i = 0; i < requiredSpecificationVariables.length; i++) {
      if (!(requiredSpecificationVariables[i] in specificationValues)) {
        isAdoptable = false;
        break;
      }
    }
    updateAdoptability(isAdoptable);
    return isAdoptable;
  }

  function updateAdoptability(isAdoptable) {
    if (isAdoptable) {
      adoptButton.classList.remove("disabled");
      adoptButton.classList.add("workflow-adopt-enabled");
    } else {
      adoptButton.classList.add("disabled");
      adoptButton.classList.remove("workflow-adopt-enabled");
    }
  }

  function compareComponents(component1, component2) {
    var newContent = JSON.parse(component1.content);
    delete component1.content;
    var currentContent = JSON.parse(component2.content);
    delete component2.content;
    if (!compareJson(component1, component2)) {
      return true;
    }
    return !compareJson(newContent, currentContent);
  }

  function compareJson(obj1, obj2) {
    if (obj1 === obj2) return true;
    if (typeof obj1 !== 'object' || typeof obj2 !== 'object' || obj1 === null || obj2 === null) {
      return false;
    }
    let keys1 = Object.keys(obj1);
    let keys2 = Object.keys(obj2);
    if (keys1.length !== keys2.length) return false;
    for (let key of keys1) {
      if (!keys2.includes(key) || !compareJson(obj1[key], obj2[key])) {
        return false;
      }
    }
    return true;
  }

  function applyTooltips(element, container, text) {
    $(element).attr("data-bs-toggle", "tooltip");
    $(element).attr("data-bs-placement", "top");
    $(element).attr("data-bs-title", text);
    container.classList.add("position-relative");
    new bootstrap.Tooltip(element, {
      container: container,
      html: true
    });
  }
</script>

{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body class="dark">
    {% include 'templates/home-header.html' %}
    <div id="download-platform-container">
      <h3 id="download-platform-headline">{% trans 'home.download.platform.headline' %}</h3>
      <h1 id="download-platform-description">{% trans 'home.download.platform.description' %}</h1>
      <div id="download-platform-list">
        <button class="download-platform" onclick="location.href='/download/desktop/'">
          <i class="download-platform-icon fa-solid fa-desktop"></i>
          <h2 class="fw-bold mb-2">{% trans 'home.download.platform.desktop.headline' %}</h2>
          <label class="mb-0">{% trans 'home.download.platform.desktop.precise' %}</label>
        </button>
        <button class="download-platform" onclick="location.href='/download/mobile/'">
          <i class="download-platform-icon fa-solid fa-mobile-screen-button"></i>
          <h2 class="fw-bold mb-2">{% trans 'home.download.platform.mobile.headline' %}</h2>
          <label class="mb-0">{% trans 'home.download.platform.mobile.precise' %}</label>
        </button>
        <button class="download-platform" onclick="location.href='/download/cli/'">
          <i class="download-platform-icon fa-solid fa-terminal"></i>
          <h2 class="fw-bold mb-2">{% trans 'home.download.platform.cli.headline' %}</h2>
          <label class="mb-0">{% trans 'home.download.platform.cli.precise' %}</label>
        </button>
      </div>
    </div>
    {% include 'templates/home-footer.html' %}
  </body>
</html>

{% load static %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/home-header.html' %}
    <form>
      <img id="register-logo" src="{% static 'img/logo.png' %}"></br></br>
      <h1 class="text-light">Registration</h1></br>
      <div class="form-outline mb-4">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="Email">
      </div>
      <div class="form-outline mb-4">
        <label for="username" class="form-label">Username</label>
        <input type="username" id="username" class="form-control" placeholder="Username">
      </div>
      <div class="form-outline mb-4 was-validated">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" minlength="8" name="password" placeholder="Password" required>
        <div class="progress mt-3" style="height: 5px;">
          <div id="progressbar" class="progress-bar progress-bar-striped progress-bar-animated bg-danger" role="progressbar" style="width: 1%;">
          </div>
        </div>
        <div id="feedbackin" class="valid-feedback"></div>
        <div id="feedbackirn" class="invalid-feedback">8 more characters, Special characters, Upper case letters, Numbers, Lower case letters</div>
      </div>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="legal-check">
        <label class="form-check-label" for="legal-check">
          By creating your account, you agree to the
          <a class="text-decoration-none" href="/">Terms of Service</a> and
          <a class="text-decoration-none" href="/">Privacy Policy</a></label>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="notification-check">
        <label class="form-check-label" for="notification-check">I would like to be informed about news to improve my experience with Taskwolf</label>
      </div>
      <button type="button" id="register" class="btn btn-primary">REGISTER</button>
    </form>
  </body>
</html>

<script>
  let emailInput = document.getElementById("email");
  let usernameInput = document.getElementById("username");
  let passwordInput = document.getElementById("password");
  passwordInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("register").click();
    }
  });

  document.getElementById('register').onclick = function() {
    if (emailInput.value === "" || usernameInput.value === "" || passwordInput.value === "") {
      swal("Registration failed!", "Please fill in all fields", "error");
      return;
    }
    if (!passwordInput.checkValidity()) {
      swal("Registration failed!", "The password entered does not meet the requirements!", "error");
      return;
    }
    if (!document.getElementById("legal-check").checked) {
      swal("Registration failed!", "You have to accept the terms of service and privacy policy to continue!", "error");
      return;
    }
    let request = new HttpRequest("https://api.taskwolf.net/v1/verification/register/", "POST", [{key: "Content-Type", value: "application/json"}],
      {email: emailInput.value, name: usernameInput.value, password: passwordInput.value});
    request.send(function (status, responseText) {
      var response = JSON.parse(responseText);
      if (response.success === true) {
        window.location.href = "/register/email/";
      } else {
        swal("Registration failed!", "There is already an account with this email!", "error");
      }
    });
  };

  passwordInput.addEventListener('keypress', function(event) {
    updatePasswordProgress()
  });

  passwordInput.addEventListener('keyup', function(event) {
    updatePasswordProgress();
  });

  var passwordMatchedCases = [];
  passwordMatchedCases.push("[!@#$%&*_?]");
  passwordMatchedCases.push("[A-Z]");
  passwordMatchedCases.push("[0-9]");
  passwordMatchedCases.push("[a-z]");

  var passwordMessageCases = [];
  passwordMessageCases.push(" Special characters");
  passwordMessageCases.push(" Upper case letters");
  passwordMessageCases.push(" Numbers");
  passwordMessageCases.push(" Lower case letters");

  function updatePasswordProgress() {
    var messageCases = passwordMessageCases.slice();
    var status = 0;
    for (var i = 0; i < passwordMatchedCases.length; i++) {
      if (new RegExp(passwordMatchedCases[i]).test(passwordInput.value)) {
        messageCases.splice(messageCases.indexOf(passwordMessageCases[i]), 1);
        status++;
      }
    }
    if (passwordInput.value.length >= 8) {
      status++;
    }
    var progress;
    var strength;
    switch (status) {
      case 0:
        strength = "";
        progress = 1;
        break;
      case 1:
        strength = "Too Weak";
        progress = 15;
        break;
      case 2:
        strength = "Very Weak";
        progress = 30;
        break;
      case 3:
        strength = "Weak";
        progress = 45;
        break;
      default:
        strength = "Strong";
        progress = 75;
        break;
    }
    progress += passwordInput.value.length;
    var information = "";
    var progressBarClass;
    if (progress >= 75 && passwordInput.value.length >= 8) {
      passwordInput.setCustomValidity("");
      progressBarClass = "bg-success";
      information = "Strong";
    } else {
      passwordInput.setCustomValidity(strength);
      progressBarClass = "bg-danger";
      if(passwordInput.value.length < 8) {
        information += (8 - passwordInput.value.length) + " more characters, ";
      }
      information += messageCases;
    }
    $("#feedbackin, #feedbackirn").text(information);
    $("#progressbar").removeClass("bg-danger bg-warning bg-success").addClass(progressBarClass);
    $("#progressbar").width(progress + "%");
  }
</script>

{% load static %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/home-header.html' %}
    <form>
      <img id="register-logo" src="{% static 'img/logo.png' %}"></br></br>
      <h1 class="text-light">Registration</h1></br>
      <div class="form-outline mb-4">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="Email">
      </div>
      <div class="form-outline mb-4">
        <label for="username" class="form-label">Username</label>
        <input type="username" id="username" class="form-control" placeholder="Username">
      </div>
      <div class="form-outline mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Password"/>
      </div>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="legal-check">
        <label class="form-check-label" for="legal-check">By creating your account, you agree to the
          <a class="text-decoration-none" href="/">Terms of Service</a> and
          <a class="text-decoration-none" href="/">Privacy Policy</a></label>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="notification-check">
        <label class="form-check-label" for="notification-check">I would like to be informed about news to improve my experience with Taskwolf</label>
      </div>
      <button type="button" id="register" class="btn btn-primary mb-4">REGISTER</button></br>
      <div>
        <h id="registration-failed" class="text-danger"></h>
      </div>
    </form>
  </body>
</html>

<script>
  let emailInput = document.getElementById("email");
  let usernameInput = document.getElementById("username");
  let passwordInput = document.getElementById("password");
  passwordInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("register").click();
    }
  });

  document.getElementById('register').onclick = function() {
    if (emailInput.value === "" || usernameInput.value === "" || passwordInput.value === "") {
      document.getElementById("registration-failed").innerHTML = "Please fill in all entries";
      return;
    }
    if (!document.getElementById("legal-check").checked) {
      document.getElementById("registration-failed").innerHTML = "You have to accept the terms of service and privacy policy to continue!";
      return;
    }
    let request = new HttpRequest("https://api.taskwolf.net/verification/register/", "POST", [{key: "Content-Type", value: "application/json"}],
      {email: emailInput.value, name: usernameInput.value, password: passwordInput.value});
    request.send(function (status, responseText) {
      var response = JSON.parse(responseText);
      if (response.success === true) {
        window.location.href = "/register/email/";
      } else {
        document.getElementById("registration-failed").innerHTML = "There is already an account with this email!";
      }
    });
  };
</script>

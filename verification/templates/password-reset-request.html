{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
    {% include 'home-header.html' %}
    <form id="password-reset-container">
      <h1>{% trans 'home.password.reset.request.headline' %}</h1></br>
      <div class="form-outline mb-4">
        <label for="email" class="form-label">{% trans 'home.password.reset.request.email' %}</label>
        <input type="email" id="email" class="form-control" placeholder="{% trans 'home.password.reset.request.email' %}">
      </div>
      <button type="button" id="send" class="btn btn-primary mb-4">{% trans 'home.password.reset.request.send' %}</button></br>
      <label id="password-reset-status"></label>
    </form>
  </body>
</html>

<script>
  document.getElementById("email").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("send").click();
    }
  });

  document.getElementById('send').onclick = function() {
    let request = new HttpRequest("https://api.dulno.com/v1/password/reset/request/", "POST", [],
      {email: document.getElementById("email").value});
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      let statusElement = document.getElementById("password-reset-status");
      if (response.success === false) {
        statusElement.classList.remove("text-success");
        statusElement.classList.add("text-danger");
        if (response.errorCode === 1000) {
          statusElement.innerHTML = "{% trans 'home.password.reset.request.failed.not.found' %}";
        } else if (response.errorCode === 1001) {
          statusElement.innerHTML = "{% trans 'home.password.reset.request.failed.already.send' %}";
        }
      } else {
        statusElement.classList.remove("text-danger");
        statusElement.classList.add("text-success");
        statusElement.innerHTML = "{% trans 'home.password.reset.request.success' %}";
      }
    });
  };
</script>

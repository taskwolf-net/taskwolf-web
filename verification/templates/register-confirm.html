{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body class="dark">
    {% include 'templates/home-header.html' %}
  </body>
</html>

<script>
  $(document).ready(function() {
    let request = new HttpRequest("https://api.taskwolf.net/v1/verification/complete/", "POST",
      [], {user: "{{user}}", token: "{{token}}"});
    request.send(function (status, responseText) {
      var response = JSON.parse(responseText);
      if (response.success === false) {
        window.location.href = "/";
        return;
      }
      Cookie.create("token", response.token, 60 * 60 * 24 * 30, ".taskwolf.net");
      window.location.href = "/dashboard/";
    });
  });
</script>

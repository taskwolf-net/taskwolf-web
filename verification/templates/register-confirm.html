{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
    <div class="loader">
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    let request = new HttpRequest("https://api.dulno.com/v1/verification/complete/", "POST",
      [], {user: "{{user}}", token: "{{token}}"});
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      if (response.success === false) {
        window.location.href = "/";
        return;
      }
      sessionStorage.setItem("home-token", response.homeApiKey);
      window.location.href = "/payment/";
    });
  });
</script>

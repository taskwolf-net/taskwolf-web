{% load static %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/home-header.html' %}
    <form id="password-reset-container">
      <h1 class="text-light">Password Reset</h1></br>
      <div class="form-outline mb-4 was-validated">
        <label for="password" class="form-label">New password</label>
        <input type="password" class="form-control" id="password" minlength="8" name="password" placeholder="New Password" required>
        <div class="progress mt-3" style="height: 5px;">
          <div id="progressbar" class="progress-bar progress-bar-striped progress-bar-animated bg-danger" role="progressbar" style="width: 1%;">
          </div>
        </div>
        <div id="feedbackin" class="valid-feedback"></div>
        <div id="feedbackirn" class="invalid-feedback">8 more characters, Special characters, Upper case letters, Numbers, Lower case letters</div>
      </div>
      <div class="form-outline mb-4">
        <label for="password-repetition" class="form-label">New Password Repetition</label>
        <input type="password" id="password-repetition" class="form-control" placeholder="New Password Repetition">
      </div>
      <button type="button" id="send" class="btn btn-primary mb-4">SEND</button></br>
      <label id="password-reset-status"></label>
    </form>
  </body>
</html>

<script>
  let passwordInput = document.getElementById("password");

  document.getElementById("password-repetition").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("send").click();
    }
  });

  document.getElementById('send').onclick = function() {
    var statusElement = document.getElementById("password-reset-status");
    if (document.getElementById("password").value !== document.getElementById("password-repetition").value) {
      statusElement.classList.remove("text-success");
      statusElement.classList.add("text-danger");
      statusElement.innerHTML = "The two passwords do not match.";
      return;
    }
    if (!passwordInput.checkValidity()) {
      statusElement.classList.remove("text-success");
      statusElement.classList.add("text-danger");
      statusElement.innerHTML = "The password entered does not meet the requirements!";
      return;
    }
    let request = new HttpRequest("https://api.taskwolf.net/v1/password/reset/complete/", "POST", [{key: "Content-Type", value: "application/json"}],
      {user: "{{user}}", token: "{{token}}", newPassword: document.getElementById("password").value});
    request.send(function (status, responseText) {
      var response = JSON.parse(responseText);
      if (response.success === false) {
        statusElement.classList.remove("text-success");
        statusElement.classList.add("text-danger");
        if (response.errorCode === 1000) {
          statusElement.innerHTML = "You have not requested a password reset.";
        } else if (response.errorCode === 1001) {
          statusElement.innerHTML = "The reset link has expired, please request a new one.";
        }
      } else {
        statusElement.classList.remove("text-danger");
        statusElement.classList.add("text-success");
        statusElement.innerHTML = "Your password has been successfully reset. You can now return to the login page.";
      }
    });
  };

  passwordInput.addEventListener('keypress', function(event) {
    updatePasswordProgress()
  });

  passwordInput.addEventListener('keyup', function(event) {
    updatePasswordProgress();
  });

  var passwordMatchedCases = [];
  passwordMatchedCases.push("[!@#$%&*_?]");
  passwordMatchedCases.push("[A-Z]");
  passwordMatchedCases.push("[0-9]");
  passwordMatchedCases.push("[a-z]");

  var passwordMessageCases = [];
  passwordMessageCases.push(" Special characters");
  passwordMessageCases.push(" Upper case letters");
  passwordMessageCases.push(" Numbers");
  passwordMessageCases.push(" Lower case letters");

  function updatePasswordProgress() {
    var messageCases = passwordMessageCases.slice();
    var status = 0;
    for (var i = 0; i < passwordMatchedCases.length; i++) {
      if (new RegExp(passwordMatchedCases[i]).test(passwordInput.value)) {
        messageCases.splice(messageCases.indexOf(passwordMessageCases[i]), 1);
        status++;
      }
    }
    if (passwordInput.value.length >= 8) {
      status++;
    }
    var progress;
    var strength;
    switch (status) {
      case 0:
        strength = "";
        progress = 1;
        break;
      case 1:
        strength = "Too Weak";
        progress = 15;
        break;
      case 2:
        strength = "Very Weak";
        progress = 30;
        break;
      case 3:
        strength = "Weak";
        progress = 45;
        break;
      default:
        strength = "Strong";
        progress = 75;
        break;
    }
    progress += passwordInput.value.length;
    var information = "";
    var progressBarClass;
    if (progress >= 75 && passwordInput.value.length >= 8) {
      passwordInput.setCustomValidity("");
      progressBarClass = "bg-success";
      information = "Strong";
    } else {
      passwordInput.setCustomValidity(strength);
      progressBarClass = "bg-danger";
      if(passwordInput.value.length < 8) {
        information += (8 - passwordInput.value.length) + " more characters, ";
      }
      information += messageCases;
    }
    $("#feedbackin, #feedbackirn").text(information);
    $("#progressbar").removeClass("bg-danger bg-warning bg-success").addClass(progressBarClass);
    $("#progressbar").width(progress + "%");
  }
</script>

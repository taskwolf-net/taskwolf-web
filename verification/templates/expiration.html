{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
    <nav id="navbar">
      <div id="navbar-content">
        <a href="/" id="navbar-logo"><img src="{% static 'img/logo-light.webp' %}" class="dulno-logo" width="70px" height="70px" alt=""></a>
        <div id="header-control-container">
          <div id="profile-button-container" class="dropdown">
            <button class="dropdown-toggle btn" id="profile-button-wrapper" type="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              <i id="profile-picture" class="fa-regular fa-user"></i><i id="profile-picture-arrow" class="fa-solid fa-angle-down"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end" aria-labelledby="profile-button-wrapper">
              <li><button class="dropdown-item" id="settings-button" type="button">{% trans 'product.header.settings' %}</button></li>
              <li><button class="dropdown-item" id="tickets-button" type="button">{% trans 'product.header.tickets' %}</button></li>
              <li><div class="dropdown-divider"></div></li>
              <li><button class="dropdown-item" id="logout-button" type="button">{% trans 'product.header.logout' %}</button></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <div id="header-space"></div>
    <div id="expiration-container">
      <div id="expiration-wrapper" class="d-none">
        <div id="expiration-header" class="text-center">
          <h1 id="expiration-headline" class="fw-bold mb-5"></h1>
          <p id="expiration-description" class="mb-5"></p>
        </div>
        <div class="mx-auto my-5 w-75 border-bottom border-dark border-3"></div>
        {% include 'pricing-content.html' %}
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    displayLoader();
    if (!displayExpirationDescription()) {
      return;
    }
    setupPricing(function () {
      removeLoader();
    });
  });

  function displayExpirationDescription() {
    var hasPersonalPackage = sessionStorage.getItem("expiration-has-personal-package");
    var hasOwnOrganization = sessionStorage.getItem("expiration-has-own-organization");
    var isOrganizationMember = sessionStorage.getItem("expiration-is-organization-member");
    var userName = sessionStorage.getItem("expiration-user-name");
    if (hasPersonalPackage == null || hasOwnOrganization == null ||
      isOrganizationMember == null || userName == null
    ) {
      window.location.href = "/";
      return false;
    }
    if (!hasPersonalPackage && !isOrganizationMember) {
      document.getElementById("expiration-headline").innerText =
        "{% trans 'home.expiration.new.headline' %}";
      document.getElementById("expiration-description").innerText =
        "{% trans 'home.expiration.new.description' %}".replace("%s", userName);
      return true;
    }
    document.getElementById("expiration-headline").innerText =
      "{% trans 'home.expiration.known.headline' %}";
    if (hasPersonalPackage && !isOrganizationMember) {
      document.getElementById("expiration-description").innerText =
        "{% trans 'home.expiration.personal.description' %}".replace("%s", userName);
      return true;
    }
    if (!hasPersonalPackage && isOrganizationMember) {
      document.getElementById("expiration-description").innerText =
        "{% trans 'home.expiration.organisation.description' %}".replace("%s", userName);
      return true;
    }
    document.getElementById("expiration-description").innerText =
      "{% trans 'home.expiration.mixed.description' %}".replace("%s", userName);
    return true;
  }

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("expiration-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("expiration-container")
      .removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("expiration-wrapper").classList.remove("d-none");
  }

  document.getElementById('settings-button').onclick = function() {
    sessionStorage.setItem("settings-return", window.location.href);
    window.location.href = "/settings/profile/";
  };

  document.getElementById('tickets-button').onclick = function() {
    sessionStorage.setItem("neutral-return", window.location.href);
    window.location.href = "/tickets/";
  };

  document.getElementById('logout-button').onclick = function() {
    let request = new HttpRequest("https://api.dulno.com/v1/verification/logout/",
      "GET", []);
    request.send(function (status, responseText) {
      Cookie.destroy("home-token", ".dulno.com");
      window.location.href = "/";
    });
  };
</script>

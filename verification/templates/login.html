{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
     {% include 'home-header.html' %}
    <form>
      <img id="login-logo" src="{% static 'img/logo-light.webp' %}">
      <div class="form-outline mb-4">
        <label for="email" class="form-label">{% trans 'home.login.email' %}</label>
        <input type="email" id="email" class="form-control" placeholder="{% trans 'home.login.email' %}">
      </div>
      <div class="form-outline mb-4">
        <div class="d-flex">
          <label for="password" class="form-label">{% trans 'home.login.password' %}</label>
          <a id="forgot-password" href="/password/reset/request/">{% trans 'home.login.password.forgot' %}</a>
        </div>
        <input type="password" id="password" class="form-control" placeholder="{% trans 'home.login.password' %}"/>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="remember-check">
        <label class="form-check-label" for="remember-check" id="remember-check-label">{% trans 'home.login.remember' %}</label>
      </div>
      <button type="button" id="login" class="btn btn-primary">{% trans 'home.login.button' %}</button></br>
      <div id="login-alternative">
        <div class="login-alternative-divider"></div>
        <label class="text-muted mx-4">{% trans 'home.login.alternative' %}</label>
        <div class="login-alternative-divider"></div>
      </div>
      <div id="login-external-services">
        <button id="login-external-service-google" class="btn login-external-service-button" type="button"><img class="login-external-service-logo" src="{% static 'img/verification/google.webp' %}">{% trans 'home.login.google' %}</button>
      </div>
    </form>
  </body>
</html>

{% include '2fa.html' %}

<script>
  $(document).ready(function() {
    let rememberMe = Cookie.find("dulno-remember-me");
    if (rememberMe != null) {
      document.getElementById("email").value = rememberMe;
    }
  });

  document.getElementById("password").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("login").click();
    }
  });

  document.getElementById('login').onclick = function(event) {
    login("");
  };

  function login(multiFactorCode) {
    if (document.getElementById("remember-check").checked) {
      Cookie.create("dulno-remember-me", document.getElementById("email").value,
        12 * 30 * 24 * 60 * 60);
    }
    let request = new HttpRequest("https://api.dulno.com/v1/verification/login/", "POST", [],
      {email: document.getElementById("email").value, password: document.getElementById("password").value,
        multiFactorCode: multiFactorCode});
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      if ("homeApiKey" in response) {
        sessionStorage.setItem("home-token", response.homeApiKey);
      }
      let success = response.success;
      if (success === true) {
        Cookie.create("token", response.productApiKey, 60 * 60 * 24 * 30, ".dulno.com");
        Cookie.create("refresh-token", response.refreshToken, 60 * 60 * 24 * 30, ".dulno.com");
        if (!redirect()) {
          window.location.href = "/dashboard/";
        }
      } else {
        let error = response.error;
        if (error === 1002) {
          if (multiFactorCode === "") {
            display2FA(function(code) {login(code)});
          } else {
            Swal.fire("{% trans 'home.login.failed.two.factor.title' %}", "{% trans 'home.login.failed.two.factor.body' %}", "error").then((result) => {
              if (result.isConfirmed) {
                display2FA(function(code) {login(code)});
              }
            });
          }
          return;
        }
        if (error === 1000) {
          Swal.fire("{% trans 'home.login.failed.credentials.title' %}", "{% trans 'home.login.failed.credentials.body' %}", "error");
        } else  if (error === 1001) {
          Swal.fire("{% trans 'home.login.failed.confirmation.title' %}", "{% trans 'home.login.failed.confirmation.body' %}", "error");
        } else  if (error === 1003) {
          if (!redirect()) {
            sessionStorage.setItem("expiration-has-personal-package", response.hasPersonalBundle);
            sessionStorage.setItem("expiration-has-own-organization", response.hasOwnOrganization);
            sessionStorage.setItem("expiration-is-organization-member", response.isOrganizationMember);
            sessionStorage.setItem("expiration-user-name", response.userName);
            window.location.href = "/expiration/";
          }
        }
        document.getElementById("password").value = "";
      }
    });
  }

  function redirect() {
    if ("{{redirect}}" !== "") {
      window.location.href = "{{redirect}}";
      return true;
    }
    return false;
  }

  document.getElementById("login-external-service-google").onclick = function (event) {
    window.location.href = "https://accounts.google.com/o/oauth2/auth?access_type=offline&prompt=consent&client_id=544413433596-5i9issjef49s7tedlcmbkfdp750iom2b.apps.googleusercontent.com&redirect_uri=https://api.dulno.com/v1/google/login/&response_type=code&scope=https://www.googleapis.com/auth/userinfo.email%20https://www.googleapis.com/auth/userinfo.profile";
  }
</script>

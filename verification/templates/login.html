{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body class="dark">
     {% include 'templates/home-header.html' %}
    <form>
      <img id="login-logo" src="{% static 'img/logo.png' %}">
      <div class="form-outline mb-4">
        <label for="email" class="form-label">{% trans 'home.login.email' %}</label>
        <input type="email" id="email" class="form-control" placeholder="{% trans 'home.login.email' %}">
      </div>
      <div class="form-outline mb-4">
        <div class="d-flex">
          <label for="password" class="form-label">{% trans 'home.login.password' %}</label>
          <a id="forgot-password" href="/password/reset/request/">{% trans 'home.login.password.forgot' %}</a>
        </div>
        <input type="password" id="password" class="form-control" placeholder="{% trans 'home.login.password' %}"/>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="remember-check">
        <label class="form-check-label" for="remember-check" id="remember-check-label">{% trans 'home.login.remember' %}</label>
      </div>
      <button type="button" id="login" class="btn btn-primary">{% trans 'home.login.button' %}</button></br>
      <div id="login-alternative">
        <div class="login-alternative-divider"></div>
        <label class="text-muted mx-4">{% trans 'home.login.alternative' %}</label>
        <div class="login-alternative-divider"></div>
      </div>
      <div id="login-external-services">
        <button id="login-external-service-google" class="btn login-external-service-button" type="button"><img class="login-external-service-logo" src="{% static 'img/verification/google.jpg' %}">{% trans 'home.login.google' %}</button>
      </div>
    </form>
  </body>
</html>

<script>
  $(document).ready(function() {
    var rememberMe = Cookie.find("taskwolf-remember-me");
    if (rememberMe != null) {
      document.getElementById("email").value = rememberMe;
    }
  });

  document.getElementById("password").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("login").click();
    }
  });

  document.getElementById('login').onclick = function(event) {
    if (document.getElementById("remember-check").checked) {
      Cookie.create("taskwolf-remember-me", document.getElementById("email").value,
        12 * 30 * 24 * 60 * 60);
    }
    let request = new HttpRequest("https://api.taskwolf.net/v1/verification/login/", "POST", [],
      {email: document.getElementById("email").value, password: document.getElementById("password").value});
    request.send(function (status, responseText) {
      var response = JSON.parse(responseText);
      if ("homeApiKey" in response) {
        Cookie.create("home-token", response.homeApiKey, 60 * 60 * 24, ".taskwolf.net");
      }
      var success = response.success;
      if (success === true) {
        Cookie.create("token", response.productApiKey, 60 * 60 * 24 * 30, ".taskwolf.net");
        window.location.href = "/dashboard/";
      } else {
        var error = response.error;
        if (error === 1000) {
          Swal.fire("{% trans 'home.login.failed.credentials.title' %}", "{% trans 'home.login.failed.credentials.body' %}", "error");
        } else  if (error === 1001) {
          Swal.fire("{% trans 'home.login.failed.confirmation.title' %}", "{% trans 'home.login.failed.confirmation.body' %}", "error");
        } else  if (error === 1002) {
          window.location.href = "/payment/";
        } else  if (error === 1003) {
          Swal.fire("{% trans 'home.login.failed.expired.title' %}", "{% trans 'home.login.failed.expired.body' %}", "error");
        }
        document.getElementById("password").value = "";
      }
    });
  };

  document.getElementById("login-external-service-google").onclick = function (event) {
    window.location.href = "https://accounts.google.com/o/oauth2/auth?access_type=offline&prompt=consent&client_id=544413433596-5i9issjef49s7tedlcmbkfdp750iom2b.apps.googleusercontent.com&redirect_uri=https://api.taskwolf.net/v1/google/login/&response_type=code&scope=https://www.googleapis.com/auth/userinfo.email%20https://www.googleapis.com/auth/userinfo.profile";
  }
</script>

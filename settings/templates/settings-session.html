{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
    {% include 'settings-header.html' %}
    <div class="settings-container">
      {% include 'settings-sidebar.html' %}
      <div class="sidebar-influenced d-none">
        <div class="settings-content">
          <h1 class="settings-headline">{% trans 'settings.session.headline' %}</h1>
          <div id="settings-session-container">
            <ul id="settings-session-list">
            </ul>
            <div class="text-center">
              <span id="settings-session-empty" class="d-none">{% trans 'settings.session.empty' %}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    displayLoader();
    fetchSessions(function (sessions) {
      displaySessions(sessions);
      removeLoader();
    });
  });

  function fetchSessions(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/settings/sessions/", "GET",
      []);
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText).sessions);
    });
  }

  function displaySessions(sessions) {
    for (let i = 0; i < sessions.length; i++) {
      let session = sessions[i];
      displaySession(session.id, session.platform, session.country, session.city,
        session.openTime, session.status, session.isCurrent);
    }
    if (sessions.length === 0) {
      document.getElementById("settings-session-empty").classList.remove("d-none");
    }
  }

  function displaySession(id, platform, country, city, openTime, status, isCurrent) {
    let entry = document.createElement("li");
    entry.classList.add("d-flex", "justify-content-between", "align-items-center");
    let entryPrefix = document.createElement("div");
    entryPrefix.classList.add("d-flex", "align-items-center");
    let entryIconContainer = document.createElement("div");
    entryIconContainer.classList.add("settings-session-icon");
    let entryIcon = document.createElement("h2");
    entryIcon.classList.add("fa-solid");
    if (platform === "WINDOWS" || platform === "LINUX" || platform === "MAC") {
      entryIcon.classList.add("fa-computer");
    }
    if (platform === "ANDROID" || platform === "IOS") {
      entryIcon.classList.add("fa-mobile-screen-button");
    }
    entryIconContainer.appendChild(entryIcon);
    entryPrefix.appendChild(entryIconContainer);
    let entryDescription = document.createElement("div");
    let entryPlatform = document.createElement("b");
    entryPlatform.classList.add("mb-0");
    entryPlatform.innerHTML = platform;
    entryDescription.appendChild(entryPlatform);
    let entryLocation = document.createElement("p");
    entryLocation.classList.add("mb-0");
    entryLocation.innerHTML = city + ", " + country;
    entryDescription.appendChild(entryLocation);
    let entryOpenTime = document.createElement("p");
    entryOpenTime.classList.add("mb-0");
    entryOpenTime.innerHTML = new Date(openTime).toLocaleString();
    entryDescription.appendChild(entryOpenTime);
    entryPrefix.appendChild(entryDescription);
    entry.appendChild(entryPrefix);
    let entrySuffix = document.createElement("div");
    entrySuffix.classList.add("d-flex", "align-items-center");
    entrySuffix.appendChild(createSessionStatusBatch(status, isCurrent));
    if (status === "ACTIVE" && !isCurrent) {
      entrySuffix.appendChild(createSessionSettingsButton(id));
    }
    entry.appendChild(entrySuffix);
    document.getElementById("settings-session-list").appendChild(entry);
  }

  function createSessionStatusBatch(status, isCurrent) {
    let statusElement = document.createElement("span");
    statusElement.classList.add("settings-session-status");
    if (isCurrent) {
      statusElement.innerHTML = "{% trans 'settings.session.current' %}";
      statusElement.classList.add("settings-session-active");
    } else if (status === "ACTIVE") {
      statusElement.innerHTML = "{% trans 'settings.session.active' %}";
      statusElement.classList.add("settings-session-active");
    } else {
      statusElement.innerHTML = "{% trans 'settings.session.closed' %}";
      statusElement.classList.add("settings-session-closed");
    }
    return statusElement;
  }

  function createSessionSettingsButton(id) {
    let settingsDiv = document.createElement("div");
    settingsDiv.classList.add("settings-session-settings");
    let settingsButton = document.createElement("button");
    settingsButton.type = "button";
    settingsButton.classList.add("settings-session-settings-button", "fa-solid",
      "fa-ellipsis-vertical");
    settingsButton.setAttribute("data-bs-toggle", "dropdown");
    settingsButton.setAttribute("aria-expanded", "false");
    settingsDiv.appendChild(settingsButton);
    let dropdown = createSessionSettingsDropdown([
      {icon: "fa-circle-xmark", content: "{% trans 'settings.session.close' %}",
        color: "text-danger", click: function() {closeSession(id)}}
    ]);
    settingsDiv.appendChild(dropdown);
    return settingsDiv;
  }

  function createSessionSettingsDropdown(buttons) {
    let dropdown = document.createElement("ul");
    dropdown.classList.add("settings-session-settings-dropdown", "dropdown-menu");
    for (let i = 0; i < buttons.length; i++) {
      let button = buttons[i];
      dropdown.appendChild(createSessionSettingsDropdownButton(dropdown, button.icon,
        button.content, button.color, button.click));
    }
    return dropdown;
  }

  function createSessionSettingsDropdownButton(dropdown, icon, content, color, click) {
    let dropdownEntry = document.createElement("li");
    dropdownEntry.classList.add("settings-session-settings-dropdown-entry", "dropdown-item");
    let dropdownEntryIcon = document.createElement("i");
    dropdownEntryIcon.classList.add("fa-solid", icon);
    dropdownEntry.appendChild(dropdownEntryIcon);
    let dropdownEntryLabel = document.createElement("label");
    dropdownEntryLabel.innerText = content;
    dropdownEntry.appendChild(dropdownEntryLabel);
    if (color !== undefined) {
      dropdownEntryIcon.classList.add(color);
      dropdownEntryLabel.classList.add(color);
    }
    dropdownEntry.onclick = function (event) {
      $(dropdown).dropdown('toggle');
      click();
    };
    return dropdownEntry;
  }

  function closeSession(id) {
    Swal.fire({
      title: "{% trans 'settings.session.close.title' %}",
      text: "{% trans 'settings.session.close.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://api.taskwolf.net/v1/settings/session/close/", "POST",
          [], {session: id});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'settings.session.close.successful.title' %}",
            "{% trans 'settings.session.close.successful.body' %}", "success")
            .then(success => window.location.reload());
        });
      }
    });
  }

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementsByClassName("settings-container")[0].appendChild(loader);
  }

  function removeLoader() {
    document.getElementsByClassName("settings-container")[0]
      .removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementsByClassName("sidebar-influenced")[0].classList.remove("d-none");
  }
</script>

{% load static %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'home-header.html' %}
    <div id="email-change">
      <div class="success-icon-wrapper">
        <div class="success-icon">
          <div class="success-icon__tip"></div>
          <div class="success-icon__long"></div>
        </div>
      </div>
      <h1 id="email-change-headline">Email change completed</h1>
      <p id="email-change-description">You have successfully changed your account email. You can now continue with the login.</p>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    let request = new HttpRequest("/settings/account/email/change/complete/", "POST",
      [], {user: "{{user}}", token: "{{token}}"});
    request.send(function (status, responseText) {
      let request = new HttpRequest("/verification/logout/",
        "GET", []);
      request.send(function (status, responseText) {
        Cookie.destroy("token");
        Cookie.destroy("refresh-token");
        Cookie.destroy("home-token");
        window.location.href = "/";
      });
    });
  });
</script>

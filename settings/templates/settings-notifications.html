{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'settings-header.html' %}
    <div class="settings-container">
      {% include 'settings-sidebar.html' %}
      <div class="sidebar-influenced">
        <div class="settings-content">
          <h1 class="settings-headline mb-5">{% trans 'settings.notification.headline' %}</h1>
          <div id="settings-notification-general-container">
            <h3 id="settings-notification-general-headline">{% trans 'settings.notification.general.headline' %}</h3>
            <form>
              <div class="form-outline mb-4 d-flex justify-content-between">
                <label id="settings-notification-general" class="switch">
                  <input id="settings-notification-general-input" type="checkbox">
                  <span class="slider slider-green round"></span>
                </label>
                <label class="switch-label">{% trans 'settings.notification.general' %}</label>
              </div>
            </form>
          </div>
          <div id="settings-notification-specific-container">
            <h3 id="settings-notification-specific-headline">{% trans 'settings.notification.specific.headline' %}</h3>
            <form>
              <div class="form-outline mb-4 d-flex justify-content-between">
                <label id="settings-notification-workflow-fail" class="switch">
                  <input id="settings-notification-workflow-fail-input" type="checkbox">
                  <span class="slider round"></span>
                </label>
                <label class="switch-label">{% trans 'settings.notification.workflow.fail' %}</label>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  let updateLock = false;

  $(document).ready(function() {
    let request = new HttpRequest("/settings/notification/", "GET",
      []);
    request.send(function (status, responseText) {
      let settings = JSON.parse(responseText);
      document.getElementById("settings-notification-general-input").checked = settings.general;
      document.getElementById("settings-notification-workflow-fail-input").checked = settings.workflowFail;
    });
  });

  document.getElementById("settings-notification-general").onclick = function(event) {
    updateNotificationSettings(!document.getElementById("settings-notification-general-input").checked,
      document.getElementById("settings-notification-workflow-fail-input").checked);
  }

  document.getElementById("settings-notification-workflow-fail").onclick = function(event) {
    updateNotificationSettings(document.getElementById("settings-notification-general-input").checked,
      !document.getElementById("settings-notification-workflow-fail-input").checked);
  }

  function updateNotificationSettings(general, workflowFail) {
    if(updateLock) {
      return;
    }
    updateLock = true;
    let request = new HttpRequest("/settings/notification/change/", "POST",
      [], {general: general, workflowFail: workflowFail});
    request.send(function (status, responseText) {
      updateLock = false;
    });
  }
</script>

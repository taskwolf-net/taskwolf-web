{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'settings-header.html' %}
    <div class="settings-container">
      {% include 'settings-sidebar.html' %}
      <div class="sidebar-influenced">
        <div class="settings-content">
          <h1 class="settings-headline">{% trans 'settings.profile.headline' %}</h1>
          <form>
            <div class="form-outline mb-4">
              <label for="settings-profile-name" class="form-label">{% trans 'settings.profile.name' %}</label>
              <div>
                <input id="settings-profile-name" type="name" class="form-control" maxlength=32 placeholder="{% trans 'settings.profile.name' %}">
              </div>
              <button id="settings-profile-update-button" type="button" class="btn btn-success mt-4">{% trans 'settings.profile.name.update' %}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    displayCurrentUsername();
  });

  function displayCurrentUsername() {
    let request = new HttpRequest("/settings/profile/username/", "GET",
      []);
    request.send(function (status, responseText) {
      document.getElementById("settings-profile-name").value = JSON.parse(responseText).username;
      for (let element of [...document.querySelectorAll('input[maxlength]')]) {
        element.addEventListener('input', tickInputMaxLength)
        element.parentElement.classList.add('max-length-badged');
        tickInputMaxLength(element)
      }
    });
  }

  function tickInputMaxLength(element) {
    if (element.target) {
      element = element.target
    }
    let limit = element.maxLength;
    let parent = element.parentElement;
    let length = element.value.length;
    parent.dataset['limit'] = limit;
    parent.dataset['remaining'] = limit - length;
    parent.classList.remove('max-length-reached');
    if (length === limit) {
      parent.classList.add('max-length-reached');
    }
  }

  document.getElementById("settings-profile-name").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("settings-profile-update-button").click();
    }
  });

  document.getElementById("settings-profile-update-button").onclick = function(event) {
    let request = new HttpRequest("/settings/profile/username/change/", "POST",
      [], {username: document.getElementById("settings-profile-name").value});
    request.send(function (status, responseText) {
      Swal.fire("{% trans 'settings.profile.name.changed.title' %}", "{% trans 'settings.profile.name.changed.body' %}", "success");
    });
  };
</script>

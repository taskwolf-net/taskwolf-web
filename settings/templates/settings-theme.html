{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body class="dark">
    {% include 'templates/settings-header.html' %}
    <div class="settings-container">
      {% include 'templates/settings-sidebar.html' %}
      <div class="sidebar-influenced">
        <div class="settings-content">
          <h1 class="settings-headline">{% trans 'settings.theme.headline' %}</h1>
          <div id="settings-theme-container">
            <button id="settings-theme-dark" class="settings-theme">
              <i class="fa-regular fa-moon settings-theme-icon"></i>
              <h4>{% trans 'settings.theme.dark' %}</h4>
            </button>
            <button  id="settings-theme-light" class="settings-theme">
              <i class="fa-regular fa-lightbulb settings-theme-icon"></i>
              <h4>{% trans 'settings.theme.light' %}</h4>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    var theme = Cookie.find("taskwolf-theme");
    document.getElementById("settings-theme-" + theme).classList.add("settings-theme-selected");
  });

  document.getElementById("settings-theme-dark").onclick = function(event) {
    Cookie.create("taskwolf-theme", "dark", 60 * 60 * 24 * 365, ".taskwolf.net");
    window.location.reload();
  }

  document.getElementById("settings-theme-light").onclick = function(event) {
    Cookie.create("taskwolf-theme", "light", 60 * 60 * 24 * 365, ".taskwolf.net");
    window.location.reload();
  }
</script>

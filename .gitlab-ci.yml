stages:
  - publish
  - deploy

variables:
  DOCKER_IMAGE: "dulno-web"
  DOCKER_STATIC_IMAGE: "dulno-web-static"
  KUBERNETES_RESOURCE: "deployment/dulno-web-deployment"

publish:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
    - docker build -t $DOCKER_REGISTRY/$DOCKER_IMAGE:latest .
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker build -t $DOCKER_REGISTRY/DOCKER_STATIC_IMAGE:latest nginx/.
    - docker push $DOCKER_REGISTRY/DOCKER_STATIC_IMAGE:latest
  only:
    - master

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBERNETES_CONFIGURATION" > ~/.kube/config
    - apk add --no-cache curl
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - curl -X POST -F token=$NGINX_PIPELINE_TRIGGER_TOKEN -F ref=master $NGINX_PIPELINE_TRIGGER_URL
  only:
    - master

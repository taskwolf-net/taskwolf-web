stages:
  - publish
  - deploy

variables:
  DOCKER_IMAGE: "$DOCKER_REGISTRY/dulno-web"

publish:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
    - docker build -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:latest
  only:
    - master

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  dependencies:
    - publish
  before_script:
    - /bin/sh -c "mkdir -p ~/.kube"
    - /bin/sh -c "echo \"$KUBERNETES_CONFIGURATION\" > ~/.kube/config"
  script:
    - /bin/sh -c "kubectl rollout restart deployment/dulno-web-deployment"
  only:
    - master

stages:
  - publish
  - deploy

variables:
  DOCKER_IMAGE: "$DOCKER_REGISTRY/dulno-web"

publish:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin $DOCKER_REGISTRY
    - docker build -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:latest
  only:
    - master

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart deployment/dulno-web-deployment
  only:
    - master

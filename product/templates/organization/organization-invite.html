{% load static %}
<html lang="en">
{% include 'templates/head.html' %}
<body>
{% include 'templates/product-header.html' %}
{% include 'templates/product-sidebar.html' %}
<div class="sidebar-influenced">
  <form>
    <h1 class="text-light">Invite to Organization</h1></br>
    <div class="form-outline mb-4">
      <label for="id" class="form-label">User ID</label>
      <input type="id" id="id" class="form-control" placeholder="User ID">
    </div>
    <button type="button" id="invite" class="btn btn-primary mb-4">INVITE</button></br>
  </form>
  <p id="invitation-failed" class="text-danger"></p>
</div>
</body>
</html>

<script>
  document.getElementById("id").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("invite").click();
    }
  });

  document.getElementById('invite').onclick = function() {
    var organization = location.href.replace(location.host, "").replace(location.protocol, "").replace("organization", "").replace("invite", "").replaceAll("/", "");
    let request = new HttpRequest("https://api.taskwolf.net/organization/invite/", "POST",
      [{key: "Content-Type", value: "application/json"}, {key: "API-KEY", value: Cookie.find("token")}],
      {organization: organization, target: document.getElementById("id").value});
    request.send(function (status, responseText) {
      var json = JSON.parse(responseText);
      if (json.success === true) {
        window.location.href = window.location.href.replace("invite/", "");
        return;
      }
      var errorCode = json.errorCode;
      var failedElement = document.getElementById("invitation-failed");
      if (errorCode === 1000) {
        failedElement.innerHTML = "There is no organization with this id!";
      }
      if (errorCode === 1001) {
        failedElement.innerHTML = "Insufficient permissions!";
      }
      if (errorCode === 1002) {
        failedElement.innerHTML = "You have already invited this user to your organization!";
      }
      if (errorCode === 1003) {
        failedElement.innerHTML = "This user is already a member of your organization!";
      }
      if (errorCode === 1004) {
        failedElement.innerHTML = "You can't invite yourself!";
      }
      if (errorCode === 1005) {
        failedElement.innerHTML = "The user could not be found!";
      }
      failedElement.style.display = "flex";
    });
  };
</script>

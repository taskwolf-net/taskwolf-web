{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body class="dark">
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="organization-container">
        <div id="organization-wrapper" class="d-none">
          <div id="organization-header">
            <div>
              <button id="organization-leave" type="button" class="btn btn-danger">{% trans 'product.organization.leave' %}</button>
            </div>
            <div>
              <h1 id="organization-name" class="fw-bold"></h1>
            </div>
            <div>
              <button id="organization-rename" type="button" class="fa-solid fa-pen-to-square"></button>
            </div>
          </div>
          <h2 id="organization-owner-headline">{% trans 'product.organization.owner' %}</h2>
          <ul id="organization-owner">
          </ul>
          <div id="organization-members-header">
            <h2 id="organization-members-headline">{% trans 'product.organization.members' %}</h2>
            <button type="button" id="organization-invite" class="btn btn-primary btn-block">{% trans 'product.organization.copy.link' %}</button>
            <button type="button" id="organization-link-regenerate" class="btn btn-secondary btn-block"><span class="fa-solid fa-rotate-right"></span></button>
          </div>
          <ul id="organization-members">
          </ul>
          <div id="organization-members-empty">
            <span id="organization-members-empty-headline">{% trans 'product.organization.empty' %}</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var organization;

  $(document).ready(function() {
    displayLoader();
    fetchOrganizationData(function() {
      displayInformation();
      displayLeaveButton();
      removeLoader();
    });
    var membersHeader = document.getElementById("organization-members-header");
    applyTooltips(document.getElementById("organization-invite"), membersHeader, "{% trans 'product.organization.copy.link.tooltip' %}");
    applyTooltips(document.getElementById("organization-link-regenerate"), membersHeader, "{% trans 'product.organization.regenerate.link.tooltip' %}");
  });

  function fetchOrganizationData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/organization/", "GET", []);
    request.send(function (status, responseText) {
      organization = JSON.parse(responseText);
      callback();
    });
  }

  function displayInformation() {
    document.getElementById("organization-name").innerHTML = organization.name;
    document.getElementById("organization-owner").appendChild(createUserEntry(organization.owner, "li"));
    var memberListElement = document.getElementById("organization-members");
    if (organization.members.length === 0) {
      document.getElementById("organization-members-empty").style.display = "flex";
    }
    for (let i = 0; i < organization.members.length; i++) {
      var member = organization.members[i];
      var memberElement = createUserEntry(member.name, "li");
      if (organization.isOwner === true) {
        var memberKickElement = document.createElement("span");
        memberKickElement.classList.add("organization-member-kick", "fa", "fa-ban", "text-danger");
        memberKickElement.onclick = function (event) {
          let request = new HttpRequest("https://api.taskwolf.net/v1/organization/kick/", "POST",
            [],
            {organization: organization.id, target: member.id});
          request.send(function (status, responseText) {
            location.reload();
          });
        }
        applyTooltips(memberKickElement, memberElement, "{% trans 'product.organization.kick' %}")
        memberElement.appendChild(memberKickElement);
      }
      memberListElement.appendChild(memberElement);
    }
    if (organization.isOwner === true) {
      document.getElementById("organization-invite").style.display = "block";
      document.getElementById("organization-link-regenerate").style.display = "block";
    }
  }

  function createUserEntry(user, elementType) {
    var memberElement = document.createElement(elementType);
    memberElement.classList.add("organization-user");
    var memberInformationContainer = document.createElement("div");
    memberInformationContainer.classList.add("organization-user-information");
    var memberIconElement = document.createElement("i");
    memberIconElement.classList.add("organization-user-icon", "fa-regular", "fa-user");
    memberInformationContainer.appendChild(memberIconElement);
    var memberNameElement = document.createElement("span");
    memberNameElement.classList.add("organization-user-name");
    memberNameElement.innerHTML = user;
    memberInformationContainer.appendChild(memberNameElement);
    memberElement.appendChild(memberInformationContainer);
    return memberElement;
  }

  function displayLeaveButton() {
    if (organization.isOwner === true) {
      document.getElementById("organization-leave").classList.add("d-none");
    }
  }

  function displayLoader() {
    var loader = document.createElement("div");
    loader.id = "organization-loader";
    loader.classList.add("loader");
    document.getElementById("organization-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("organization-container").removeChild(document.getElementById("organization-loader"));
    document.getElementById("organization-wrapper").classList.remove("d-none");
  }

  document.getElementById("organization-invite").onclick = function (event) {
    var linkButton = document.getElementById("organization-invite");
    linkButton.classList.remove("btn-primary");
    linkButton.classList.add("btn-success");
    $('#organization-invite').tooltip('hide');
    applyTooltips(linkButton, document.getElementById("organization-members-header"), "{% trans 'product.organization.copied.link.tooltip' %}");
    $('#organization-invite').tooltip('show');
    let request = new HttpRequest("https://api.taskwolf.net/v1/organization/link/", "POST", [], {organization: organization.id});
    request.send(function (status, responseText) {
      navigator.clipboard.writeText(JSON.parse(responseText).link);
    });
  }

  document.getElementById("organization-link-regenerate").onclick = function (event) {
    var linkButton = document.getElementById("organization-invite");
    linkButton.classList.remove("btn-success");
    linkButton.classList.add("btn-primary");
    $('#organization-link-regenerate').tooltip('hide');
    applyTooltips(linkButton, document.getElementById("organization-members-header"), "{% trans 'product.organization.copy.link.tooltip' %}");
    let request = new HttpRequest("https://api.taskwolf.net/v1/organization/link/regenerate/", "POST",
      [], {organization: organization.id});
    request.send(function (status, responseText) {

    });
  }

  document.getElementById("organization-leave").onclick = function (event) {
    Swal.fire({
      title: "{% trans 'product.organization.leave.title' %}",
      text: "{% trans 'product.organization.leave.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://api.taskwolf.net/v1/organization/leave/", "POST",
          [], {organization: organization});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.organization.leave.successful.title' %}", "{% trans 'product.organization.leave.successful.body' %}", "success").then(success => window.location.href = "/organizations/");
        });
      }
    });
  }

  document.getElementById("organization-rename").onclick = function (event) {
    var content = document.createElement("div");
    content.classList.add("organization-rename-content");
    var text = document.createElement("p");
    text.innerText = "{% trans 'product.organization.rename.body' %}";
    content.appendChild(text);
    var input = document.createElement("input");
    input.placeholder = "{% trans 'product.organization.rename.name' %}";
    content.appendChild(input);
    Swal.fire({
      title: "{% trans 'product.organization.rename.title' %}",
      html: content,
      icon: "info",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        if (input.value.replaceAll(" ", "") === "") {
          Swal.fire("{% trans 'product.organization.rename.empty.title' %}", "{% trans 'product.organization.rename.empty.body' %}", "error");
          return;
        }
        let request = new HttpRequest("https://api.taskwolf.net/v1/organization/rename/", "POST",
          [], {organization: organization.id, name: input.value});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.organization.rename.successful.title' %}", "{% trans 'product.organization.rename.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }

  function applyTooltips(element, container, text) {
    $(element).attr("data-bs-toggle", "tooltip");
    $(element).attr("data-bs-placement", "top");
    $(element).attr("data-bs-title", text);
    container.classList.add("position-relative");
    new bootstrap.Tooltip(element, {
      container: container
    });
  }
</script>

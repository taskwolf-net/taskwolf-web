{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <form>
        <h1 class="text-light">{% trans 'product.organization.create.headline' %}</h1></br>
        <div class="form-outline mb-4">
          <label for="name" class="form-label">{% trans 'product.organization.create.name' %}</label>
          <input type="name" id="name" class="form-control" placeholder="{% trans 'product.organization.create.name' %}">
        </div>
        <button type="button" id="create" class="btn btn-primary mb-4">{% trans 'product.organization.create.button' %}</button></br>
      </form>
    </div>
  </body>
</html>

<script>
  document.getElementById("name").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("create").click();
    }
  });

  document.getElementById('create').onclick = function() {
    let request = new HttpRequest("https://api.taskwolf.net/v1/organization/create/", "POST",
      [],
      {name: document.getElementById("name").value});
    request.send(function (status, responseText) {
      window.location.href = "/organizations/";
    });
  };
</script>

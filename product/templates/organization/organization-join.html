{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
    <div id="organization-join-container">
      {% include 'verification-header.html' %}
      <div id="organization-join-wrapper">
        <div id="organization-join-success" class="success-icon-wrapper d-none">
          <div class="success-icon">
            <div class="success-icon__tip"></div>
            <div class="success-icon__long"></div>
          </div>
        </div>
        <div id="organization-join-error-container" class="d-none">
          <svg id="organization-join-error" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="error">
            <circle class="solid" fill="none" stroke-linecap="round" stroke-width="4" stroke-miterlimit="10" cx="32" cy="32" r="30"/>
            <circle class="animation" fill="none" stroke-linecap="round" stroke-width="4" stroke-miterlimit="10" cx="32" cy="32" r="30"/>

            <line class="left" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" x1="19.271" y1="19.521" x2="44.729" y2="44.979"/>
            <line class="right" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" x1="44.729" y1="19.521" x2="19.271" y2="44.979"/>
          </svg>
        </div>
        <h1 id="organization-join-headline"></h1>
        <p id="organization-join-description"></p>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    if (sessionStorage.getItem("home-token") == null) {
      window.location.href = "/login-register/?redirect=" +
        window.location.href.replace("https://dulno.com", "");
      return;
    }
    let request = new HttpRequest("https://api.dulno.com/v1/organization/join/", "POST",
      [], {organization: "{{organization}}", token: "{{token}}"});
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      if (response.success === false) {
        document.getElementById("organization-join-error-container").classList.remove("d-none");
        setTimeout(function () {
          document.getElementById("organization-join-error").classList.add("toggle");
        }, 100);
        document.getElementById("organization-join-headline").innerText = "{% trans 'product.organization.join.failed.headline' %}";
        let descriptionElement = document.getElementById("organization-join-description");
        if (response.errorCode === 1000) {
          descriptionElement.innerHTML = "{% trans 'product.organization.join.failed.not.exists' %}";
        } else if (response.errorCode === 1001) {
          descriptionElement.innerHTML = "{% trans 'product.organization.join.failed.already.member' %}";
        } else if (response.errorCode === 1002) {
          descriptionElement.innerHTML = "{% trans 'product.organization.join.failed.link.expired' %}";
        } else if (response.errorCode === 1003) {
          descriptionElement.innerHTML = "{% trans 'product.organization.join.failed.full' %}";
        }
      } else {
        document.getElementById("organization-join-success").classList.remove("d-none");
        document.getElementById("organization-join-headline").innerText = "{% trans 'product.organization.join.successful.headline' %}";
        document.getElementById("organization-join-description").innerHTML = "{% trans 'product.organization.join.successful.description' %}";
      }
    });
  });
</script>

<script>
  const scanId = "{{scan}}";
  const scanToken = "{{token}}";

  const deepLink = `taskwolf://scan?scan=${scanId}&token=${scanToken}`;

  const playStoreUrl = "https://play.google.com/store/apps/details?id=net.taskwolf.app&pcampaignid=web_share";

  window.location.href = deepLink;

  setTimeout(() => {
    if (/Android/.test(navigator.userAgent)) {
      window.location.href = playStoreUrl;
    } else {
      window.location.href = "/";
    }
  }, 2000);
</script>

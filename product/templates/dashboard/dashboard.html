{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="dashboard-container">
        <div id="dashboard-wrapper" class="d-none">
          <div id="dashboard-header">
            <div id="dashboard-target-dropdown" class="dropdown">
              <button id="dashboard-target-dropdown-button" class="btn btn-secondary dropdown-toggle bg-dark" type="button" data-bs-toggle="dropdown">
                {% trans 'target' %}
              </button>
              <ul id="dashboard-target-dropdown-list" class="dropdown-menu dropdown-menu-dark">
              </ul>
            </div>
            <h1 id="dashboard-headline">{% trans 'product.dashboard.headline' %}</h1>
          </div>
          <div id="dashboard-content">
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    displayLoader();
    fetchTargetsData(function(response) {
      var targets = response.targets;
      var currentTarget = response.currentTarget;
      for (var i = 0; i < targets.length; i++) {
        addTarget(targets[i]);
      }
      selectTarget(targets.filter((target) => target.id === currentTarget)[0]);
    });
  });

  function fetchTargetsData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/targets/all/", "GET",
      []);
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText));
    });
  }

  function addTarget(target) {
    var targetElement = document.createElement("li");
    targetElement.classList.add("dropdown-item");
    var targetNameName = document.createElement("b");
    targetNameName.innerHTML = target.name;
    targetElement.appendChild(targetNameName);
    targetElement.onclick = function(event) {
      selectTarget(target);
    }
    document.getElementById("dashboard-target-dropdown-list").appendChild(targetElement);
  }

  function selectTarget(target) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/target/change/", "POST",
      [], {target: target.id});
    request.send(function (status, responseText) {
      document.getElementById("dashboard-target-dropdown-button").innerHTML = "{% trans 'target' %}: " + target.name;
      displayDashboard();
    });
  }

  function displayDashboard() {
    document.getElementById("dashboard-content").innerHTML = "";
    let request = new HttpRequest("https://api.taskwolf.net/v1/dashboard/", "GET", []);
    request.send(function (status, responseText) {
      var response = JSON.parse(responseText);
      Cookie.create("grafana_session", response.token, 60 * 10, ".taskwolf.net");
      var iframe = document.createElement("iframe");
      iframe.src = response.url;
      iframe.onload = function(event) {
        //Cookie.destroy("grafana_session", ".taskwolf.net");
        removeLoader();
      }
      document.getElementById("dashboard-content").appendChild(iframe);
    });
  }

  function displayLoader() {
    var loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("dashboard-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("dashboard-container").removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("dashboard-wrapper").classList.remove("d-none");
  }
</script>

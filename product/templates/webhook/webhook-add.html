{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <form>
        <h1>{% trans 'product.webhook.add.headline' %}</h1></br>
        <div class="form-outline mb-4">
          <label for="name" class="form-label">{% trans 'product.webhook.add.name' %}</label>
          <input type="name" id="name" class="form-control" maxlength=64 placeholder="{% trans 'product.webhook.add.name' %}">
        </div>
        <button type="button" id="add" class="btn btn-primary mb-4">{% trans 'product.webhook.add.button' %}</button></br>
      </form>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    for (let element of [...document.querySelectorAll('input[maxlength]')]) {
      element.addEventListener('input', tickInputMaxLength)
      element.parentElement.classList.add('max-length-badged');
      tickInputMaxLength(element)
    }
  });

  function tickInputMaxLength(element) {
    if (element.target) {
      element = element.target
    }
    let limit = element.maxLength;
    let parent = element.parentElement;
    let length = element.value.length;
    parent.dataset['limit'] = limit;
    parent.dataset['remaining'] = limit - length;
    parent.classList.remove('max-length-reached');
    if (length === limit) {
      parent.classList.add('max-length-reached');
    }
  }

  document.getElementById("name").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("add").click();
    }
  });

  document.getElementById("add").onclick = function() {
    let addButton = document.getElementById("add");
    addButton.classList.add("disabled");
    addButton.innerHTML = "{% trans 'product.webhook.add.button' %}" + `
      <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true"></span>
      <span class="visually-hidden" role="status">Loading...</span>
    `;
    let request = new HttpRequest("/webhook/add/", "POST",
      [],
      {name: document.getElementById("name").value});
    request.send(function (status, responseText) {
      if (status !== 200) {
        addButton.classList.remove("disabled");
        addButton.innerHTML = "{% trans 'product.webhook.add.button' %}";
      }
      if (status === 400) {
        Swal.fire("{% trans 'product.webhook.add.limit.reached.title' %}",
          "{% trans 'product.webhook.add.limit.reached.body' %}", "error");
        return;
      }
      window.location.href = "/webhook/" + JSON.parse(responseText).webhook + "/";
    });
  };
</script>

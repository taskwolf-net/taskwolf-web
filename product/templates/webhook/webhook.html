{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="webhook-container">
        <div id="webhook-wrapper" class="d-none">
          <div id="webhook-header">
            <h1 id="webhook-name"></h1>
            <div id="webhook-modification">
              <button id="webhook-delete" type="button" class="btn btn-danger">{% trans 'product.webhook.delete' %}</button>
              <button id="webhook-rename" type="button" class="fa-solid fa-pen-to-square"></button>
            </div>
          </div>
          <div id="webhook-content">
            <div id="webhook-url-section" class="webhook-section">
              <label class="form-label">{% trans 'product.webhook.url' %}</label>
              <div id="webhook-url-section-content" class="webhook-section-content">
                <input id="webhook-url" class="form-control" readonly>
                <button type="button" id="webhook-url-copy" class="btn btn-primary btn-block">{% trans 'product.webhook.url.copy' %}</button>
              </div>
            </div>
            <div id="webhook-key-section" class="webhook-section">
              <label class="form-label">{% trans 'product.webhook.key' %}</label>
              <div id="webhook-key-section-content" class="webhook-section-content">
                <input type="password" id="webhook-key" class="form-control" readonly>
                <button type="button" id="webhook-key-copy" class="btn btn-primary btn-block">{% trans 'product.webhook.key.copy' %}</button>
                <button type="button" id="webhook-key-regenerate" class="btn btn-secondary btn-block"><span class="fa-solid fa-rotate-right"></span></button>
              </div>
            </div>
            <div id="webhook-testing-section" class="webhook-section my-5 pt-5">
              <label class="form-label">{% trans 'product.webhook.testing' %}</label>
              <div id="webhook-testing-section-content" class="webhook-section-content">
                <div class="webhook-code">
                  <button id="webhook-testing-code-copy" class="webhook-code-copy"><i class="fa-solid fa-copy"></i></button>
                  <div>
                    <label class="me-4">POST</label><label id="webhook-testing-url"></label><label class="ms-4 text-secondary">HTTP/1.1</label><br><br>
                  </div>
                  <div>
                    <label class="text-info">Authorization:</label> <label>Bearer ********************************</label><br>
                  </div>
                  <div>
                    <label class="text-info">Content-Type:</label> <label>text/plain</label><br><br>
                  </div>
                  <div>
                    <label>Some information</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  let webhook;
  let key;

  $(document).ready(function() {
    displayLoader();
    fetchWebhookData(function() {
      key = webhook.key;
      document.getElementById("webhook-name").innerHTML = webhook.name;
      document.getElementById("webhook-url").value = webhook.url;
      document.getElementById("webhook-testing-url").innerText = webhook.url;
      applyTooltips(document.getElementById("webhook-url-copy"),
        document.getElementById("webhook-url-section-content"),
        "{% trans 'product.webhook.url.copy.tooltip' %}");
      document.getElementById("webhook-key").value = webhook.key;
      applyTooltips(document.getElementById("webhook-key-copy"),
        document.getElementById("webhook-key-section-content"),
        "{% trans 'product.webhook.key.copy.tooltip' %}");
      applyTooltips(document.getElementById("webhook-key-regenerate"),
        document.getElementById("webhook-key-section-content"),
        "{% trans 'product.webhook.key.regenerate.tooltip' %}");
      removeLoader();
    });
  });

  function fetchWebhookData(callback) {
    let location = window.location;
    let id = location.href.replace(location.host, "").replace(location.protocol, "").replace("webhook", "").replaceAll("/", "");
    let request = new HttpRequest("https://api.dulno.com/v1/webhook/find/", "POST",
      [], {webhook: id});
    request.send(function (status, responseText) {
      webhook = JSON.parse(responseText);
      callback();
    });
  }

  document.getElementById("webhook-url-copy").onclick = function (event) {
    let urlButton = document.getElementById("webhook-url-copy");
    urlButton.classList.remove("btn-primary");
    urlButton.classList.add("btn-success");
    $('#webhook-url-copy').tooltip('hide');
    applyTooltips(urlButton, document.getElementById("webhook-url-section-content"),
      "{% trans 'product.webhook.url.copied.tooltip' %}");
    $('#webhook-url-copy').tooltip('show');
    navigator.clipboard.writeText(webhook.url);
  }

  document.getElementById("webhook-key-copy").onclick = function (event) {
    let keyButton = document.getElementById("webhook-key-copy");
    keyButton.classList.remove("btn-primary");
    keyButton.classList.add("btn-success");
    $('#webhook-key-copy').tooltip('hide');
    applyTooltips(keyButton, document.getElementById("webhook-key-section-content"),
      "{% trans 'product.webhook.key.copied.tooltip' %}");
    $('#webhook-key-copy').tooltip('show');
    navigator.clipboard.writeText(key);
  }

  document.getElementById("webhook-key-regenerate").onclick = function (event) {
    let keyButton = document.getElementById("webhook-key-copy");
    keyButton.classList.remove("btn-success");
    keyButton.classList.add("btn-primary");
    $('#webhook-key-regenerate').tooltip('hide');
    applyTooltips(keyButton, document.getElementById("webhook-key-section-content"),
      "{% trans 'product.webhook.key.copy.tooltip' %}");
    let request = new HttpRequest("https://api.dulno.com/v1/webhook/key/regenerate/", "POST",
      [], {webhook: webhook.id});
    request.send(function (status, responseText) {
      key = JSON.parse(responseText).key;
      document.getElementById("webhook-key").value = key;
    });
  }

  document.getElementById("webhook-testing-code-copy").onclick = function(event) {
    navigator.clipboard.writeText('curl -X POST -H "Authorization: Bearer ' +
      webhook.key + '" -H "Content-Type: text/plain" -d "Some information" ' +
      webhook.url);
  }

  document.getElementById("webhook-delete").onclick = function (event) {
    Swal.fire({
      title: "{% trans 'product.webhook.delete.title' %}",
      text: "{% trans 'product.webhook.delete.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://api.dulno.com/v1/webhook/remove/", "POST",
          [], {webhook: webhook.id});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.webhook.delete.successful.title' %}", "{% trans 'product.webhook.delete.successful.body' %}", "success").then(success => window.location.href = "/webhooks/");
        });
      }
    });
  }

  document.getElementById("webhook-rename").onclick = function (event) {
    let content = document.createElement("div");
    content.classList.add("webhook-rename-content");
    let text = document.createElement("p");
    text.innerText = "{% trans 'product.webhook.rename.body' %}";
    content.appendChild(text);
    let inputContainer = document.createElement("div");
    inputContainer.classList.add("mb-3", "mx-auto");
    inputContainer.style.width = "min(260px, 100%)";
    let input = document.createElement("input");
    input.classList.add("w-100");
    input.placeholder = "{% trans 'product.webhook.rename.name' %}";
    input.maxLength = 64;
    input.addEventListener('input', tickInputMaxLength);
    inputContainer.appendChild(input);
    input.parentElement.classList.add('max-length-badged');
    tickInputMaxLength(input);
    content.appendChild(inputContainer);
    Swal.fire({
      title: "{% trans 'product.webhook.rename.title' %}",
      html: content,
      icon: "info",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        if (input.value.replaceAll(" ", "") === "") {
          Swal.fire("{% trans 'product.webhook.rename.empty.title' %}", "{% trans 'product.webhook.rename.empty.body' %}", "error");
          return;
        }
        let request = new HttpRequest("https://api.dulno.com/v1/webhook/rename/", "POST",
          [], {webhook: webhook.id, name: input.value});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.webhook.rename.successful.title' %}", "{% trans 'product.webhook.rename.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }

  function tickInputMaxLength(element) {
    if (element.target) {
      element = element.target
    }
    let limit = element.maxLength;
    let parent = element.parentElement;
    let length = element.value.length;
    parent.dataset['limit'] = limit;
    parent.dataset['remaining'] = limit - length;
    parent.classList.remove('max-length-reached');
    if (length === limit) {
      parent.classList.add('max-length-reached');
    }
  }

  function applyTooltips(element, container, text) {
    $(element).attr("data-bs-toggle", "tooltip");
    $(element).attr("data-bs-placement", "top");
    $(element).attr("data-bs-title", text);
    container.classList.add("position-relative");
    new bootstrap.Tooltip(element, {
      container: container
    });
  }

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("webhook-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("webhook-container").removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("webhook-wrapper").classList.remove("d-none");
  }
</script>

{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="templates-container">
        <div id="templates-wrapper" class="d-none">
          <h1 id="templates-headline">{% trans 'product.templates.headline' %}</h1>
          <div id="templates-header">
            <div id="templates-search-box">
              <input id="templates-search-input" placeholder="{% trans 'product.templates.search' %}" type="text" class="form-control" value="" autocomplete="off">
              <button type="button">
                <i class="fa fa-search"></i>
              </button>
            </div>
          </div>
          <ul id="templates-list">
          </ul>
          <button id="templates-load-more" type="button" class="btn btn-outline-success d-block mx-auto px-5 mt-5 d-none">{% trans 'product.templates.load.more' %} +</button>
          <div id="templates-empty" class="d-none">
            <b id="templates-empty-headline">{% trans 'product.templates.empty' %}</b>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var bundle;
  var totalPages = 0;
  var loadedPages = 0;
  var currentPageState = "";
  var currentSearch = "";

  $(document).ready(function() {
    displayLoader();
    fetchBundle(function (result) {
      bundle = result;
      fetchMoreTemplates(function (templates) {
        displayTemplates(templates);
        removeLoader();
      });
    });
  });

  function updateTemplates() {
    document.getElementById("templates-list").innerHTML = "";
    loadedPages = 0;
    currentPageState = "";
    fetchMoreTemplates(function (templates) {
      displayTemplates(templates);
    });
  }

  function fetchMoreTemplates(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/templates/load/", "POST",
      [], {pageState: currentPageState, search: currentSearch});
    request.send(function (status, responseText) {
      var result = JSON.parse(responseText);
      currentPageState = result.page;
      totalPages = result.pageNumber;
      loadedPages++;
      callback(result.templates);
    });
  }

  function fetchBundle(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/bundle/", "GET", []);
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText));
    });
  }

  function displayTemplates(templates) {
    var displayedEntries = 0;
    for (var i = 0; i < templates.length; i++) {
      var entry = templates[i];
      displayTemplate(entry.name, entry.description, entry.trigger, entry.actions,
        entry.accessType, bundle.type === "TRIAL");
      displayedEntries++;
    }
    if (displayedEntries === 0) {
      document.getElementById("templates-empty").classList.remove("d-none");
      document.getElementById("templates-load-more").classList.add("d-none");
    } else {
      document.getElementById("templates-empty").classList.add("d-none");
      if (loadedPages < totalPages) {
        document.getElementById("templates-load-more").classList.remove("d-none");
      } else {
        document.getElementById("templates-load-more").classList.add("d-none");
      }
    }
  }

  function displayTemplate(name, description, trigger, actions, accessType, isTrial) {
    var entryElement = document.createElement("li");
    entryElement.classList.add("template-entry");
    entryElement.appendChild(createWorkflowElement(trigger, actions));
    var nameElement = document.createElement("b");
    nameElement.innerHTML = name;
    entryElement.appendChild(nameElement);
    var descriptionElement = document.createElement("span");
    descriptionElement.innerHTML = description;
    entryElement.appendChild(descriptionElement);
    entryElement.onclick = function(event) {
      if (isTrial && accessType === "CHARGEABLE") {
        return;
      }
      clickTemplate(name, description, trigger, actions);
    }
    if (isTrial && accessType === "CHARGEABLE") {
      var chargeableElement = document.createElement("i");
      chargeableElement.classList.add("template-entry-chargeable", "fa-solid",
        "fa-crown", "text-warning");
      entryElement.appendChild(chargeableElement);
      entryElement.classList.add("template-entry-unavailable");
      applyTooltips(chargeableElement, entryElement,
        "{% trans 'product.templates.chargeable.tooltip' %}");
    } else {
      entryElement.role = "button";
      applyTooltips(entryElement, document.getElementById("templates-list"),
        "{% trans 'product.templates.tooltip' %}");
    }
    document.getElementById("templates-list").appendChild(entryElement);
  }

  function clickTemplate(name, description, trigger, actions) {
    sessionStorage.removeItem("workflow-name");
    sessionStorage.removeItem("workflow-description");
    sessionStorage.removeItem("workflow-trigger");
    sessionStorage.removeItem("workflow-actions");
    sessionStorage.removeItem("workflow-conditions");
    sessionStorage.removeItem("workflow-selected");
    sessionStorage.removeItem("workflow-id");
    sessionStorage.setItem("workflow-name", name);
    sessionStorage.setItem("workflow-description", description);
    sessionStorage.setItem("workflow-trigger", JSON.stringify({
      "module": trigger.module,
      "moduleLogo": trigger.moduleLogo,
      "type": trigger.type,
      "typeDescription": trigger.typeDescription,
      "selected": true
    }));
    var encodedActions = [];
    for (var i = 0; i < actions.length; i++) {
      var action = actions[i];
      encodedActions.push({
        "actionIndex": action.actionIndex,
        "module": action.module,
        "moduleLogo": action.moduleLogo,
        "type": action.type,
        "typeDescription": action.typeDescription,
        "selected": true
      });
    }
    sessionStorage.setItem("workflow-actions", JSON.stringify({actions: encodedActions}));
    window.location.href = "/workflow/";
  }

  function createWorkflowElement(trigger, actions) {
    var workflowElement = document.createElement("div");
    workflowElement.classList.add("template-workflow");
    workflowElement.appendChild(createLogoElement(trigger));
    for (var i = 0; i < actions.length; i++) {
      workflowElement.appendChild(createArrowElement());
      workflowElement.appendChild(createLogoElement(actions[i]));
    }
    return workflowElement;
  }

  function createLogoElement(module) {
    var logoElement = document.createElement("img");
    logoElement.src = "{% static '' %}" + "img/applications/" + module.moduleLogo;
    logoElement.width = 64;
    logoElement.height = 64;
    return logoElement;
  }

  function createArrowElement() {
    var arrow = document.createElement("span");
    arrow.classList.add("template-workflow-arrow");
    arrow.innerHTML = "&#10132;";
    return arrow;
  }

  function applyTooltips(element, container, text) {
    $(element).attr("data-bs-toggle", "tooltip");
    $(element).attr("data-bs-placement", "top");
    $(element).attr("data-bs-title", text);
    container.classList.add("position-relative");
    new bootstrap.Tooltip(element, {
      container: container
    });
  }

  var currentSearchTimeout = -1;

  document.getElementById("templates-search-input").oninput = function(event) {
    if (currentSearchTimeout !== -1) {
      clearTimeout(currentSearchTimeout);
    }
    currentSearchTimeout = setTimeout(function () {
      currentSearchTimeout = -1;
      currentSearch = event.target.value;
      updateTemplates();
    }, 500);
  };

  document.getElementById("templates-load-more").onclick = function (event) {
    fetchMoreTemplates(function (templates) {
      displayTemplates(templates);
    });
  }

  function displayLoader() {
    var loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("templates-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("templates-container").removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("templates-wrapper").classList.remove("d-none");
  }
</script>

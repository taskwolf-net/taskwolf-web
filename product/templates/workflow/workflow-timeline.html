{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="workflow-timeline-container">
        <div id="workflow-timeline-wrapper" class="d-none">
          <div id="workflow-timeline-header">
            <button id="workflow-timeline-page-back"><i class="fa-solid fa-arrow-left-long"></i></button>
            <h1 id="workflow-timeline-headline" class="fw-bold text-center mb-0">{% trans 'product.workflow.timeline.headline' %}</h1>
          </div>
          <button type="button" id="workflow-timeline-reset" class="btn btn-danger btn-block d-none">{% trans 'product.workflow.timeline.reset' %}</button>
          <hr id="workflow-timeline-divider" class="hr"/>
          <section id="workflow-timeline-section">
            <ul id="workflow-timeline" class="timeline">
            </ul>
          </section>
          <span id="workflow-timeline-empty">{% trans 'product.workflow.timeline.empty' %}</span>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  let timeline;

  $(document).ready(function() {
    displayLoader();
    if (sessionStorage.getItem("workflow-selected") === null || sessionStorage.getItem("workflow-id") === null) {
      return;
    }
    fetchTimelineData(function() {
      displayTimeline();
      removeLoader();
    });
  });

  function fetchTimelineData(callback) {
    let request = new HttpRequest("https://api.dulno.com/v1/workflow/timeline/find/", "POST",
      [], {workflow: sessionStorage.getItem("workflow-id")});
    request.send(function (status, responseText) {
      timeline = JSON.parse(responseText).timeline;
      callback();
    });
  }

  function displayTimeline() {
    document.getElementById("workflow-timeline").innerHTML = "";
    for (let i = 0; i < timeline.length; i++) {
      displayEntry(timeline[i], i === 0);
    }
    if (timeline.length === 0) {
      document.getElementById("workflow-timeline-empty").style.display = "block";
    } else {
      document.getElementById("workflow-timeline-reset").classList.remove("d-none");
    }
  }

  function displayEntry(entry, isFirst) {
    let entryElement = document.createElement("li");
    entryElement.classList.add("timeline-item", "mb-5");
    let entryHeaderElement = document.createElement("div");
    entryHeaderElement.classList.add("timeline-item-header");
    let entryTitleElement = document.createElement("h5");
    entryTitleElement.classList.add("timeline-item-title", "fw-bold");
    entryTitleElement.innerHTML = entry.title;
    entryHeaderElement.appendChild(entryTitleElement);
    let entryDateElement = document.createElement("p");
    entryDateElement.classList.add("timeline-item-date", "mb-2", "fw-bold");
    entryDateElement.innerHTML = entry.time;
    entryHeaderElement.appendChild(entryDateElement);
    entryElement.appendChild(entryHeaderElement);
    if (entry.isFailure) {
      let entryFailureContainer = document.createElement("div");
      entryFailureContainer.classList.add("w-100", "mb-3", "d-flex", "justify-content-between", "align-items-start");
      let entryFailureElement = document.createElement("h6");
      entryFailureElement.classList.add("mb-0");
      entryFailureElement.innerHTML = "<b>{% trans 'product.workflow.timeline.cause' %}: </b>" + entry.failureModuleName + " - " + entry.failureStepName;
      entryFailureContainer.appendChild(entryFailureElement);
      if (isFirst && checkWorkflowStepsInitialState()) {
        let step = JSON.parse(sessionStorage.getItem("workflow-steps"))
          .steps.filter(item => item.index === entry.failureStepIndex)[0];
        let entryFailureViewButton = document.createElement("button");
        entryFailureViewButton.classList.add("btn", "btn-primary", "px-2", "ms-3");
        entryFailureViewButton.innerText = "{% trans 'product.workflow.timeline.view' %}";
        entryFailureViewButton.onclick = function (event) {
          sessionStorage.setItem("workflow-step-index", step.index.toString());
          window.location.href = "/workflow/" + step.kind +"/";
        };
        entryFailureContainer.appendChild(entryFailureViewButton);
      }
      entryElement.appendChild(entryFailureContainer);
    }
    let entryDescriptionElement = document.createElement("p");
    entryDescriptionElement.innerHTML = entry.description;
    entryElement.appendChild(entryDescriptionElement);
    if (entry.level === "SUCCESS") {
      entryElement.classList.add("timeline-item-success");
      entryTitleElement.classList.add("text-success");
    }
    if (entry.level === "FAILURE") {
      entryElement.classList.add("timeline-item-failure");
      entryTitleElement.classList.add("text-danger");
    }
    document.getElementById("workflow-timeline").appendChild(entryElement);
  }

  function checkWorkflowStepsInitialState() {
    return sessionStorage.getItem("workflow-steps") ===
      sessionStorage.getItem("workflow-initial-steps");
  }

  document.getElementById("workflow-timeline-reset").onclick = function (event) {
    Swal.fire({
      title: "{% trans 'product.workflow.timeline.reset.title' %}",
      text: "{% trans 'product.workflow.timeline.reset.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://api.dulno.com/v1/workflow/timeline/reset/", "POST",
          [], {workflow: sessionStorage.getItem("workflow-id")});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.workflow.timeline.reset.successful.title' %}", "{% trans 'product.workflow.timeline.reset.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }

  document.getElementById("workflow-timeline-page-back").onclick = function (event) {
    window.location.href = "/workflow/";
  }

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("workflow-timeline-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("workflow-timeline-container").removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("workflow-timeline-wrapper").classList.remove("d-none");
  }
</script>

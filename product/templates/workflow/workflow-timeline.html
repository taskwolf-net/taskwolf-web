{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="workflow-timeline-container">
        <h1 id="workflow-timeline-headline">{% trans 'product.workflow.timeline.headline' %}</h1>
        <button type="button" id="workflow-timeline-reset" class="btn btn-danger btn-block d-none">{% trans 'product.workflow.timeline.reset' %}</button>
        <hr id="workflow-timeline-divider" class="hr"/>
        <section id="workflow-timeline-section">
          <ul id="workflow-timeline" class="timeline">
          </ul>
        </section>
        <span id="workflow-timeline-empty">{% trans 'product.workflow.timeline.empty' %}</span>
      </div>
    </div>
  </body>
</html>

<script>
  var timeline;

  $(document).ready(function() {
    if (sessionStorage.getItem("workflow-selected") === null || sessionStorage.getItem("workflow-id") === null) {
      return;
    }
    fetchTimelineData(function() {
      displayTimeline();
    });
  });

  function fetchTimelineData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/workflow/timeline/find/", "POST",
      [], {workflow: sessionStorage.getItem("workflow-id")});
    request.send(function (status, responseText) {
      timeline = JSON.parse(responseText).timeline;
      callback();
    });
  }

  function displayTimeline() {
    document.getElementById("workflow-timeline").innerHTML = "";
    for (var i = 0; i < timeline.length; i++) {
      displayEntry(timeline[i]);
    }
    if (timeline.length === 0) {
      document.getElementById("workflow-timeline-empty").style.display = "block";
    } else {
      document.getElementById("workflow-timeline-reset").classList.remove("d-none");
    }
  }

  function displayEntry(entry) {
    var entryElement = document.createElement("li");
    entryElement.classList.add("timeline-item", "mb-5");
    var entryHeaderElement = document.createElement("div");
    entryHeaderElement.classList.add("timeline-item-header");
    var entryTitleElement = document.createElement("h5");
    entryTitleElement.classList.add("timeline-item-title", "fw-bold");
    entryTitleElement.innerHTML = entry.title;
    entryHeaderElement.appendChild(entryTitleElement);
    var entryDateElement = document.createElement("p");
    entryDateElement.classList.add("timeline-item-date", "mb-2", "fw-bold");
    entryDateElement.innerHTML = entry.time;
    entryHeaderElement.appendChild(entryDateElement);
    entryElement.appendChild(entryHeaderElement);
    var entryDescriptionElement = document.createElement("p");
    entryDescriptionElement.innerHTML = entry.description;
    entryElement.appendChild(entryDescriptionElement);
    if (entry.level === "SUCCESS") {
      entryElement.classList.add("timeline-item-success");
      entryTitleElement.classList.add("text-success");
    }
    if (entry.level === "FAILURE") {
      entryElement.classList.add("timeline-item-failure");
      entryTitleElement.classList.add("text-danger");
    }
    document.getElementById("workflow-timeline").appendChild(entryElement);
  }

  document.getElementById("workflow-timeline-reset").onclick = function (event) {
    swal({
      title: "{% trans 'product.workflow.timeline.reset.title' %}",
      text: "{% trans 'product.workflow.timeline.reset.body' %}",
      icon: "warning",
      dangerMode: true,
      buttons: true,
    }).then(willDelete => {
      if (willDelete) {
        let request = new HttpRequest("https://api.taskwolf.net/v1/workflow/timeline/reset/", "POST",
          [], {workflow: sessionStorage.getItem("workflow-id")});
        request.send(function (status, responseText) {
          swal("{% trans 'product.workflow.timeline.reset.successful.title' %}", "{% trans 'product.workflow.timeline.reset.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }
</script>

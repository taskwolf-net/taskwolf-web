{% load static %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="workflow-publish">
        <button id="workflow-publish-button" type="button" class="btn btn-success disabled">PUBLISH</button>
      </div>
      <div id="workflow-delete">
        <button id="workflow-delete-button" type="button" class="btn btn-danger">DELETE</button>
      </div>
      <div id="workflow-container">
        <h1 id="workflow-headline">Workflow</h1>
        <div id="workflow-inputs">
          <div class="form-outline mb-4">
            <label for="workflow-name" class="form-label">Name</label>
            <input type="name" id="workflow-name" class="form-control" placeholder="Name">
          </div>
          <div class="form-outline mb-5">
            <label for="workflow-description" class="form-label">Description</label>
            <input type="description" id="workflow-description" class="form-control" placeholder="Description">
          </div>
          <hr id="workflow-divider" class="hr mb-5"/>
        </div>
        <div id="workflow-components">
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    displayWorkflow();
  });

  function displayWorkflow() {
    document.getElementById("workflow-components").innerHTML = "";
    if(sessionStorage.getItem("workflow-name") !== null) {
      document.getElementById("workflow-name").value = sessionStorage.getItem("workflow-name");
    }
    if(sessionStorage.getItem("workflow-description") !== null) {
      document.getElementById("workflow-description").value = sessionStorage.getItem("workflow-description");
    }
    if (sessionStorage.getItem("workflow-trigger") === null) {
      sessionStorage.setItem("workflow-trigger", JSON.stringify(createEmptyComponent("Starts the workflow and triggers the chain of further actions")));
    }
    var trigger = JSON.parse(sessionStorage.getItem("workflow-trigger"));
    createComponentElement("Trigger", trigger.typeDescription, trigger.moduleLogo, "trigger", 0, trigger.selected);
    if (sessionStorage.getItem("workflow-actions") === null) {
      sessionStorage.setItem("workflow-actions", JSON.stringify({actions: [createEmptyComponent("Is executed as soon as the workflow is triggered")]}));
    }
    displayActions();
    checkPublishability();
    if (sessionStorage.getItem("workflow-selected") !== null) {
      document.getElementById("workflow-delete").style.display = "block";
    }
  }

  function displayActions() {
    var conditions = sessionStorage.getItem("workflow-conditions") == null ? [] :
      JSON.parse(sessionStorage.getItem("workflow-conditions")).conditions;
    var actions = JSON.parse(sessionStorage.getItem("workflow-actions")).actions;
    for (let i = 0; i < actions.length; i++) {
      var action = actions[i];
      var arrow = drawArrow(i);
      createComponentElement((i + 1) + ". Action", action.typeDescription, action.moduleLogo, "action", i, action.selected);
      var actionConditions = conditions.filter(element => element.actionIndex === i);
      for (var j = 0; j < actionConditions.length; j++) {
        var condition = actionConditions[j];
        arrow = createConditionElement(arrow, condition.actionIndex, j, condition.selected);
      }
    }
    createAddActionButton(actions.length);
  }

  function createComponentElement(title, description, logo, type, index, selected) {
    var componentContainer = document.createElement("div");
    componentContainer.classList.add("workflow-entry", "workflow-" + type);
    if (type === "action" && ((sessionStorage.getItem("workflow-actions") != null && JSON.parse(sessionStorage.getItem("workflow-actions")).actions.length > 1) || (!selected && index > 0))) {
      createActionRemoveButton(index, componentContainer);
    }
    var componentHeadline = document.createElement("div");
    componentHeadline.classList.add("workflow-headline");
    if (logo !== "") {
      var logoElement = document.createElement("img");
      logoElement.src = "{% static '' %}" + "img/applications/" + logo;
      logoElement.width = 48;
      logoElement.height = 48;
      componentHeadline.appendChild(logoElement);
    }
    var componentHeadlineContent = document.createElement("h1");
    componentHeadlineContent.innerHTML = title;
    if (selected) {
      componentContainer.classList.add("workflow-entry-selected");
      componentHeadline.classList.add("workflow-headline-selected");
    }
    componentHeadline.appendChild(componentHeadlineContent);
    componentContainer.appendChild(componentHeadline);
    componentContainer.appendChild(document.createElement("br"));
    var componentDescription = document.createElement("span");
    componentDescription.innerHTML = description;
    componentDescription.classList.add("workflow-entry-description");
    componentContainer.appendChild(componentDescription);
    componentContainer.appendChild(document.createElement("br"));
    componentContainer.appendChild(document.createElement("br"));
    componentContainer.onclick = function (event) {
      if (event.target.classList.contains("workflow-action-remove-container") || event.target.classList.contains("workflow-action-remove")) {
        return;
      }
      if (type === "action") {
        sessionStorage.setItem("workflow-action-index", index.toString());
      }
      window.location.href = "/workflow/" + type + "/";
    }
    document.getElementById("workflow-components").appendChild(componentContainer);
  }

  function createActionRemoveButton(index, componentContainer) {
    var actionRemoveContainer = document.createElement("div");
    actionRemoveContainer.classList.add("workflow-action-remove-container");
    var iconContainer = document.createElement("i");
    iconContainer.classList.add("workflow-action-remove", "fa-solid", "fa-xmark");
    actionRemoveContainer.appendChild(iconContainer);
    actionRemoveContainer.addEventListener("click", function(event) {
      if (sessionStorage.getItem("workflow-actions") !== null) {
        var actions = JSON.parse(sessionStorage.getItem("workflow-actions"));
        actions.actions = actions.actions.filter(item => actions.actions.indexOf(item) !== index);
        sessionStorage.setItem("workflow-actions", JSON.stringify(actions));
      }
      displayWorkflow();
    });
    componentContainer.appendChild(actionRemoveContainer);
  }

  function drawArrow(index) {
    var arrow = createArrow();
    document.getElementById("workflow-components").appendChild(createConditionButton(arrow, index, 0));
    document.getElementById("workflow-components").appendChild(arrow);
    return arrow;
  }

  function createArrow() {
    var arrowContainer = document.createElement("div");
    arrowContainer.classList.add("arrow-container");
    arrowContainer.innerHTML = '<svg><defs><marker id="markerArrow" markerWidth="13" markerHeight="13" refX="2" refY="6" orient="auto"><path d="M2,2 L2,11 L10,6 L2,2" style="fill: #ffffff;" /></marker></defs><line x1="10" y1="0" x2="10" y2="100" class="arrow" /></svg>';
    return arrowContainer;
  }

  function createConditionButton(arrowElement, actionIndex, conditionIndex) {
    var buttonContainer = document.createElement("div");
    buttonContainer.classList.add("workflow-condition-add-container");
    var iconContainer = document.createElement("i");
    iconContainer.classList.add("workflow-condition-add", "fa-solid", "fa-filter");
    buttonContainer.appendChild(iconContainer);
    iconContainer.addEventListener("click", function(event) {
      var condition = {
        "type": "",
        "actionIndex": actionIndex,
        "content": "",
        "selected": false
      }
      if (sessionStorage.getItem("workflow-conditions") === null) {
        sessionStorage.setItem("workflow-conditions", JSON.stringify({conditions: [condition]}));
      } else {
        var conditions = JSON.parse(sessionStorage.getItem("workflow-conditions")).conditions;
        var actionConditions = conditions.filter(item => item.actionIndex === actionIndex);
        actionConditions.splice(conditionIndex, 0, condition);
        conditions = conditions.filter(item => item.actionIndex !== actionIndex).concat(actionConditions);
        sessionStorage.setItem("workflow-conditions", JSON.stringify({conditions: conditions}));
      }
      displayWorkflow();
    });
    return buttonContainer;
  }

  function createConditionElement(arrowElement, actionIndex, conditionIndex, selected) {
    var componentContainer = document.createElement("div");
    componentContainer.classList.add("workflow-entry", "workflow-condition");
    createConditionRemoveButton(actionIndex, conditionIndex, componentContainer);
    var componentHeadline = document.createElement("div");
    componentHeadline.classList.add("workflow-headline");
    var componentHeadlineContent = document.createElement("h1");
    componentHeadlineContent.innerHTML = "Condition";
    if (selected) {
      componentContainer.classList.add("workflow-entry-selected");
      componentHeadline.classList.add("workflow-headline-selected");
    }
    componentHeadline.appendChild(componentHeadlineContent);
    componentContainer.appendChild(componentHeadline);
    componentContainer.appendChild(document.createElement("br"));
    var componentDescription = document.createElement("span");
    componentDescription.innerHTML = "Can influence the behavior of the following actions";
    componentDescription.classList.add("workflow-entry-description");
    componentContainer.appendChild(componentDescription);
    componentContainer.appendChild(document.createElement("br"));
    componentContainer.appendChild(document.createElement("br"));
    componentContainer.onclick = function (event) {
      if (event.target.classList.contains("workflow-condition-remove-container") || event.target.classList.contains("workflow-condition-remove")) {
        return;
      }
      sessionStorage.setItem("workflow-condition-index", actionIndex.toString() + ":" + conditionIndex.toString());
      window.location.href = "/workflow/condition/";
    }
    arrowElement.parentNode.insertBefore(componentContainer, arrowElement.nextSibling);
    var newArrow = createArrow();
    var conditionButton = createConditionButton(newArrow, actionIndex, conditionIndex + 1);
    componentContainer.parentNode.insertBefore(conditionButton, componentContainer.nextSibling);
    conditionButton.parentNode.insertBefore(newArrow, conditionButton.nextSibling);
    return newArrow;
  }

  function createConditionRemoveButton(actionIndex, conditionIndex, componentContainer) {
    var conditionRemoveContainer = document.createElement("div");
    conditionRemoveContainer.classList.add("workflow-condition-remove-container");
    var iconContainer = document.createElement("i");
    iconContainer.classList.add("workflow-condition-remove", "fa-solid", "fa-xmark");
    conditionRemoveContainer.appendChild(iconContainer);
    conditionRemoveContainer.addEventListener("click", function(event) {
      if (sessionStorage.getItem("workflow-conditions") !== null) {
        var conditions = JSON.parse(sessionStorage.getItem("workflow-conditions"));
        var actionConditions = conditions.conditions.filter(item => item.actionIndex === actionIndex);
        actionConditions = actionConditions.filter(item => actionConditions.indexOf(item) !== conditionIndex);
        conditions.conditions = conditions.conditions.filter(item => item.actionIndex !== actionIndex).concat(actionConditions);
        sessionStorage.setItem("workflow-conditions", JSON.stringify(conditions));
      }
      displayWorkflow();
    });
    componentContainer.appendChild(conditionRemoveContainer);
  }

  function createAddActionButton(index) {
    var buttonContainer = document.createElement("div");
    buttonContainer.classList.add("workflow-action-add-container");
    var iconContainer = document.createElement("i");
    iconContainer.classList.add("workflow-action-add", "fa-solid", "fa-plus");
    buttonContainer.appendChild(iconContainer);
    iconContainer.addEventListener("click", function(event) {
      var actions = JSON.parse(sessionStorage.getItem("workflow-actions")).actions;
      actions.push(createEmptyComponent("Is executed as soon as the workflow is triggered"));
      sessionStorage.setItem("workflow-actions", JSON.stringify({actions: actions}));
      displayWorkflow();
    });
    document.getElementById("workflow-components").appendChild(buttonContainer);
  }

  function createEmptyComponent(description) {
    return {
      "moduleLogo": "",
      "type": "",
      "typeDescription": description,
      "content": "",
      "selected": false
    };
  }

  document.getElementById("workflow-name").oninput = function (event) {
    sessionStorage.setItem("workflow-name", event.target.value);
    checkPublishability();
  }

  document.getElementById("workflow-description").oninput = function (event) {
    sessionStorage.setItem("workflow-description", event.target.value);
    checkPublishability();
  }

  function checkPublishability() {
    if (sessionStorage.getItem("workflow-name") === null ||
      sessionStorage.getItem("workflow-description") === null ||
      sessionStorage.getItem("workflow-trigger") === null ||
      sessionStorage.getItem("workflow-actions") === null ||
      sessionStorage.getItem("workflow-name") === "" ||
      sessionStorage.getItem("workflow-description") === ""
    ) {
      updatePublishability(false);
      return;
    }
    var trigger = JSON.parse(sessionStorage.getItem("workflow-trigger"));
    var actions = JSON.parse(sessionStorage.getItem("workflow-actions")).actions;
    if ((!("content" in trigger)) || trigger.selected === false ||
      actions.some((action) => !("content" in action) || action.selected === false)
    ) {
      updatePublishability(false);
      return;
    }
    if (sessionStorage.getItem("workflow-conditions") !== null &&
      JSON.parse(sessionStorage.getItem("workflow-conditions")).conditions.some(
        (condition) => condition.selected === false)
    ) {
      updatePublishability(false);
      return;
    }
    updatePublishability(true);
  }

  function updatePublishability(isPublishable) {
    var publishButton = document.getElementById("workflow-publish-button");
    if (isPublishable) {
      publishButton.classList.remove("disabled");
      publishButton.classList.add("workflow-publish-enabled");
    } else {
      publishButton.classList.add("disabled");
      publishButton.classList.remove("workflow-publish-enabled");
    }
  }

  document.getElementById("workflow-publish-button").onclick = function (event) {
    var workflowName = sessionStorage.getItem("workflow-name");
    var workflowDescription = sessionStorage.getItem("workflow-description");
    var workflowTriggerInformation = JSON.parse(sessionStorage.getItem("workflow-trigger"));
    var workflowTrigger = {
      "module": workflowTriggerInformation["module"],
      "type": workflowTriggerInformation["type"],
      "content": workflowTriggerInformation["content"]
    };
    var workflowActionsInformation = JSON.parse(sessionStorage.getItem("workflow-actions")).actions;
    var workflowActions = [];
    for (var i = 0; i < workflowActionsInformation.length; i++) {
      var workflowActionInformation = workflowActionsInformation[i];
      workflowActions.push({
        "module": workflowActionInformation["module"],
        "type": workflowActionInformation["type"],
        "content": workflowActionInformation["content"]
      });
    }
    if (sessionStorage.getItem("workflow-conditions") === null) {
      publish(workflowName, workflowDescription, workflowTrigger, workflowActions, []);
      return;
    }
    var workflowConditionsInformation = JSON.parse(sessionStorage.getItem("workflow-conditions")).conditions;
    var workflowConditions = [];
    for (var i = 0; i < workflowConditionsInformation.length; i++) {
      var workflowConditionInformation = workflowConditionsInformation[i];
      workflowConditions.push({
        "index": workflowConditionInformation["actionIndex"],
        "type": workflowConditionInformation["type"],
        "content": workflowConditionInformation["content"]
      });
    }
    publish(workflowName, workflowDescription, workflowTrigger, workflowActions, workflowConditions);
  }

  function publish(name, description, trigger, actions, conditions) {
    var isSelected = sessionStorage.getItem("workflow-selected") !== null;
    var requestBody = {name: name, description: description, trigger: trigger, actions: actions, conditions: conditions};
    if (isSelected) {
      requestBody.workflow = sessionStorage.getItem("workflow-id");
    } else {
      requestBody.owner = Cookie.find("taskwolf-organization-target");
    }
    console.log(requestBody);
    let request = new HttpRequest("https://api.taskwolf.net/workflow" + (isSelected ? "/update/" : "/add/"), "POST", [{key: "Content-Type", value: "application/json"},
      {key: "API-KEY", value: Cookie.find("token")}], requestBody);
    request.send(function (status, responseText) {
      sessionStorage.removeItem("workflow-name");
      sessionStorage.removeItem("workflow-description");
      sessionStorage.removeItem("workflow-trigger");
      sessionStorage.removeItem("workflow-actions");
      sessionStorage.removeItem("workflow-conditions");
      if (isSelected) {
        sessionStorage.removeItem("workflow-selected");
        sessionStorage.removeItem("workflow-id");
      }
      window.location.href = "/workflows/";
    });
  }

  document.getElementById("workflow-delete").onclick = function (event) {
    openDeleteMenu();
  }

  function openDeleteMenu() {
    swal({
      title: "Delete Workflow?",
      text: "Are you sure that you want to delete that workflow?",
      icon: "warning",
      dangerMode: true,
      buttons: true,
    }).then(willDelete => {
      if (willDelete) {
        let request = new HttpRequest("https://api.taskwolf.net/workflow/remove/", "POST", [{key: "Content-Type", value: "application/json"},
          {key: "API-KEY", value: Cookie.find("token")}], {workflow: sessionStorage.getItem("workflow-id")});
        request.send(function (status, responseText) {
          swal("Deleted!", "That workflow has been successfully deleted!", "success").then(success => window.location.href = "/workflows/");
        });
      }
    });
  }
</script>

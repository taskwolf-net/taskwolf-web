{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="workflow-container">
        <div id="workflow-header">
          <h1 id="workflow-headline">{% trans 'product.workflow.headline' %}</h1>
          <div id="workflow-modification">
            <button id="workflow-delete" type="button" class="btn btn-danger d-none">{% trans 'product.workflow.delete' %}</button>
            <button id="workflow-publish" type="button" class="btn btn-success disabled">{% trans 'product.workflow.publish' %}</button>
          </div>
        </div>
        <div id="workflow-timeline" class="d-none">
          <i id="workflow-timeline-button" class="fa-solid fa-clock-rotate-left" role="button"></i>
        </div>
        <div id="workflow-inputs">
          <div class="form-outline mb-4">
            <label for="workflow-name" class="form-label">{% trans 'product.workflow.name' %}</label>
            <input type="name" id="workflow-name" class="form-control" maxlength=64 placeholder="{% trans 'product.workflow.name' %}">
          </div>
          <div class="form-outline mb-5">
            <label for="workflow-description" class="form-label">{% trans 'product.workflow.description' %}</label>
            <input type="description" id="workflow-description" class="form-control" maxlength=128 placeholder="{% trans 'product.workflow.description' %}">
          </div>
          <hr id="workflow-divider" class="hr mb-5"/>
        </div>
        <div id="workflow-components" class="mb-5">
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var pageChangeApproved = false;

  $(document).ready(function() {
    displayWorkflow();
    for (let element of [...document.querySelectorAll('input[maxlength]')]) {
      element.addEventListener('input', tickInputMaxLength)
      element.parentElement.classList.add('max-length-badged');
      tickInputMaxLength(element)
    }
  });

  function tickInputMaxLength(element) {
    if (element.target) {
      element = element.target
    }
    let limit = element.maxLength;
    let parent = element.parentElement;
    let length = element.value.length;
    parent.dataset['limit'] = limit;
    parent.dataset['remaining'] = limit - length;
    parent.classList.remove('max-length-reached');
    if (length === limit) {
      parent.classList.add('max-length-reached');
    }
  }

  function displayWorkflow() {
    document.getElementById("workflow-components").innerHTML = "";
    if(sessionStorage.getItem("workflow-name") !== null) {
      document.getElementById("workflow-name").value = sessionStorage.getItem("workflow-name");
    }
    if(sessionStorage.getItem("workflow-description") !== null) {
      document.getElementById("workflow-description").value = sessionStorage.getItem("workflow-description");
    }
    if (sessionStorage.getItem("workflow-trigger") === null) {
      sessionStorage.setItem("workflow-trigger", JSON.stringify(
        createEmptyComponent("trigger", "{% trans 'product.workflow.trigger.description' %}")));
    }
    let trigger = JSON.parse(sessionStorage.getItem("workflow-trigger"));
    createComponentElement("{% trans 'product.workflow.trigger' %}",
      trigger.typeDescription, trigger.moduleLogo, "trigger", -1, trigger.selected);
    if (sessionStorage.getItem("workflow-steps") === null) {
      let component = createEmptyComponent("action", "{% trans 'product.workflow.action.description' %}");
      component.index = 0;
      sessionStorage.setItem("workflow-steps", JSON.stringify({actions: [component]}));
    }
    displayActions();
    checkPublishability();
    if (sessionStorage.getItem("workflow-selected") !== null) {
      document.getElementById("workflow-delete").classList.remove("d-none");
      document.getElementById("workflow-timeline").classList.remove("d-none");
      applyTooltips(document.getElementById("workflow-timeline-button"),
        document.getElementById("workflow-timeline"), "{% trans 'product.workflow.timeline' %}");
    }
  }

  function displayActions() {
    let steps = JSON.parse(sessionStorage.getItem("workflow-steps")).steps;
    for (let i = 0; i < steps.length; i++) {
      let step = steps.filter(element => element.index === i)[0];
      let arrow = drawArrow(i);
      if (step.kind === "action") {
        createComponentElement((i + 1) + ". {% trans 'product.workflow.action' %}",
          step.typeDescription, step.moduleLogo, "action", i, step.selected);
      }
      if (step.kind === "condition") {
        createConditionElement(i, step.selected);
      }
    }
    createAddActionButton();
  }

  function createComponentElement(title, description, logo, type, index, selected) {
    let componentContainer = document.createElement("div");
    componentContainer.role = "button";
    componentContainer.classList.add("workflow-entry", "workflow-" + type);
    let actionCount = JSON.parse(sessionStorage.getItem("workflow-steps")).steps
      .filter(item => item.kind === "action").length;
    if (type === "action" && ((actionCount > 1) || (!selected && index > 0))) {
      createActionRemoveButton(index, componentContainer);
    }
    let componentHeadline = document.createElement("div");
    componentHeadline.classList.add("workflow-headline");
    if (logo !== "") {
      let logoElement = document.createElement("img");
      logoElement.src = "{% static '' %}" + "img/applications/" + logo.split(".")[0] + ".webp";
      logoElement.width = 48;
      logoElement.height = 48;
      componentHeadline.appendChild(logoElement);
    }
    let componentHeadlineContent = document.createElement("h1");
    componentHeadlineContent.innerHTML = title;
    if (selected) {
      componentContainer.classList.add("workflow-entry-selected");
      componentHeadline.classList.add("workflow-headline-selected");
    }
    componentHeadline.appendChild(componentHeadlineContent);
    componentContainer.appendChild(componentHeadline);
    componentContainer.appendChild(document.createElement("br"));
    let componentDescription = document.createElement("span");
    componentDescription.innerHTML = description;
    componentDescription.classList.add("workflow-entry-description");
    componentContainer.appendChild(componentDescription);
    componentContainer.appendChild(document.createElement("br"));
    componentContainer.appendChild(document.createElement("br"));
    componentContainer.onclick = function (event) {
      if (event.target.classList.contains("workflow-action-remove-container") ||
        event.target.classList.contains("workflow-action-remove")
      ) {
        return;
      }
      sessionStorage.setItem("workflow-step-index", index.toString());
      pageChangeApproved = true;
      window.location.href = "/workflow/" + type + "/";
    }
    document.getElementById("workflow-components").appendChild(componentContainer);
  }

  function createActionRemoveButton(index, componentContainer) {
    let actionRemoveContainer = document.createElement("div");
    actionRemoveContainer.classList.add("workflow-action-remove-container");
    let iconContainer = document.createElement("i");
    iconContainer.classList.add("workflow-action-remove", "fa-solid", "fa-xmark");
    actionRemoveContainer.appendChild(iconContainer);
    actionRemoveContainer.addEventListener("click", function(event) {
      removeStep(index);
    });
    componentContainer.appendChild(actionRemoveContainer);
  }

  function drawArrow(index) {
    let arrow = createArrow();
    document.getElementById("workflow-components").appendChild(
      createComponentAddButton(index));
    document.getElementById("workflow-components").appendChild(arrow);
    return arrow;
  }

  function createArrow() {
    let arrowContainer = document.createElement("div");
    arrowContainer.classList.add("arrow-container");
    arrowContainer.innerHTML = '<svg><defs><marker id="markerArrow" markerWidth="13" markerHeight="13" refX="2" refY="6" orient="auto"><path d="M2,2 L2,11 L10,6 L2,2" class="arrow-top" /></marker></defs><line x1="10" y1="0" x2="10" y2="100" class="arrow" /></svg>';
    return arrowContainer;
  }

  function createComponentAddButton(index) {
    let buttonContainer = document.createElement("div");
    buttonContainer.classList.add("workflow-component-add-container");
    let iconContainer = document.createElement("i");
    iconContainer.classList.add("workflow-component-add", "fa-solid", "fa-add");
    buttonContainer.appendChild(iconContainer);
    iconContainer.addEventListener("click", function(event) {
      openComponentAddMenu(index);
    });
    return buttonContainer;
  }

  function openComponentAddMenu(index) {
    let content = document.createElement("div");
    content.classList.add("workflow-component-add-menu");
    content.appendChild(createComponentAddSelector("fa-square-caret-right",
      "{% trans 'product.workflow.add.component.action' %}",
      () => addActionInBetween(index)));
    content.appendChild(createComponentAddSelector("fa-filter",
      "{% trans 'product.workflow.add.component.condition' %}",
      () => addCondition(index)));
    Swal.fire({
      title: "{% trans 'product.workflow.add.component.title' %}",
      html: content,
      showConfirmButton: false
    });
  }

  function createComponentAddSelector(icon, label, click) {
    let actionSelector = document.createElement("div");
    actionSelector.role = "button";
    actionSelector.classList.add("workflow-component-add-menu-selector");
    let selectorIcon = document.createElement("i");
    selectorIcon.classList.add("fa-solid", icon, "workflow-component-add-menu-icon");
    actionSelector.appendChild(selectorIcon);
    let selectorLabel = document.createElement("h3");
    selectorLabel.classList.add("workflow-component-add-menu-label");
    selectorLabel.innerText = label;
    actionSelector.appendChild(selectorLabel);
    actionSelector.onclick = function() {
      swal.close();
      click();
    };
    return actionSelector;
  }

  function addActionInBetween(index) {
    let component = createEmptyComponent("action",
      "{% trans 'product.workflow.action.description' %}");
    component.index = index;
    insertStep(index, component);
  }

  function addCondition(index) {
    let condition = {
      "kind": "condition",
      "type": "",
      "index": index,
      "content": "{}",
      "selected": false
    }
    insertStep(index, condition);
  }

  function createConditionElement(arrowElement, index, selected) {
    let componentContainer = document.createElement("div");
    componentContainer.role = "button";
    componentContainer.classList.add("workflow-entry", "workflow-condition");
    createConditionRemoveButton(index, componentContainer);
    let componentHeadline = document.createElement("div");
    componentHeadline.classList.add("workflow-headline");
    let componentHeadlineContent = document.createElement("h1");
    componentHeadlineContent.innerHTML = "{% trans 'product.workflow.condition' %}";
    if (selected) {
      componentContainer.classList.add("workflow-entry-selected");
      componentHeadline.classList.add("workflow-headline-selected");
    }
    componentHeadline.appendChild(componentHeadlineContent);
    componentContainer.appendChild(componentHeadline);
    componentContainer.appendChild(document.createElement("br"));
    let componentDescription = document.createElement("span");
    componentDescription.innerHTML = "{% trans 'product.workflow.condition.description' %}";
    componentDescription.classList.add("workflow-entry-description");
    componentContainer.appendChild(componentDescription);
    componentContainer.appendChild(document.createElement("br"));
    componentContainer.appendChild(document.createElement("br"));
    componentContainer.onclick = function (event) {
      if (event.target.classList.contains("workflow-condition-remove-container") ||
        event.target.classList.contains("workflow-condition-remove")
      ) {
        return;
      }
      sessionStorage.setItem("workflow-step-index", index.toString());
      pageChangeApproved = true;
      window.location.href = "/workflow/condition/";
    }
    arrowElement.parentNode.insertBefore(componentContainer, arrowElement.nextSibling);
    let newArrow = createArrow();
    let conditionButton = createComponentAddButton(index + 1);
    componentContainer.parentNode.insertBefore(conditionButton, componentContainer.nextSibling);
    conditionButton.parentNode.insertBefore(newArrow, conditionButton.nextSibling);
    return newArrow;
  }

  function createConditionRemoveButton(index, componentContainer) {
    let conditionRemoveContainer = document.createElement("div");
    conditionRemoveContainer.classList.add("workflow-condition-remove-container");
    let iconContainer = document.createElement("i");
    iconContainer.classList.add("workflow-condition-remove", "fa-solid", "fa-xmark");
    conditionRemoveContainer.appendChild(iconContainer);
    conditionRemoveContainer.addEventListener("click", function(event) {
      removeStep(index);
    });
    componentContainer.appendChild(conditionRemoveContainer);
  }

  function insertStep(index, component) {
    let steps = JSON.parse(sessionStorage.getItem("workflow-steps")).steps;
    let stepsBehindTarget = steps.filter(item => item.index >= index);
    for (let i = 0; i < stepsBehindTarget.length; i++) {
      stepsBehindTarget[i].index = stepsBehindTarget[i].index + 1;
    }
    steps.push(component);
    sessionStorage.setItem("workflow-steps", JSON.stringify({steps: steps}));
    displayWorkflow();
  }

  function removeStep(index) {
    let steps = JSON.parse(sessionStorage.getItem("workflow-steps"));
    steps.steps = steps.steps.filter(item => item.index !== index);
    let stepsBehindTarget = steps.steps.filter(item => item.index > index);
    steps.steps = steps.steps.filter(item => !(item.index > index));
    for (let i = 0; i < stepsBehindTarget.length; i++) {
      stepsBehindTarget[i].index -= 1;
    }
    steps.steps = steps.steps.concat(stepsBehindTarget);
    sessionStorage.setItem("workflow-steps", JSON.stringify(steps));
    displayWorkflow();
  }

  function createAddActionButton() {
    let buttonContainer = document.createElement("div");
    buttonContainer.classList.add("workflow-action-add-container");
    let iconContainer = document.createElement("i");
    iconContainer.classList.add("workflow-action-add", "fa-solid", "fa-plus");
    buttonContainer.appendChild(iconContainer);
    iconContainer.addEventListener("click", function(event) {
      openComponentAddEndMenu();
    });
    document.getElementById("workflow-components").appendChild(buttonContainer);
  }

  function openComponentAddEndMenu() {
    let content = document.createElement("div");
    content.classList.add("workflow-component-add-menu");
    content.appendChild(createComponentAddSelector("fa-square-caret-right",
      "{% trans 'product.workflow.add.component.action' %}",
      () => addActionAtTheEnd()));
    content.appendChild(createComponentAddSelector("fa-arrow-rotate-left",
      "{% trans 'product.workflow.add.component.loop' %}",
      () => addLoop()));
    Swal.fire({
      title: "{% trans 'product.workflow.add.component.title' %}",
      html: content,
      showConfirmButton: false
    });
  }

  function addActionAtTheEnd() {
    let component = createEmptyComponent("action",
      "{% trans 'product.workflow.action.description' %}");
    component.index = actions.length;
    insertStep(JSON.parse(sessionStorage.getItem("workflow-steps")).steps.length,
      component);
  }

  function addLoop() {
    //TODO: ADD LOOP
    displayWorkflow();
  }

  function createEmptyComponent(kind, description) {
    return {
      "kind": kind,
      "moduleLogo": "",
      "type": "",
      "typeDescription": description,
      "content": "{}",
      "selected": false
    };
  }

  document.getElementById("workflow-name").oninput = function (event) {
    sessionStorage.setItem("workflow-name", event.target.value);
    checkPublishability();
  }

  document.getElementById("workflow-description").oninput = function (event) {
    sessionStorage.setItem("workflow-description", event.target.value);
  }

  function checkPublishability() {
    if (sessionStorage.getItem("workflow-name") === null ||
      sessionStorage.getItem("workflow-trigger") === null ||
      sessionStorage.getItem("workflow-actions") === null ||
      sessionStorage.getItem("workflow-name") === ""
    ) {
      updatePublishability(false);
      return;
    }
    let trigger = JSON.parse(sessionStorage.getItem("workflow-trigger"));
    let actions = JSON.parse(sessionStorage.getItem("workflow-actions")).actions;
    if ((!("content" in trigger)) || trigger.selected === false ||
      actions.some((action) => !("content" in action) || action.selected === false)
    ) {
      updatePublishability(false);
      return;
    }
    if (sessionStorage.getItem("workflow-conditions") !== null &&
      JSON.parse(sessionStorage.getItem("workflow-conditions")).conditions.some(
        (condition) => condition.selected === false)
    ) {
      updatePublishability(false);
      return;
    }
    updatePublishability(true);
  }

  function updatePublishability(isPublishable) {
    let publishButton = document.getElementById("workflow-publish");
    if (isPublishable) {
      publishButton.classList.remove("disabled");
      publishButton.classList.add("workflow-publish-enabled");
    } else {
      publishButton.classList.add("disabled");
      publishButton.classList.remove("workflow-publish-enabled");
    }
  }

  document.getElementById("workflow-publish").onclick = function (event) {
    let workflowName = sessionStorage.getItem("workflow-name");
    let workflowDescription = sessionStorage.getItem("workflow-description");
    if (workflowDescription == null) {
      workflowDescription = "";
    }
    let workflowTriggerInformation = JSON.parse(sessionStorage.getItem("workflow-trigger"));
    let workflowTrigger = {
      "module": workflowTriggerInformation["module"],
      "type": workflowTriggerInformation["type"],
      "content": workflowTriggerInformation["content"]
    };
    let workflowActionsInformation = JSON.parse(sessionStorage.getItem("workflow-actions")).actions;
    let workflowActions = [];
    for (let i = 0; i < workflowActionsInformation.length; i++) {
      let workflowActionInformation = workflowActionsInformation[i];
      workflowActions.push({
        "index": workflowActionInformation["index"],
        "module": workflowActionInformation["module"],
        "type": workflowActionInformation["type"],
        "content": workflowActionInformation["content"]
      });
    }
    if (sessionStorage.getItem("workflow-conditions") === null) {
      publish(workflowName, workflowDescription, workflowTrigger, workflowActions, []);
      return;
    }
    let workflowConditionsInformation = JSON.parse(
      sessionStorage.getItem("workflow-conditions")).conditions;
    let workflowConditions = [];
    for (let i = 0; i < workflowConditionsInformation.length; i++) {
      let workflowConditionInformation = workflowConditionsInformation[i];
      workflowConditions.push({
        "index": workflowConditionInformation["index"],
        "type": workflowConditionInformation["type"],
        "content": workflowConditionInformation["content"]
      });
    }
    publish(workflowName, workflowDescription, workflowTrigger, workflowActions,
      workflowConditions);
  }

  function publish(name, description, trigger, actions, conditions, loop) {
    var publishButton = document.getElementById("workflow-publish");
    publishButton.classList.add("disabled");
    publishButton.classList.remove("workflow-publish-enabled");
    publishButton.innerHTML = `
      {% trans 'product.workflow.publish' %}
      <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true"></span>
      <span class="visually-hidden" role="status">Loading...</span>
    `;
    let isSelected = sessionStorage.getItem("workflow-selected") !== null;
    let requestBody = {name: name, description: description, trigger: trigger,
      actions: actions, conditions: conditions, loop: loop};
    if (isSelected) {
      requestBody.workflow = sessionStorage.getItem("workflow-id");
    }
    let request = new HttpRequest("https://api.dulno.com/v1/workflow" +
      (isSelected ? "/update/" : "/add/"), "POST", [], requestBody);
    request.send(function (status, responseText) {
      if (status !== 200) {
        var publishButton = document.getElementById("workflow-publish");
        publishButton.classList.remove("disabled");
        publishButton.classList.add("workflow-publish-enabled");
        publishButton.innerHTML = "{% trans 'product.workflow.publish' %}";
      }
      if (status === 413) {
        Swal.fire("{% trans 'product.workflow.publish.too.big.title' %}",
          "{% trans 'product.workflow.publish.too.big.body' %}", "error");
        return;
      }
      if (status === 400) {
        Swal.fire("{% trans 'product.workflow.publish.limit.reached.title' %}",
          "{% trans 'product.workflow.publish.limit.reached.body' %}", "error");
        return;
      }
      sessionStorage.removeItem("workflow-name");
      sessionStorage.removeItem("workflow-description");
      sessionStorage.removeItem("workflow-trigger");
      sessionStorage.removeItem("workflow-actions");
      sessionStorage.removeItem("workflow-conditions");
      sessionStorage.removeItem("workflow-loop");
      if (isSelected) {
        sessionStorage.removeItem("workflow-selected");
        sessionStorage.removeItem("workflow-id");
      }
      pageChangeApproved = true;
      window.location.href = "/workflows/";
    });
  }

  document.getElementById("workflow-delete").onclick = function (event) {
    openDeleteMenu();
  }

  function openDeleteMenu() {
    Swal.fire({
      title: "{% trans 'product.workflow.delete.title' %}",
      text: "{% trans 'product.workflow.delete.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        loaderPopup();
        let request = new HttpRequest("https://api.dulno.com/v1/workflow/remove/", "POST",
          [], {workflow: sessionStorage.getItem("workflow-id")});
        request.send(function (status, responseText) {
          pageChangeApproved = true;
          Swal.fire("{% trans 'product.workflow.delete.successful.title' %}",
            "{% trans 'product.workflow.delete.successful.body' %}", "success")
            .then(success => window.location.href = "/workflows/");
        });
      }
    });
  }

  document.getElementById("workflow-timeline-button").onclick = function (event) {
    pageChangeApproved = true;
    window.location.href = "/workflow/timeline/";
  }

  window.onbeforeunload = function() {
    if (!pageChangeApproved && checkUnsavedChanges()) {
      return "{% trans 'product.workflow.unsaved.changes.body' %}";
    }
  };

  function checkUnsavedChanges() {
    if (sessionStorage.getItem("workflow-selected") == null) {
      return !checkWorkflowUntouched();
    }
    return checkWorkflowInitialState("name") || checkWorkflowInitialState("description") ||
      checkWorkflowInitialState("trigger") || checkWorkflowInitialState("actions") ||
      checkWorkflowInitialState("conditions")|| checkWorkflowInitialState("loop");
  }

  function checkWorkflowInitialState(key) {
    return sessionStorage.getItem("workflow-" + key) !==
      sessionStorage.getItem("workflow-initial-" + key);
  }

  function checkWorkflowUntouched() {
    var name = sessionStorage.getItem("workflow-name");
    if (name != null && name !== "") {
      return false;
    }
    var description = sessionStorage.getItem("workflow-description");
    if (description != null && description !== "") {
      return false;
    }
    var conditions = sessionStorage.getItem("workflow-conditions");
    if (conditions != null && JSON.parse(conditions).conditions.length > 0) {
      return false;
    }
    var loop = sessionStorage.getItem("workflow-loop");
    if (loop != null && JSON.parse(loop).loop.enabled) {
      return false;
    }
    if (JSON.parse(sessionStorage.getItem("workflow-trigger")).selected) {
      return false;
    }
    var actions = JSON.parse(sessionStorage.getItem("workflow-actions")).actions;
    if (actions.length !== 1) {
      return false;
    }
    return !actions[0].selected;
  }

  function applyTooltips(element, container, text) {
    $(element).attr("data-bs-toggle", "tooltip");
    $(element).attr("data-bs-placement", "top");
    $(element).attr("data-bs-title", text);
    container.classList.add("position-relative");
    new bootstrap.Tooltip(element, {
      container: container
    });
  }

  function loaderPopup() {
    Swal.fire({
      html: `
        <div style="display: flex; justify-content: center; align-items: center; height: calc(340px - 4rem)">
          <div class="spinner-border" role="status" style="width: 4rem; height: 4rem;">
            <span class="visually-hidden">Loading</span>
          </div>
        </div>
      `,
      showConfirmButton: false
    });
  }
</script>

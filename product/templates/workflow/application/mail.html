{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark">
    <div id="mail-container">
      <div id="mail-header">
        <div>
          <button id="mail-page-back" class="d-none"><i class="fa-solid fa-arrow-left-long"></i></button>
        </div>
        <img id="mail-logo" src="{% static 'img/logo-light.webp' %}">
        <div>
        </div>
      </div>
      <div id="mail-wrapper">
        <div id="mail-domain-container" class="form-outline">
          <h2 class="mail-headline">{% trans 'product.workflow.application.mail.domain.headline' %}</h2>
          <label for="domain" class="form-label">{% trans 'product.workflow.application.mail.domain' %}</label>
          <input type="text" id="domain" class="form-control" placeholder="xyz.com">
          <button type="button" id="mail-domain-continue" class="btn btn-primary d-block px-4 mt-5 mx-auto disabled">{% trans 'product.workflow.application.mail.continue' %}</button>
        </div>
        <div id="mail-credential-container" class="form-outline d-none">
          <h2 class="mail-headline">{% trans 'product.workflow.application.mail.credential.headline' %}</h2>
          <label for="user" class="form-label">{% trans 'product.workflow.application.mail.user' %}</label>
          <input type="text" id="user" class="form-control" placeholder="{% trans 'product.workflow.application.mail.user' %}">
          <label for="password" class="form-label mt-4">{% trans 'product.workflow.application.mail.password' %}</label>
          <input type="password" id="password" class="form-control" placeholder="{% trans 'product.workflow.application.mail.password' %}">
          <button type="button" id="mail-credential-continue" class="btn btn-primary d-block px-4 mt-5 mx-auto disabled">{% trans 'product.workflow.application.mail.continue' %}</button>
        </div>
        <div id="mail-connection-container" class="form-outline d-none">
          <h2 class="mail-headline">{% trans 'product.workflow.application.mail.connection.headline' %}</h2>
          <label for="smtp-host" class="form-label">{% trans 'product.workflow.application.mail.smtp.host' %}</label>
          <input type="text" id="smtp-host" class="form-control" placeholder="{% trans 'product.workflow.application.mail.smtp.host' %}">
          <label for="smtp-port" class="form-label mt-4">{% trans 'product.workflow.application.mail.smtp.port' %}</label>
          <input type="text" id="smtp-port" class="form-control" placeholder="465">
          <label for="imap-host" class="form-label mt-5">{% trans 'product.workflow.application.mail.imap.host' %}</label>
          <input type="text" id="imap-host" class="form-control" placeholder="{% trans 'product.workflow.application.mail.imap.host' %}">
          <label for="imap-port" class="form-label mt-4">{% trans 'product.workflow.application.mail.imap.port' %}</label>
          <input type="text" id="imap-port" class="form-control" placeholder="993">
          <button type="button" id="mail-connect" class="btn btn-success d-block px-4 mt-5 mx-auto disabled">{% trans 'product.workflow.application.mail.connect' %}</button>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  let selectionContainers = [document.getElementById("mail-domain-container")];

  let domainInput = document.getElementById("domain");
  let userInput = document.getElementById("user");
  let passwordInput = document.getElementById("password");
  let smtpHostInput = document.getElementById("smtp-host");
  let smtpPortInput = document.getElementById("smtp-port");
  let imapHostInput = document.getElementById("imap-host");
  let imapPortInput = document.getElementById("imap-port");

  $(document).ready(function() {
    document.getElementById("domain").focus();
  });

  document.getElementById("mail-page-back").onclick = function (event) {
    selectionContainers[selectionContainers.length - 1].classList.add("d-none");
    selectionContainers.pop();
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("mail-wrapper").appendChild(loader);
    document.getElementById("mail-page-back").classList.add("d-none");
    setTimeout(function () {
      document.getElementById("mail-wrapper")
        .removeChild(document.getElementsByClassName("loader")[0]);
      selectionContainers[selectionContainers.length - 1].classList.remove("d-none");
      $(document.getElementById("mail-page-back")).toggleClass("d-none",
        selectionContainers.length === 1);
    }, 500);
  }

  document.getElementById("domain").addEventListener('keyup', function(event) {
    if (event.key === "Enter" && document.getElementById("domain").value.length > 0) {
      document.getElementById("mail-domain-continue").click();
    }
    $(document.getElementById("mail-domain-continue")).toggleClass("disabled",
      document.getElementById("domain").value.length === 0);
  });

  document.getElementById("mail-domain-continue").onclick = function (event) {
    switchSelectionPageDelayed(document.getElementById("mail-domain-container"),
      document.getElementById("mail-credential-container"),
      document.getElementById("user"));
  }

  document.getElementById("user").addEventListener('keyup', function(event) {
    if (event.key === "Enter") {
      document.getElementById("password").focus();
    }
    $(document.getElementById("mail-credential-continue")).toggleClass("disabled",
      !checkCredentialCompleteness());
  });

  document.getElementById("password").addEventListener('keyup', function(event) {
    var credentialCompleted = checkCredentialCompleteness();
    if (event.key === "Enter" && credentialCompleted) {
      document.getElementById("mail-credential-continue").click();
    }
    $(document.getElementById("mail-credential-continue"))
      .toggleClass("disabled", !credentialCompleted);
  });

  function checkCredentialCompleteness() {
    return document.getElementById("user").value.length > 0 &&
      document.getElementById("password").value.length > 0
  }

  document.getElementById("mail-credential-continue").onclick = function (event) {
    switchSelectionPageDelayed(document.getElementById("mail-credential-container"),
      document.getElementById("mail-connection-container"),
      document.getElementById("smtp-host"));
  }

  document.getElementById("smtp-host").addEventListener('keyup', function(event) {
    if (event.key === "Enter") {
      document.getElementById("smtp-port").focus();
    }
    $(document.getElementById("mail-connect"))
      .toggleClass("disabled", !checkConnectionCompleteness());
  });

  document.getElementById("smtp-port").addEventListener('keyup', function(event) {
    if (event.key === "Enter") {
      document.getElementById("imap-host").focus();
    }
    $(document.getElementById("mail-connect"))
      .toggleClass("disabled", !checkConnectionCompleteness());
  });

  document.getElementById("imap-host").addEventListener('keyup', function(event) {
    if (event.key === "Enter") {
      document.getElementById("imap-port").focus();
    }
    $(document.getElementById("mail-connect"))
      .toggleClass("disabled", !checkConnectionCompleteness());
  });

  document.getElementById("imap-port").addEventListener('keyup', function(event) {
    var connectionCompleted = checkConnectionCompleteness();
    if (event.key === "Enter" && connectionCompleted) {
      document.getElementById("mail-connect").click();
    }
    $(document.getElementById("mail-connect"))
      .toggleClass("disabled", !connectionCompleted);
  });

  function checkConnectionCompleteness() {
    return document.getElementById("smtp-host").value.length > 0 &&
      document.getElementById("smtp-port").value.length > 0 &&
      document.getElementById("imap-host").value.length > 0 &&
      document.getElementById("imap-port").value.length > 0
  }

  document.getElementById("mail-connect").onclick = function (event) {
    if (domainInput.value === "" || userInput.value === "" ||
      passwordInput.value === "" || smtpHostInput.value === "" ||
      smtpPortInput.value === "" || imapHostInput.value === "" ||
      imapPortInput.value === ""
    ) {
      Swal.fire("{% trans 'product.workflow.application.mail.failed.title' %}",
        "{% trans 'product.workflow.application.mail.failed.incomplete' %}", "error");
      return;
    }
    document.getElementById("mail-connection-container").classList.add("d-none");
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("mail-wrapper").appendChild(loader);
    document.getElementById("mail-page-back").classList.add("d-none");
    connectMail(function (response) {
      document.getElementById("mail-wrapper")
        .removeChild(document.getElementsByClassName("loader")[0]);
      if (response.success === true) {
        window.close();
      } else {
        document.getElementById("mail-page-back").classList.remove("d-none");
        document.getElementById("mail-connection-container").classList.remove("d-none");
        Swal.fire("{% trans 'product.workflow.application.mail.failed.title' %}",
          "{% trans 'product.workflow.application.mail.failed.already.exists' %}", "error");
      }
    });
  }

  function connectMail(callback) {
    let request = new HttpRequest("https://api.dulno.com/v1/mail/add/", "POST", [],
      {domain: domainInput.value, mailUser: userInput.value,
        mailPassword: passwordInput.value,
        smtpHost: smtpHostInput.value, smtpPort: parseInt(smtpPortInput.value),
        imapHost: imapHostInput.value, imapPort: parseInt(imapPortInput.value),});
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText));
    });
  }

  function switchSelectionPageDelayed(currentContainer, nextContainer, nextInput) {
    selectionContainers.push(nextContainer);
    currentContainer.classList.add("d-none");
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("mail-wrapper").appendChild(loader);
    document.getElementById("mail-page-back").classList.add("d-none");
    setTimeout(function () {
      document.getElementById("mail-page-back").classList.remove("d-none");
      document.getElementById("mail-wrapper")
        .removeChild(document.getElementsByClassName("loader")[0]);
      nextContainer.classList.remove("d-none");
      nextInput.focus();
    }, 500);
  }

  document.getElementById("mail-logo").onclick = function (event) {
    window.location.href = "/";
  }
</script>

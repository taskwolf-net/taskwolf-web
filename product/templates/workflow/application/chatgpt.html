{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    <div id="chatgpt-container">
      <div id="chatgpt-header">
        <div>
        </div>
        <img id="chatgpt-logo" src="{% static 'img/logo-light.webp' %}">
        <div>
        </div>
      </div>
      <div id="chatgpt-wrapper" class="form-outline">
        <h2 class="chatgpt-headline">{% trans 'product.workflow.application.chatgpt.headline' %}</h2>
        <label for="api-key" class="form-label">{% trans 'product.workflow.application.chatgpt.api.key' %}</label>
        <input type="text" id="api-key" class="form-control mb-3" placeholder="{% trans 'product.workflow.application.chatgpt.api.key' %}">
        <span class="text-secondary-emphasis">{% trans 'product.workflow.application.chatgpt.api.key.description' %}</span>
        <label for="organization" class="form-label mt-4">{% trans 'product.workflow.application.chatgpt.organization' %}</label>
        <input type="text" id="organization" class="form-control mb-3" placeholder="{% trans 'product.workflow.application.chatgpt.organization' %}">
        <span class="text-secondary-emphasis">{% trans 'product.workflow.application.chatgpt.organization.description' %}</span>
        <button type="button" id="chatgpt-continue" class="btn btn-primary d-block px-4 mt-5 mx-auto disabled">{% trans 'product.workflow.application.chatgpt.continue' %}</button>
      </div>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    document.getElementById("api-key").focus();
  });

  document.getElementById("api-key").addEventListener('keyup', function(event) {
    if (event.key === "Enter") {
      document.getElementById("organization").focus();
    }
    $(document.getElementById("chatgpt-continue"))
      .toggleClass("disabled", document.getElementById("api-key").value === "");
  });

  document.getElementById("organization").addEventListener('keyup', function(event) {
    if (event.key === "Enter") {
      document.getElementById("chatgpt-continue").click();
    }
  });

  document.getElementById("chatgpt-continue").onclick = function (event) {
    if (document.getElementById("api-key").value === "") {
      Swal.fire("{% trans 'product.workflow.application.chatgpt.failed.title' %}",
        "{% trans 'product.workflow.application.chatgpt.failed.incomplete' %}", "error");
      return;
    }
    document.getElementById("chatgpt-wrapper").classList.add("d-none");
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("chatgpt-container").appendChild(loader);
    connectChatGPT(function (response) {
      document.getElementById("chatgpt-container")
        .removeChild(document.getElementsByClassName("loader")[0]);
      if (response.success === true) {
        window.close();
        window.location.href = "https://dulno.com/";
      } else {
        document.getElementById("chatgpt-wrapper").classList.remove("d-none");
        Swal.fire("{% trans 'product.workflow.application.chatgpt.failed.title' %}",
          "{% trans 'product.workflow.application.chatgpt.failed.error' %}", "error");
      }
    });
  }

  function connectChatGPT(callback) {
    let request = new HttpRequest("https://api.dulno.com/v1/chatgpt/add/", "POST", [],
      {accessToken: document.getElementById("api-key").value,
        organization: document.getElementById("organization").value});
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText));
    });
  }

  document.getElementById("chatgpt-logo").onclick = function (event) {
    window.location.href = "/";
  }
</script>

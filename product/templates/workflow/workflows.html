{% load static %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="workflows-wrapper">
        <h1 id="workflows-headline">Your Workflows</h1>
        <div id="workflows-header">
          <div id="workflows-owner-dropdown" class="dropdown">
            <button id="workflows-owner-dropdown-button" class="btn btn-secondary dropdown-toggle bg-dark" type="button" data-bs-toggle="dropdown">
              Owner
            </button>
            <ul id="workflows-owner-dropdown-list" class="dropdown-menu dropdown-menu-dark">
            </ul>
          </div>
          <div id="workflows-search-box">
            <input id="workflows-search-input" placeholder="Search for workflows..." type="text" class="form-control" value="" autocomplete="off">
            <button type="button">
              <i class="fa fa-search"></i>
            </button>
          </div>
          <button type="button" id="workflow-create" class="btn btn-primary btn-block">CREATE</button>
        </div>
        <ul id="workflows-table-description">
          <li id="workflows-table-description-name">
            <div>
              <span>Name</span>
            </div>
          </li>
          <li>
            <div>
              <span>Creator</span>
            </div>
          </li>
          <li>
            <div>
              <span>Creation Date</span>
            </div>
          </li>
          <li id="workflows-table-description-is-running">
            <div>
              <span>Running</span>
            </div>
          </li>
        </ul>
        <ul id="workflows-list">
        </ul>
        <div id="workflows-empty">
          <span id="workflows-empty-headline">You have not yet created any workflows.</span>
          <span>Why don't you just create one&nbsp;</span><a id="workflows-empty-link" href="javascript:createWorkflow()">here</a><span>?</span>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var owners;
  var workflows;
  var workflowsCurrentNameFilter = "";
  var changeStateBlocked = false;

  $(document).ready(function() {
    workflows = [];
    fetchOwnersData(function() {
      for (var i = 0; i < owners.length; i++) {
        addWorkflowOwner(owners[i]);
      }
      var ownerCookie = Cookie.find("taskwolf-organization-target");
      if (ownerCookie != null) {
        selectWorkflowOwner(owners.filter((owner) => owner.id === ownerCookie)[0]);
      } else {
        selectWorkflowOwner(owners[0]);
      }
    });
  });

  function fetchOwnersData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/workflow/owners/all/", "GET", [{key: "Content-Type", value: "application/json"},
      {key: "API-KEY", value: Cookie.find("token")}]);
    request.send(function (status, responseText) {
      owners = JSON.parse(responseText).owners;
      callback();
    });
  }

  function addWorkflowOwner(owner) {
    var ownerElement = document.createElement("li");
    ownerElement.classList.add("dropdown-item");
    var ownerNameName = document.createElement("b");
    ownerNameName.innerHTML = owner.name;
    ownerElement.appendChild(ownerNameName);
    ownerElement.onclick = function(event) {
      selectWorkflowOwner(owner);
    }
    document.getElementById("workflows-owner-dropdown-list").appendChild(ownerElement);
  }

  function selectWorkflowOwner(owner) {
    document.getElementById("workflows-owner-dropdown-button").innerHTML = "Owner: " + owner.name;
    Cookie.create("taskwolf-organization-target", owner.id, 12 * 30 * 24 * 60 * 60);
    fetchWorkflowsData(function() {
      displayWorkflows();
      if (workflows.length === 0) {
        document.getElementById("workflows-empty").style.display = "flex";
      } else {
        document.getElementById("workflows-empty").style.display = "none";
      }
    });
  }

  function fetchWorkflowsData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/workflows/selected/", "POST", [{key: "Content-Type", value: "application/json"},
      {key: "API-KEY", value: Cookie.find("token")}], {owner: Cookie.find("taskwolf-organization-target")});
    request.send(function (status, responseText) {
      workflows = JSON.parse(responseText).workflows;
      callback();
    });
  }

  function displayWorkflows() {
    document.getElementById("workflows-list").innerHTML = "";
    for (var i = 0; i < workflows.length; i++) {
      var entry = workflows[i];
      if(!(shouldDisplayWorkflowEntry(entry))) {
        continue;
      }
      displayWorkflow(entry.id, entry.name, entry.creator, entry.created, entry.armed, entry.triggerType);
    }
  }

  function shouldDisplayWorkflowEntry(entry) {
    return workflowsCurrentNameFilter.length === 0 ||
      entry.name.toLowerCase().includes(workflowsCurrentNameFilter.toLowerCase()) ||
      entry.creator.toLowerCase().includes(workflowsCurrentNameFilter.toLowerCase()) ||
      entry.created.toLowerCase().includes(workflowsCurrentNameFilter.toLowerCase());
  }

  function displayWorkflow(id, name, creator, created, armed, triggerType) {
    var entry = document.createElement('li');
    entry.classList.add("workflow-entry");
    var nameDiv = document.createElement("div");
    nameDiv.classList.add("workflows-entry-name");
    var nameElement = document.createElement("span");
    nameElement.innerText = name;
    nameElement.classList.add("workflows-list-name");
    nameDiv.appendChild(nameElement);
    entry.appendChild(nameDiv);
    appendWorkflowsCell(entry, "creator", creator, "span");
    appendWorkflowsCell(entry, "created", created, "span");
    if (triggerType === "internal-manual-trigger") {
      entry.appendChild(createManualRunButton(id));
    } else {
      entry.appendChild(createRunningSwitch(id, armed));
    }
    entry.onclick = function (event) {
      var target = event.target;
      if (Boolean(target.closest(".switch")) || Boolean(target.closest(".workflow-run-button"))) {
        return;
      }
      clickWorkflow(id);
    }
    document.getElementById("workflows-list").appendChild(entry);
  }

  function createManualRunButton(id) {
    var runButton = document.createElement("button");
    runButton.type = "button";
    runButton.classList.add("workflow-run-button", "btn", "btn-success");
    var runIcon = document.createElement("i");
    runIcon.classList.add("fa-solid", "fa-play");
    runButton.appendChild(runIcon);
    var runLabel = document.createElement("label");
    runLabel.innerHTML = "RUN";
    runButton.appendChild(runLabel);
    runButton.onclick = function (event) {
      let request = new HttpRequest("https://api.taskwolf.net/workflow/manual/execute/", "POST", [{key: "Content-Type", value: "application/json"},
        {key: "API-KEY", value: Cookie.find("token")}], {workflow: id});
      request.send(function (status, responseText) {
        swal("Executed!", "You have successfully executed that workflow", "success");
      });
    }
    return runButton;
  }

  function createRunningSwitch(id, armed) {
    var isRunningDiv = document.createElement("div");
    isRunningDiv.classList.add("workflows-entry-is-running");
    var isRunningElement = document.createElement("label");
    isRunningElement.classList.add("switch");
    var isRunningInput = document.createElement("input");
    isRunningInput.type = "checkbox";
    if (armed) {
      isRunningInput.checked = true;
    }
    isRunningElement.onclick = function (event) {
      if (changeStateBlocked === true) {
        return;
      }
      updateWorkflowState(id, !isRunningInput.checked);
    }
    isRunningElement.appendChild(isRunningInput);
    var isRunningSpan = document.createElement("span");
    isRunningSpan.classList.add("slider", "round");
    isRunningElement.appendChild(isRunningSpan);
    isRunningDiv.appendChild(isRunningElement);
    return isRunningDiv;
  }

  function clickWorkflow(id) {
    let request = new HttpRequest("https://api.taskwolf.net/workflow/find/", "POST", [{key: "Content-Type", value: "application/json"},
      {key: "API-KEY", value: Cookie.find("token")}], {workflow: id});
    request.send(function (status, responseText) {
      var workflow = JSON.parse(responseText);
      sessionStorage.setItem("workflow-selected", "true");
      sessionStorage.setItem("workflow-id", workflow.id);
      sessionStorage.setItem("workflow-name", workflow.name);
      sessionStorage.setItem("workflow-description", workflow.description);
      sessionStorage.setItem("workflow-trigger", JSON.stringify({
        "module": workflow.triggerModule,
        "moduleLogo": workflow.triggerModuleLogo,
        "type": workflow.triggerType,
        "typeDescription": workflow.triggerTypeDescription,
        "content": workflow.triggerContent
      }));
      var actions = [];
      for (var i = 0; i < workflow.actions.length; i++) {
        var workflowActionInformation = workflow.actions[i];
        actions.push({
          "module": workflowActionInformation.actionModule,
          "moduleLogo": workflowActionInformation.actionModuleLogo,
          "type": workflowActionInformation.actionType,
          "typeDescription": workflowActionInformation.actionTypeDescription,
          "content": workflowActionInformation.actionContent
        });
      }
      sessionStorage.setItem("workflow-actions", JSON.stringify({actions: actions}));
      window.location.href = "/workflow/";
    });
  }

  function updateWorkflowState(id, state) {
    changeStateBlocked = true;
    let request = new HttpRequest("https://api.taskwolf.net/workflow/state/change/", "POST", [{key: "Content-Type", value: "application/json"},
      {key: "API-KEY", value: Cookie.find("token")}], {workflow: id, armed: state});
    request.send(function (status, responseText) {
      changeStateBlocked = false;
    });
  }

  function appendWorkflowsCell(entry, identifier, information, elementType) {
    var div = document.createElement("div");
    var element = document.createElement(elementType);
    element.innerText = information;
    element.classList.add("workflows-list-" + identifier);
    div.appendChild(element);
    entry.appendChild(div);
    return element;
  }

  document.getElementById("workflows-search-input").oninput = function(event) {
    workflowsCurrentNameFilter = event.target.value;
    displayWorkflows();
  };

  document.getElementById("workflow-create").onclick = function(event) {
    createWorkflow();
  };

  function createWorkflow() {
    sessionStorage.removeItem("workflow-name");
    sessionStorage.removeItem("workflow-description");
    sessionStorage.removeItem("workflow-trigger");
    sessionStorage.removeItem("workflow-actions");
    sessionStorage.removeItem("workflow-selected");
    sessionStorage.removeItem("workflow-id");
    window.location.href = "/workflow/";
  }
</script>

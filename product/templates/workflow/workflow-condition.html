{% load static %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="workflow-condition-container">
        <h1 id="workflow-condition-headline">Workflow Condition</h1>
        <div id="workflow-condition-wrapper">
          <div id="workflow-condition-inputs">
            <h5 id="workflow-condition-inputs-headline" class="text-center">Inputs</h5>
            <hr class="w-100 hr"/>
            <div id="workflow-condition-input-list">
            </div>
          </div>
          <div id="workflow-condition-divider">
            <div class="vr"></div>
          </div>
          <div id="workflow-condition-placeholders">
            <h5 id="workflow-condition-placeholders-headline" class="text-center">Placeholders</h5>
            <hr class="w-100 hr"/>
            <ul id="workflow-condition-placeholders-tabs" class="nav nav-tabs d-none">
            </ul>
            <p id="workflow-condition-placeholders-empty" class="text-center d-none">Unfortunately there are no placeholders available for this condition.</p>
            <ul id="workflow-condition-placeholders-list">
            </ul>
          </div>
        </div>
        <div id="workflow-condition-adopt">
          <button id="workflow-condition-adopt-button" type="button" class="btn btn-success disabled">ADOPT</button>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var selectButtons = [];
  var inputValue = "";
  var conditionType = "";
  var conditionTypeName = "";
  var comparativeValue = "";
  var currentPlaceholderElement;

  $(document).ready(function() {
    fillConditionInputs();
    displayPlaceholdersTabs();
  });

  function fillConditionInputs() {
    var inputListElement = document.getElementById("workflow-condition-input-list");
    inputListElement.innerHTML = "";
    addConditionInput("condition-input-value", "Input Value", "The input value that is subsequently used for comparison");
    addConditionSelect("condition-type", "Condition Type", "The type of comparison you want to make");
    addConditionInput("condition-comparative-value", "Comparative Value", "The value with which the input value is to be compared");
    updateTooltips();
    createResetButton(inputListElement, function() {
      selectButtons = [];
      inputValue = "";
      conditionType = "";
      conditionTypeName = "";
      comparativeValue = "";
      updateAdoptability(false);
      fillConditionInputs();
    });
  }

  function addConditionInput(identifier, name, description) {
    var inputContainerElement = document.createElement("div");
    inputContainerElement.classList.add("workflow-condition-input-container", "form-outline", "mb-4");
    var labelElement = document.createElement("h5");
    labelElement.classList.add("workflow-condition-headline", "form-label");
    labelElement.innerHTML = name + ":";
    inputContainerElement.appendChild(labelElement);
    var informationElement = document.createElement("h5");
    informationElement.classList.add("workflow-condition-information", "fa", "fa-question-circle");
    applyTooltips(informationElement, description);
    inputContainerElement.appendChild(informationElement);
    var inputElement = document.createElement("input");
    inputElement.type = "name";
    inputElement.placeholder = name;
    inputElement.id = "workflow-condition-input-" + identifier;
    inputElement.classList.add("workflow-condition-input", "form-control");
    inputElement.oninput = function (event) {
      inputConditionInput(identifier, event.target.value);
    }
    inputElement.ondragover = function (event) {
      event.preventDefault();
    };
    inputElement.ondrop = function (event) {
      inputElement.value =  inputElement.value.substring(0, inputElement.selectionStart) +
        "%" + event.dataTransfer.getData("placeholder-identifier") + "%" +
        inputElement.value.substring(inputElement.selectionStart);
      inputConditionInput(identifier, inputElement.value);
    };
    inputContainerElement.appendChild(inputElement);
    document.getElementById("workflow-condition-input-list").appendChild(inputContainerElement);
  }

  function inputConditionInput(identifier, value) {
    if (identifier === "condition-input-value") {
      inputValue = value;
    }
    if (identifier === "condition-comparative-value") {
      comparativeValue = value;
    }
    checkAdoptability();
  }

  function addConditionSelect(identifier, name, description) {
    var dropdownContainer = document.createElement("div");
    dropdownContainer.classList.add("mb-4");
    var labelElement = document.createElement("h5");
    labelElement.classList.add("workflow-condition-headline", "form-label");
    labelElement.innerHTML = name + ":";
    dropdownContainer.appendChild(labelElement);
    var informationElement = document.createElement("h5");
    informationElement.classList.add("workflow-condition-information", "fa", "fa-question-circle");
    applyTooltips(informationElement, description);
    dropdownContainer.appendChild(informationElement);
    dropdownContainer.classList.add("workflow-condition-select-container", "dropdown");
    var dropdownButton = document.createElement("button");
    dropdownButton.classList.add("btn", "btn-secondary", "dropdown-toggle", "bg-dark");
    if (document.getElementsByClassName("workflow-condition-select-container").length > 0) {
      dropdownButton.setAttribute("disabled", "disabled");
      selectButtons.push(dropdownButton);
    }
    $(dropdownButton).attr('data-bs-toggle','dropdown');
    dropdownButton.type = "button";
    dropdownButton.innerHTML = name;
    dropdownContainer.appendChild(dropdownButton);
    var dropdownList = document.createElement("ul");
    dropdownList.classList.add("workflow-condition-select-list", "dropdown-menu", "dropdown-menu-dark");
    dropdownContainer.appendChild(dropdownList);
    dropdownButton.addEventListener("click", function (event) {
      clickConditionSelect(identifier, dropdownContainer, dropdownList, dropdownButton);
    });
    document.getElementById("workflow-condition-input-list").appendChild(dropdownContainer);
  }

  function clickConditionSelect(identifier, dropdownContainer, dropdownList, dropdownButton) {
    dropdownList.innerHTML = "";
    let request = new HttpRequest("https://api.taskwolf.net/conditions/find/", "GET", [{key: "Content-Type", value: "application/json"},
      {key: "API-KEY", value: Cookie.find("token")}]);
    request.send(function (status, responseText) {
      var items = JSON.parse(responseText).conditions;
      for (var i = 0; i < items.length; i++) {
        let item = items[i];
        var itemElement = document.createElement("li");
        itemElement.classList.add("dropdown-item");
        var itemNameName = document.createElement("b");
        itemNameName.innerHTML = item.name;
        itemElement.appendChild(itemNameName);
        itemElement.onclick = function (event) {
          selectConditionSelect(identifier, item.identifier, item.name, dropdownContainer, dropdownButton, dropdownList);
        }
        dropdownList.appendChild(itemElement);
      }
    });
  }

  function selectConditionSelect(selectIdentifier, itemIdentifier, itemName, dropdownContainer, dropdownButton, dropdownList) {
    conditionType = itemIdentifier;
    conditionName = itemName;
    dropdownContainer.removeChild(dropdownButton);
    dropdownContainer.removeChild(dropdownList);
    var itemElement = document.createElement("div");
    itemElement.classList.add("workflow-condition-selected-item");
    var itemNameElement = document.createElement("b");
    itemNameElement.innerHTML = itemName;
    itemElement.appendChild(itemNameElement);
    dropdownContainer.appendChild(itemElement);
    if (selectButtons.length > 0) {
      selectButtons.shift().removeAttribute("disabled");
    }
    checkAdoptability();
  }

  function displayPlaceholdersTabs() {
    var trigger = sessionStorage.getItem("workflow-trigger");
    var actions = sessionStorage.getItem("workflow-actions");
    if (trigger == null && (actions == null || actions.length === 0)) {
      document.getElementById("workflow-condition-placeholders-empty").classList.remove("d-none");
      return;
    }
    if (trigger != null) {
      displayPlaceholdersTab(-1);
    }
    if ((actions != null && actions.length > 0)) {
      for (var i = 0; i < sessionStorage.getItem("workflow-condition-index").split(":")[0]; i++) {
        if (i < actions.length) {
          displayPlaceholdersTab(i);
        }
      }
    }
    document.getElementById("workflow-condition-placeholders-tabs").classList.remove("d-none");
  }

  function displayPlaceholdersTab(index) {
    var tabElement = document.createElement("li");
    tabElement.classList.add("nav-item");
    var linkElement = document.createElement("a");
    linkElement.classList.add("nav-link");
    if (index === -1) {
      currentPlaceholderElement = linkElement;
      linkElement.classList.add("nav-link-active");
      displayPlaceholders(index);
    }
    linkElement.innerHTML = (index < 0) ? "Trigger" : ((index + 1) + ". Action");
    tabElement.appendChild(linkElement);
    tabElement.onclick = function (event) {
      clickPlaceholdersTab(index, linkElement);
    }
    document.getElementById("workflow-condition-placeholders-tabs").appendChild(tabElement);
  }

  function clickPlaceholdersTab(index, tabElement) {
    if (currentPlaceholderElement === tabElement) {
      return;
    }
    currentPlaceholderElement.classList.remove("nav-link-active");
    tabElement.classList.add("nav-link-active");
    currentPlaceholderElement = tabElement;
    displayPlaceholders(index);
  }

  function displayPlaceholders(index) {
    document.getElementById("workflow-condition-placeholders-list").innerHTML = "";
    var componentType = (index < 0) ? "trigger" : "action";
    var component;
    if (componentType === "trigger") {
      component = JSON.parse(sessionStorage.getItem("workflow-trigger"));
    } else {
      component = JSON.parse(sessionStorage.getItem("workflow-actions")).actions[index];
    }
    var module = component.module;
    var type = component.type;
    let request = new HttpRequest("https://api.taskwolf.net/" + componentType + "/find/", "POST", [{key: "Content-Type", value: "application/json"},
      {key: "API-KEY", value: Cookie.find("token")}], {module: module, type: type});
    request.send(function (status, responseText) {
      var outputVariables = JSON.parse(responseText).outputVariables;
      for (var i = 0; i < outputVariables.length; i++) {
        let variable = outputVariables[i];
        displayPlaceholder(variable.identifier, variable.name);
      }
      if (outputVariables.length === 0) {
        var noPlaceholdersAvailableElement = document.createElement("p");
        noPlaceholdersAvailableElement.classList.add("text-center", "mt-4");
        noPlaceholdersAvailableElement.innerHTML = "This component does not have a placeholder.";
        document.getElementById("workflow-condition-placeholders-list").appendChild(noPlaceholdersAvailableElement);
      }
    });
  }

  function displayPlaceholder(identifier, name) {
    var placeholderElement = document.createElement("li");
    placeholderElement.classList.add("workflow-condition-placeholder");
    placeholderElement.draggable= "true";
    placeholderElement.ondragstart = function (event) {
      event.dataTransfer.setData("placeholder-identifier", identifier);
    }
    var placeholderNameElement = document.createElement("b");
    placeholderNameElement.innerHTML = name;
    placeholderElement.appendChild(placeholderNameElement);
    document.getElementById("workflow-condition-placeholders-list").appendChild(placeholderElement);
  }

  function checkAdoptability() {
    updateAdoptability(conditionType !== "");
  }

  function updateAdoptability(isAdoptable) {
    var adoptButton = document.getElementById("workflow-condition-adopt-button");
    if (isAdoptable) {
      adoptButton.classList.remove("disabled");
      adoptButton.classList.add("workflow-condition-adopt-enabled");
    } else {
      adoptButton.classList.add("disabled");
      adoptButton.classList.remove("workflow-condition-adopt-enabled");
    }
  }

  document.getElementById("workflow-condition-adopt-button").addEventListener("click", function(event) {
    saveCondition();
    window.location.href = "/workflow/";
  });

  function saveCondition() {
    if (sessionStorage.getItem("workflow-conditions") === null) {
      sessionStorage.setItem("workflow-conditions", JSON.stringify({conditions: [createCondition()]}));
    } else {
      var conditions = JSON.parse(sessionStorage.getItem("workflow-conditions")).conditions;
      var component = createCondition();
      if (sessionStorage.getItem("workflow-condition-index") !== null) {
        sessionStorage.removeItem("workflow-condition-index");
      }
      conditions.push(component);
      sessionStorage.setItem("workflow-conditions", JSON.stringify({conditions: conditions}));
    }
  }

  function createCondition() {
    var indexes = sessionStorage.getItem("workflow-condition-index").split(":")[0];
    return {
      "type": conditionType,
      "typeName": conditionTypeName,
      "actionIndex": indexes[0],
      "conditionIndex": indexes[1],
      "content": JSON.stringify({
        "inputValue": inputValue,
        "comparativeValue": comparativeValue
      })
    };
  }

  function createResetButton(container, resetCallback) {
    var resetButtonContainer = document.createElement("div");
    resetButtonContainer.classList.add("workflow-condition-reset");
    var resetButton = document.createElement("button");
    resetButton.type = "button";
    resetButton.classList.add("btn", "btn-danger");
    resetButton.innerHTML = "RESET";
    resetButtonContainer.appendChild(resetButton);
    container.appendChild(resetButtonContainer);
    resetButton.onclick = function (event) {
      resetCallback();
    }
  }

  function applyTooltips(element, text) {
    $(element).attr("data-bs-toggle", "tooltip");
    $(element).attr("data-bs-placement", "top");
    $(element).attr("data-bs-title", text);
  }

  function updateTooltips() {
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl)
    })
  }
</script>

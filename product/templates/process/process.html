{% load static %}
{% load i18n %}
<html lang="en">
{% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="process-wrapper">
        <div id="process-modification">
          <div id="process-delete-wrapper">
            <button id="process-delete" type="button" class="btn btn-danger d-none">{% trans 'product.process.delete' %}</button>
          </div>
          <div id="process-component-wrapper">
            <button id="process-add-start" type="button" class="btn btn-primary">{% trans 'product.process.start.add' %}</button>
            <button id="process-add-step" type="button" class="btn btn-primary">{% trans 'product.process.step.add' %}</button>
            <button id="process-add-end" type="button" class="btn btn-primary">{% trans 'product.process.end.add' %}</button>
          </div>
          <div id="process-publish-wrapper">
            <button id="process-run" type="button" class="btn btn-success">{% trans 'product.process.run' %}</button>
            <button id="process-publish" type="button" class="btn btn-success">{% trans 'product.process.publish' %}</button>
          </div>
        </div>
        <div id="process-content">
          <div id="process-graph">
          </div>
          <div class="bg-dark collapse collapse-horizontal" id="process-step-sidebar">
           <div id="process-step-sidebar-content">
             <button id="process-step-sidebar-close"><i class="fa-solid fa-xmark"></i></button>
             <h3 class="text-center font-weight-bold mt-3">{% trans 'product.process.step' %}</h3>
             <div class="process-step-sidebar-entry">
               <label class="form-label">{% trans 'product.process.step.title' %}</label>
               <input id="process-step-title" class="form-control" placeholder="{% trans 'product.process.step.title' %}">
             </div>
             <div class="process-step-sidebar-entry">
               <label class="form-label">{% trans 'product.process.step.description' %}</label>
               <textarea id="process-step-description" class="form-control" placeholder="{% trans 'product.process.step.description' %}"></textarea>
             </div>
             <div class="process-step-sidebar-entry">
               <label class="form-label">{% trans 'product.process.step.todos' %}</label>
               <p id="process-step-todos-empty" class="text-secondary d-none">{% trans 'product.process.step.todos.empty' %}</p>
               <ul id="process-step-todos">
               </ul>
               <input id="process-step-todo-input" class="form-control" placeholder="{% trans 'product.process.step.todo' %}">
               <button id="process-step-todo-add" type="button" class="btn btn-secondary">{% trans 'product.process.step.todo.add' %}</button>
             </div>
             <div class="process-step-sidebar-entry">
               <label class="form-label">{% trans 'product.process.step.workflows' %}</label>
               <ul id="process-step-workflows">
               </ul>
             </div>
             <div class="process-step-sidebar-entry text-center">
               <button id="process-step-adopt" type="button" class="btn btn-success">{% trans 'product.process.step.adopt' %}</button>
             </div>
           </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var process = null;
  var steps = [];
  var connections = [];
  var previousBox;
  var mouseDown = false;
  var aimedConnectionPoint = null;
  var currentSelectedStep = null;

  var draw = SVG().addTo(document.getElementById("process-graph"))
    .size("100%", "100%")
    .viewbox('-500 -500 1000 1000')
    .panZoom({ zoomMin: 0.5, zoomMax: 3, zoomFactor: 0.1});

  draw.on('panning', event => {
    var box = event.detail.box;
    display(box);
  });

  draw.on("mousedown", function (event) {
    $("#process-step-sidebar").collapse("hide");
  });

  $(document).ready(function() {
    var location = window.location;
    var id = location.href.replace(location.host, "").replace(location.protocol, "").replace("process", "").replaceAll("/", "");
    if (id === "") {
      steps.push(new Step(draw, -850, -75, "START", "Start", "Description", [], []));
      steps.push(new Step(draw, -150, -75, "TASK", "Step", "Description", [], []));
      steps.push(new Step(draw, 500, -75, "END", "End", "Description", [], []));
      initialDisplay();
      return;
    }
    fetchProcessData(id, function() {
      displayProcess();
    });
  });

  function fetchProcessData(id, callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/process/find/", "POST",
      [], {process: id});
    request.send(function (status, responseText) {
      process = JSON.parse(responseText);
      callback();
    });
  }

  function displayProcess() {
    document.getElementById("process-delete").classList.remove("d-none");
    var stepIdRelation = [];
    for (var i = 0; i < process.steps.length; i++) {
      var entry = process.steps[i];
      var step = new Step(draw, entry.stepXCoordinate, entry.stepYCoordinate,
        entry.stepType, entry.stepName, entry.stepDescription, entry.stepTodos,
        entry.stepWorkflows);
      steps.push(step);
      stepIdRelation.push({id: entry.stepId, step: step});
    }
    for (var i = 0; i < process.connections.length; i++) {
      var entry = process.connections[i];
      var origin = stepIdRelation.filter((step) => step.id === entry.connectionOriginStep)[0].step;
      var destination = stepIdRelation.filter((step) => step.id === entry.connectionDestinationStep)[0].step;
      connections.push(new Connection(draw, origin, destination));
    }
    initialDisplay();
  }

  class Step {
    constructor(draw, x, y, type, title, description, todos, workflows) {
      this.draw = draw;
      this.x = x;
      this.y = y;
      this.type = type.toUpperCase();
      this.title = title;
      this.description = description;
      this.todos = todos;
      this.workflows = workflows;
      if (this.type === "TASK" || this.type === "END") {
        this.incomingConnectingPoint = new ConnectionPoint(draw, this, -150, 0, "destination");
      }
      if (this.type === "TASK" || this.type === "START") {
        this.outgoingConnectingPoint = new ConnectionPoint(draw, this, 150, 0, "origin");
      }
      this.state = "INACTIVE";
    }

    display() {
      var self = this;
      var moved = false;
      var group = self.draw.group();
      var subGroup = self.draw.group();
      group.add(subGroup);
      var outerRect = subGroup.rect(300, 150).move(-150, -75).radius(10);
      if (this.state === "ACTIVE") {
        outerRect.fill("#49ff1d");
      } else {
        outerRect.fill("#1b232f")
      }
      var innerRect = subGroup.rect(290, 140).move(-145, -70).radius(10).fill("#3d4b5a");
      var divider = subGroup.rect(250, 2).move(-125, -25).radius(10).fill("#4b5c6f");
      group.on("mouseover", function() {
        if (this.state === "INACTIVE") {
          outerRect.animate(300, '<>').fill('#334056');
        }
        innerRect.animate(300, '<>').fill('#4b5c6f');
        divider.animate(300, '<>').fill('#6b84a0');
      }).on("mouseout", function() {
        if (this.state === "INACTIVE") {
          outerRect.animate(300, '<>').fill('#1b232f');
        }
        innerRect.animate(300, '<>').fill('#3d4b5a');
        divider.animate(300, '<>').fill('#4b5c6f');
      });
      subGroup.on("click", function() {
        if (!moved) {
          self.displayStepSidebar();
        }
        moved = false;
      });
      self.displayContent(subGroup);
      self.displayConnectionPoints(group);
      self.displayRemoveButton(group);
      group.move(self.x, self.y).draggable().on('dragmove', e => {
        if (mouseDown) {
          e.preventDefault();
          return;
        }
        self.x = e.detail.box.x;
        self.y = e.detail.box.y;
        moved = true;
      });
    }

    displayConnectionPoints(group) {
      var self = this;
      if (self.type === "TASK" || self.type === "END") {
        self.incomingConnectingPoint.display(group);
      }
      if (self.type === "TASK" || self.type === "START") {
        self.outgoingConnectingPoint.display(group);
      }
    }

    displayContent(group) {
      var self = this;
      self.displayTitle(group);
      self.displayDescription(group);
    }

    displayTitle(group) {
      var self = this;
      var title = group.foreignObject(300, 40).move(-150, -65)
        .add(SVG('<input class="process-step-title">', true))
        .node.childNodes[0];
      title.value = self.title;
    }

    displayDescription(group) {
      var self = this;
      var description = group.foreignObject(300, 75).move(-150, -15)
        .add(SVG('<textarea class="process-step-description"></textarea>', true))
        .node.childNodes[0];
      description.innerText = self.description;
    }

    displayRemoveButton(group) {
      var self = this;
      var button = group.foreignObject(32, 32).move(128, -80)
        .add(SVG('<div class="process-step-remove"><i class="fa-solid fa-xmark"></i></div>', true))
        .node.childNodes[0];
      button.addEventListener("click", function() {
        group.remove();
        steps.splice(steps.indexOf(self), 1);
        for (var i = connections.length - 1; i >= 0; i--) {
          var connection = connections[i];
          if (connection.origin === self || connection.destination === self) {
            connections.splice(i, 1);
            connection.remove();
          }
        }
      });
    }

    displayStepSidebar() {
      var self = this;
      currentSelectedStep = self;
      document.getElementById("process-step-title").value = self.title;
      document.getElementById("process-step-description").value = self.description;
      document.getElementById("process-step-todos").innerHTML = "";
      for (let i = 0; i < self.todos.length; i++) {
        var todo = self.todos[i];
        var entry = document.createElement("li");
        entry.innerText = todo;
        entry.appendChild(self.createTodoRemoveButton(i));
        document.getElementById("process-step-todos").appendChild(entry);
      }
      if (self.todos.length === 0) {
        document.getElementById("process-step-todos-empty").classList.remove("d-none");
      } else {
        document.getElementById("process-step-todos-empty").classList.add("d-none");
      }
      document.getElementById("process-step-todo-input").value = "";
      $("#process-step-sidebar").collapse("show");
    }

    createTodoRemoveButton(index) {
      var self = this;
      var button = document.createElement("button");
      button.classList.add("process-step-todo-remove", "fa-solid", "fa-square-minus");
      button.onclick = function (event) {
        self.todos.splice(index, 1);
        self.displayStepSidebar();
      }
      return button;
    }

    activate() {
      this.state = "ACTIVE";
    }

    deactivate() {
      this.state = "INACTIVE";
    }
  }

  class ConnectionPoint {
    constructor(draw, step, x, y, type) {
      this.draw = draw;
      this.step = step;
      this.x = x;
      this.y = y;
      this.type = type;
      this.connecting = false;
      this.line = null;
      this.outerCircleColor = "#484848";
      this.innerCircleColor = "#898989";
    }

    display(group) {
      var self = this;
      var outerCircle = group.circle(30).move(self.x - 15, self.y - 15).fill(self.outerCircleColor);
      var innerCircle = group.circle(26).move(self.x - 13, self.y - 13).fill(self.innerCircleColor);
      innerCircle.on('mousedown', function () {
        mouseDown = true;
        self.connecting = true;
      }).on('mouseover', function () {
        outerCircle.animate(300, '<>').fill('#b0b0b0');
        innerCircle.animate(300, '<>').fill('#e1e1e1');
        if (mouseDown) {
          aimedConnectionPoint = self;
        }
      }).on('mouseout', function () {
        if (self.connecting) {
          return;
        }
        outerCircle.animate(300, '<>').fill(self.outerCircleColor);
        innerCircle.animate(300, '<>').fill(self.innerCircleColor);
        if (aimedConnectionPoint != null) {
          aimedConnectionPoint = null;
        }
      });
      group.on('dragmove', event => {
        var mouseX = event.detail.box.x;
        var mouseY = event.detail.box.y;
        self.drag(mouseX, mouseY);
      });
      self.draw.on("mouseup", event => {
        mouseDown = false;
        self.releaseMouse(outerCircle, innerCircle);
      });
    }

    drag(mouseX, mouseY) {
      for (var i = 0; i < connections.length; i++) {
        connections[i].display();
      }
      var self = this;
      if (!self.connecting) {
        return;
      }
      if (self.line != null) {
        self.line.remove();
      }
      var originX = self.step.x + 165 + self.x;
      var originY = self.step.y + 80;
      var destinationX = mouseX + 165 + self.x;
      var destinationY = mouseY + 80;
      if (self.step.type === "START") {
        originX -= 15;
        destinationX -= 15;
      }
      var diffX = destinationX - originX;
      var diffY = destinationY - originY;
      var length = Math.sqrt(Math.pow(diffX, 2) + Math.pow(diffY, 2));
      var nX = diffX * (1 / length) * (length - 10);
      var nY = diffY * (1 / length) * (length - 10);
      destinationX = nX + originX;
      destinationY = nY + originY;
      self.line = self.draw.line(originX, originY, destinationX, destinationY).stroke({
        color: '#ffffff',
        width: 4,
        linecap: 'round',
        dasharray: '30,30'
      });
    }

    releaseMouse(outerCircle, innerCircle) {
      var self = this;
      outerCircle.animate(300, '<>').fill(self.outerCircleColor);
      innerCircle.animate(300, '<>').fill(self.innerCircleColor);
      if (!self.connecting) {
        return;
      }
      self.connecting = false;
      if (self.line != null) {
        self.line.remove();
      }
      self.line = null;
      if (aimedConnectionPoint == null) {
        return;
      }
      self.connect();
    }

    connect() {
      var self = this;
      if (aimedConnectionPoint.step === self.step || aimedConnectionPoint.type === self.type) {
        aimedConnectionPoint = null;
        return;
      }
      var origin = this.type === "origin" ? self.step : aimedConnectionPoint.step;
      var destination = this.type === "destination" ? self.step : aimedConnectionPoint.step;
      var connection = new Connection(draw, origin, destination);
      connection.display();
      connections.push(connection);
    }
  }

  class Connection {
    constructor(draw, origin, destination) {
      this.draw = draw;
      this.origin = origin;
      this.destination = destination;
      this.line = null;
      this.hitBox = null;
      this.state = "INACTIVE";
    }

    display() {
      var self = this;
      if (self.line != null) {
        self.remove();
      }
      var originX = self.origin.x + 330;
      if (self.origin.type === "START") {
        originX -= 15;
      }
      var originY = self.origin.y + 80;
      var destinationX = self.destination.x;
      var destinationY = self.destination.y + 80;
      var color = "#ffffff";
      if (this.state === "ACTIVE") {
        color = "#49ff1d";
      }
      self.line = self.draw.line(originX + 2, originY, destinationX - 2, destinationY).stroke({
        color: color,
        width: 4,
        linecap: 'round',
      });
      self.hitBox = self.draw.line(originX + 10, originY, destinationX - 10, destinationY).stroke({
        color: "rgba(0,0,0,0)",
        width: 20,
        linecap: 'round',
      }).on('mouseover', function () {
        if (self.state === "INACTIVE") {
          self.line.animate(300, '<>').stroke({color: "#ff3737"});
        }
      }).on('mouseout', function () {
        if (self.state === "INACTIVE") {
          self.line.animate(300, '<>').stroke({color: color});
        }
      }).on('click', function() {
        connections.splice(connections.indexOf(self), 1);
        self.remove();
      });
    }

    remove() {
      this.line.remove();
      this.hitBox.remove();
    }

    activate() {
      this.state = "ACTIVE";
    }

    deactivate() {
      this.state = "INACTIVE";
    }
  }

  function initialDisplay() {
    display({width: 4000, height: 4000, x: -2000, y: -2000});
  }

  function display(box) {
    previousBox = box;
    draw.clear();
    displayBackground(box);
    for (var i = 0; i < steps.length; i++) {
      steps[i].display();
    }
    for (var i = 0; i < connections.length; i++) {
      connections[i].display();
    }
  }

  function displayBackground(box) {
    var background = draw.pattern(100, 100, function(add) {
      add.rect(8, 2).move(46, 49).radius(2).fill("#636d7d");
      add.rect(2, 8).move(49, 46).radius(2).fill("#636d7d");
    });
    draw.rect(10000, 10000).move(box.x - 5000, box.y - 5000).fill(background);
  }

  document.getElementById("process-add-start").onclick = function (event) {
    var step = new Step(draw, previousBox.cx - 150, previousBox.cy - 75, "START",
      "Start", "Description", [], []);
    step.display();
    steps.push(step);
  }

  document.getElementById("process-add-step").onclick = function (event) {
    var step = new Step(draw, previousBox.cx - 150, previousBox.cy - 75, "TASK",
      "Step", "Description", [], []);
    step.display();
    steps.push(step);
  }

  document.getElementById("process-add-end").onclick = function (event) {
    var step = new Step(draw, previousBox.cx - 150, previousBox.cy - 75, "END",
      "End", "Description", [], []);
    step.display();
    steps.push(step);
  }

  document.getElementById("process-step-sidebar-close").onclick = function (event) {
    $("#process-step-sidebar").collapse("hide");
  }

  document.getElementById("process-step-todo-add").onclick = function (event) {
    var todo = document.getElementById("process-step-todo-input").value;
    if (todo === "") {
      return;
    }
    currentSelectedStep.todos.push(todo);
    currentSelectedStep.displayStepSidebar();
  }

  document.getElementById("process-step-adopt").onclick = function (event) {
    currentSelectedStep.title = document.getElementById("process-step-title").value;
    currentSelectedStep.description = document.getElementById("process-step-description").value;
    $("#process-step-sidebar").collapse("hide");
    display(previousBox);
  }

  document.getElementById("process-run").onclick = function (event) {
    var startSteps = findStartSteps();
    for (var i = 0; i < startSteps.length; i++) {
      activeStep(startSteps[i]);
    }
  }

  function activeStep(step) {
    step.activate();
    display(previousBox);
    setTimeout(function() {
      step.deactivate();
      var stepConnections = findStepConnections(step);
      if (stepConnections.length > 0) {
        for (var i = 0; i < stepConnections.length; i++) {
          stepConnections[i].activate();
        }
        setTimeout(function() {
          for (var i = 0; i < stepConnections.length; i++) {
            stepConnections[i].deactivate();
            activeStep(stepConnections[i].destination);
          }
        }, 800);
      }
      display(previousBox);
    }, 800);
  }

  document.getElementById("process-publish").onclick = function (event) {
    if (!checkProcessIntegrity()) {
      swal("{% trans 'product.process.publish.integrity.title' %}", "{% trans 'product.process.publish.integrity.body' %}", "error");
      return;
    }
    var publishForm = document.createElement("div");
    var processNameLabel = document.createElement("h5");
    processNameLabel.classList.add("swal-content__label");
    processNameLabel.innerText = "{% trans 'product.process.name' %}";
    publishForm.appendChild(processNameLabel);
    var processNameElement = document.createElement("input");
    processNameElement.classList.add("swal-content__input");
    if (process != null) {
      processNameElement.value = process.name;
    }
    processNameElement.placeholder = "{% trans 'product.process.name' %}";
    publishForm.appendChild(processNameElement);
    var processDescriptionLabel = document.createElement("h5");
    processDescriptionLabel.classList.add("swal-content__label");
    processDescriptionLabel.innerText = "{% trans 'product.process.description' %}";
    publishForm.appendChild(processDescriptionLabel);
    var processDescriptionElement = document.createElement("input");
    processDescriptionElement.classList.add("swal-content__input");
    if (process != null) {
      processDescriptionElement.value = process.description;
    }
    processDescriptionElement.placeholder = "{% trans 'product.process.description' %}";
    publishForm.appendChild(processDescriptionElement);
    swal({
      title: "{% trans 'product.process.publish.title' %}",
      content: publishForm,
      icon: "warning",
      buttons: true,
    }).then(result => {
      if (result == null) {
        return;
      }
      if (processNameElement.value === "" || processDescriptionElement.value === "") {
        swal("{% trans 'product.process.publish.incomplete.title' %}", "{% trans 'product.process.publish.incomplete.body' %}", "error");
        return;
      }
      if (process == null) {
        addProcess(processNameElement.value, processDescriptionElement.value);
        return;
      }
      updateProcess(processNameElement.value, processDescriptionElement.value);
    });
  }

  function checkProcessIntegrity() {
    var currentSteps = findStartSteps();
    while (currentSteps.length > 0) {
      var newSteps = [];
      for (var i = 0; i < currentSteps.length; i++) {
        var stepConnections = findStepConnections(currentSteps[i]);
        for (var j = 0; j < stepConnections.length; j++) {
          var step = stepConnections[j].destination;
          if (step.type === "END") {
            return true;
          }
          newSteps.push(step);
        }
      }
      currentSteps = newSteps;
    }
    return false;
  }

  function findStartSteps() {
    var startSteps = [];
    for (var i = 0; i < steps.length; i++) {
      var step = steps[i];
      if (step.type === "START") {
        startSteps.push(step);
      }
    }
    return startSteps;
  }

  function findStepConnections(step) {
    var stepConnection = [];
    for (var i = 0; i < connections.length; i++) {
      var connection = connections[i];
      if (connection.origin === step) {
        stepConnection.push(connection);
      }
    }
    return stepConnection;
  }

  function addProcess(title, description) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/process/add/", "POST",
      [], createProcessPayload(title, description));
    request.send(function (status, responseText) {
      window.location.href = "/processes/";
    });
  }

  function updateProcess(title, description) {
    var payload = createProcessPayload(title, description);
    payload.process = process.id;
    let request = new HttpRequest("https://api.taskwolf.net/v1/process/update/", "POST",
      [], payload);
    request.send(function (status, responseText) {
      window.location.href = "/processes/";
    });
  }

  function createProcessPayload(title, description) {
    var stepsPayload = [];
    for (var i = 0; i < steps.length; i++) {
      stepsPayload[i] = createStepPayload(steps[i]);
    }
    var connectionsPayload = [];
    for (var i = 0; i < connections.length; i++) {
      connectionsPayload[i] = createConnectionPayload(connections[i]);
    }
    return {
      name: title,
      description: description,
      steps: stepsPayload,
      connections: connectionsPayload
    }
  }

  function createStepPayload(step) {
    var todos = [];
    for (var i = 0; i < step.todos.length; i++) {
      todos[i] = {"todo": step.todos[i]}
    }
    return {
      name: step.title,
      description: step.description,
      todos: todos,
      workflows: [],
      type: step.type,
      xCoordinate: step.x,
      yCoordinate: step.y
    }
  }

  function createConnectionPayload(connection) {
    return {
      originStep: steps.indexOf(connection.origin),
      destinationStep: steps.indexOf(connection.destination)
    }
  }

  document.getElementById("process-delete").onclick = function (event) {
    swal({
      title: "{% trans 'product.process.delete.title' %}",
      text: "{% trans 'product.process.delete.body' %}",
      icon: "warning",
      dangerMode: true,
      buttons: true,
    }).then(willDelete => {
      if (willDelete) {
        let request = new HttpRequest("https://api.taskwolf.net/v1/process/remove/", "POST",
          [], {process: process.id});
        request.send(function (status, responseText) {

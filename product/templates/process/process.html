{% load static %}
{% load i18n %}
<html lang="en">
{% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="process-wrapper">
        <div id="process-modification">
          <div id="process-delete-wrapper">
            <button id="process-delete" type="button" class="btn btn-danger d-none">{% trans 'product.process.delete' %}</button>
          </div>
          <div id="process-component-wrapper">
            <button id="process-add-start" type="button" class="btn btn-primary">{% trans 'product.process.start.add' %}</button>
            <button id="process-add-step" type="button" class="btn btn-primary">{% trans 'product.process.step.add' %}</button>
            <button id="process-add-end" type="button" class="btn btn-primary">{% trans 'product.process.end.add' %}</button>
          </div>
          <div id="process-publish-wrapper">
            <button id="process-run" type="button" class="btn btn-success">{% trans 'product.process.run' %}</button>
            <button id="process-sidebar-button" type="button" data-bs-toggle="collapse" data-bs-target="#process-sidebar" aria-expanded="true" aria-controls="process-sidebar" class=""><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
        <div id="process-content">
          <div id="process-graph">
          </div>
          <div class="bg-dark collapse collapse-horizontal show" id="process-sidebar">
            <div id="process-sidebar-content">
              <h3 class="text-center font-weight-bold mt-4">Process</h3>
              <div class="process-sidebar-entry">
                <label class="form-label">Title</label>
                <input id="process-title" class="form-control" placeholder="Title">
              </div>
              <div class="process-sidebar-entry">
                <label class="form-label">Description</label>
                <textarea id="process-description" class="form-control" placeholder="Description"></textarea>
              </div>
              <div class="process-sidebar-entry text-center">
                <button id="process-publish" type="button" class="btn btn-success">{% trans 'product.process.publish' %}</button>
                <p id="process-publish-note" class="text-secondary my-3">{% trans 'product.process.publish.note' %}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var process = null;
  var steps = [];
  var connections = [];
  var previousBox;
  var mouseDown = false;
  var aimedConnectionPoint = null;

  var draw = SVG().addTo(document.getElementById("process-graph"))
    .size("100%", "100%")
    .viewbox('-500 -500 1000 1000')
    .panZoom({ zoomMin: 0.5, zoomMax: 3, zoomFactor: 0.1});

  draw.on('panning', event => {
    var box = event.detail.box;
    display(box);
  });

  function resetFocus() {
    document.activeElement.scrollTop = 0;
    document.activeElement.blur();
  }

  draw.on("mousedown", function (event) {
    resetFocus();
  });

  $(document).ready(function() {
    var location = window.location;
    var id = location.href.replace(location.host, "").replace(location.protocol, "").replace("process", "").replaceAll("/", "");
    if (id === "") {
      steps.push(new Step(draw, -850, -75, "START", "Start", "Description"));
      steps.push(new Step(draw, -150, -75, "TASK", "Step", "Description"));
      steps.push(new Step(draw, 500, -75, "END", "End", "Description"));
      initialDisplay();
      return;
    }
    fetchProcessData(id, function() {
      displayProcess();
    });
  });

  function fetchProcessData(id, callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/process/find/", "POST",
      [], {process: id});
    request.send(function (status, responseText) {
      process = JSON.parse(responseText);
      callback();
    });
  }

  function displayProcess() {
    document.getElementById("process-title").value = process.name;
    document.getElementById("process-description").value = process.description;
    document.getElementById("process-delete").classList.remove("d-none");
    var stepIdRelation = [];
    for (var i = 0; i < process.steps.length; i++) {
      var entry = process.steps[i];
      var step = new Step(draw, entry.stepXCoordinate, entry.stepYCoordinate,
        entry.stepType, entry.stepName, entry.stepDescription);
      steps.push(step);
      stepIdRelation.push({id: entry.stepId, step: step});
    }
    for (var i = 0; i < process.connections.length; i++) {
      var entry = process.connections[i];
      var origin = stepIdRelation.filter((step) => step.id === entry.connectionOriginStep)[0].step;
      var destination = stepIdRelation.filter((step) => step.id === entry.connectionDestinationStep)[0].step;
      connections.push(new Connection(draw, origin, destination));
    }
    initialDisplay();
  }

  class Step {
    constructor(draw, x, y, type, title, description) {
      this.draw = draw;
      this.x = x;
      this.y = y;
      this.type = type.toUpperCase();
      this.title = title;
      this.description = description;
      if (this.type === "TASK" || this.type === "END") {
        this.incomingConnectingPoint = new ConnectionPoint(draw, this, -150, 0, "destination");
      }
      if (this.type === "TASK" || this.type === "START") {
        this.outgoingConnectingPoint = new ConnectionPoint(draw, this, 150, 0, "origin");
      }
      this.state = "INACTIVE";
    }

    display() {
      var self = this;
      var group = self.draw.group();
      var outerRect = group.rect(300, 150).move(-150, -75).radius(10);
      if (this.state === "ACTIVE") {
        outerRect.fill("#49ff1d");
      } else {
        outerRect.fill("#1b232f")
      }
      var innerRect = group.rect(290, 140).move(-145, -70).radius(10).fill("#3d4b5a");
      var divider = group.rect(250, 2).move(-125, -15).radius(10).fill("#4b5c6f");
      group.on("mouseover", function() {
        if (this.state === "INACTIVE") {
          outerRect.animate(300, '<>').fill('#334056');
        }
        innerRect.animate(300, '<>').fill('#4b5c6f');
        divider.animate(300, '<>').fill('#6b84a0');
      }).on("mouseout", function() {
        if (this.state === "INACTIVE") {
          outerRect.animate(300, '<>').fill('#1b232f');
        }
        innerRect.animate(300, '<>').fill('#3d4b5a');
        divider.animate(300, '<>').fill('#4b5c6f');
      });
      self.displayContent(group);
      if (self.type === "TASK" || self.type === "END") {
        self.incomingConnectingPoint.display(group);
      }
      if (self.type === "TASK" || self.type === "START") {
        self.outgoingConnectingPoint.display(group);
      }
      self.displayRemoveButton(group);
      group.move(self.x, self.y).draggable().on('dragmove', e => {
        if (mouseDown) {
          e.preventDefault();
          return;
        }
        self.x = e.detail.box.x;
        self.y = e.detail.box.y;
      });
    }

    displayContent(group) {
      var self = this;
      self.displayTitle(group);
      self.displayDescription(group);
      group.on("mousedown", function (event) {
        resetFocus();
      });
    }

    displayTitle(group) {
      var self = this;
      var title = group.foreignObject(300, 40).move(-150, -65)
        .add(SVG('<input class="process-step-title" type="text">', true))
        .node.childNodes[0];
      title.value = self.title;
      title.addEventListener("click", function() {
        title.focus();
        var value = title.value;
        title.value = "";
        title.value = value;
      });
      title.addEventListener("keyup", function(event) {
        self.title = title.value;
        if (event.key === "Enter") {
          document.activeElement.blur();
        }
      });
    }

    displayDescription(group) {
      var self = this;
      var description = group.foreignObject(300, 90).move(-150, 0)
        .add(SVG('<textarea class="process-step-description"></textarea>', true))
        .node.childNodes[0];
      description.innerText = self.description;
      description.addEventListener("click", function() {
        description.focus();
        var value = description.value;
        description.value = "";
        description.value = value;
      });
      description.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
          event.preventDefault();
        }
      });
      description.addEventListener("keyup", function(event) {
        self.description = description.value;
        if (event.key === "Enter") {
          document.activeElement.blur();
        }
      });
    }

    displayRemoveButton(group) {
      var self = this;
      var button = group.foreignObject(32, 32).move(128, -80)
        .add(SVG('<div class="process-step-remove"><i class="fa-solid fa-xmark"></i></div>', true))
        .node.childNodes[0];
      button.addEventListener("click", function() {
        group.remove();
        steps.splice(steps.indexOf(self), 1);
        for (var i = connections.length - 1; i >= 0; i--) {
          var connection = connections[i];
          if (connection.origin === self || connection.destination === self) {
            connections.splice(i, 1);
            connection.remove();
          }
        }
      });
    }

    activate() {
      this.state = "ACTIVE";
    }

    deactivate() {
      this.state = "INACTIVE";
    }
  }

  class ConnectionPoint {
    constructor(draw, step, x, y, type) {
      this.draw = draw;
      this.step = step;
      this.x = x;
      this.y = y;
      this.type = type;
      this.connecting = false;
      this.line = null;
      this.outerCircleColor = "#484848";
      this.innerCircleColor = "#898989";
    }

    display(group) {
      var self = this;
      var outerCircle = group.circle(30).move(self.x - 15, self.y - 15).fill(self.outerCircleColor);
      var innerCircle = group.circle(26).move(self.x - 13, self.y - 13).fill(self.innerCircleColor);
      innerCircle.on('mousedown', function () {
        mouseDown = true;
        if (self.checkConnectionExistence()) {
          return;
        }
        self.connecting = true;
      }).on('mouseover', function () {
        outerCircle.animate(300, '<>').fill('#b0b0b0');
        innerCircle.animate(300, '<>').fill('#e1e1e1');
        if (mouseDown) {
          aimedConnectionPoint = self;
        }
      }).on('mouseout', function () {
        if (self.connecting) {
          return;
        }
        outerCircle.animate(300, '<>').fill(self.outerCircleColor);
        innerCircle.animate(300, '<>').fill(self.innerCircleColor);
        if (aimedConnectionPoint != null) {
          aimedConnectionPoint = null;
        }
      }).on('click', function() {
        for (var i = 0; i < connections.length; i++) {
          var connection = connections[i];
          if ((self.type === "origin" && connection.origin === self.step) ||
            (self.type === "destination" && connection.destination === self.step)
          ) {
            connections.splice(i, 1);
            connection.remove();
            checkPublishability();
            break;
          }
        }
      });
      group.on('dragmove', event => {
        var mouseX = event.detail.box.x;
        var mouseY = event.detail.box.y;
        self.drag(mouseX, mouseY);
      });
      self.draw.on("mouseup", event => {
        mouseDown = false;
        self.releaseMouse(outerCircle, innerCircle);
      });
    }

    drag(mouseX, mouseY) {
      for (var i = 0; i < connections.length; i++) {
        connections[i].display();
      }
      var self = this;
      if (!self.connecting) {
        return;
      }
      if (self.line != null) {
        self.line.remove();
      }
      var originX = self.step.x + 165 + self.x;
      var originY = self.step.y + 80;
      var destinationX = mouseX + 165 + self.x;
      var destinationY = mouseY + 80;
      if (self.step.type === "START") {
        originX -= 15;
        destinationX -= 15;
      }
      var diffX = destinationX - originX;
      var diffY = destinationY - originY;
      var length = Math.sqrt(Math.pow(diffX, 2) + Math.pow(diffY, 2));
      var nX = diffX * (1 / length) * (length - 10);
      var nY = diffY * (1 / length) * (length - 10);
      destinationX = nX + originX;
      destinationY = nY + originY;
      self.line = self.draw.line(originX, originY, destinationX, destinationY).stroke({
        color: '#ffffff',
        width: 4,
        linecap: 'round',
        dasharray: '30,30'
      });
    }

    releaseMouse(outerCircle, innerCircle) {
      var self = this;
      outerCircle.animate(300, '<>').fill(self.outerCircleColor);
      innerCircle.animate(300, '<>').fill(self.innerCircleColor);
      if (!self.connecting) {
        return;
      }
      self.connecting = false;
      if (self.line != null) {
        self.line.remove();
      }
      self.line = null;
      if (aimedConnectionPoint == null) {
        return;
      }
      self.connect();
    }

    connect() {
      var self = this;
      if (aimedConnectionPoint.step === self.step || aimedConnectionPoint.type === self.type) {
        aimedConnectionPoint = null;
        return;
      }
      var origin = this.type === "origin" ? self.step : aimedConnectionPoint.step;
      var destination = this.type === "destination" ? self.step : aimedConnectionPoint.step;
      var connection = new Connection(draw, origin, destination);
      connection.display();
      connections.push(connection);
      checkPublishability();
    }

    checkConnectionExistence() {
      var self = this;
      for (var i = 0; i < connections.length; i++) {
        var connection = connections[i];
        if (self.type === "origin" && connection.origin === self.step ||
          self.type === "destination" && connection.destination === self.step
        ) {
          return true;
        }
      }
      return false;
    }
  }

  class Connection {
    constructor(draw, origin, destination) {
      this.draw = draw;
      this.origin = origin;
      this.destination = destination;
      this.line = null;
      this.state = "INACTIVE";
    }

    display() {
      var self = this;
      if (self.line != null) {
        self.remove();
      }
      var originX = self.origin.x + 330;
      if (self.origin.type === "START") {
        originX -= 15;
      }
      var originY = self.origin.y + 80;
      var destinationX = self.destination.x;
      var destinationY = self.destination.y + 80;
      var color = "#ffffff";
      if (this.state === "ACTIVE") {
        color = "#49ff1d";
      }
      self.line = self.draw.line(originX, originY, destinationX, destinationY).stroke({
        color: color,
        width: 4,
        linecap: 'round',
      });
    }

    remove() {
      this.line.remove();
    }

    activate() {
      this.state = "ACTIVE";
    }

    deactivate() {
      this.state = "INACTIVE";
    }
  }

  function initialDisplay() {
    checkPublishability();
    display({width: 4000, height: 4000, x: -2000, y: -2000});
  }

  function display(box) {
    previousBox = box;
    draw.clear();
    displayBackground(box);
    for (var i = 0; i < steps.length; i++) {
      steps[i].display();
    }
    for (var i = 0; i < connections.length; i++) {
      connections[i].display();
    }
  }

  function displayBackground(box) {
    var background = draw.pattern(100, 100, function(add) {
      add.rect(8, 2).move(46, 49).radius(2).fill("#636d7d");
      add.rect(2, 8).move(49, 46).radius(2).fill("#636d7d");
    });
    draw.rect(10000, 10000).move(box.x - 5000, box.y - 5000).fill(background);
  }

  document.getElementById("process-add-start").onclick = function (event) {
    var step = new Step(draw, previousBox.cx - 150, previousBox.cy - 75, "START", "Start", "Description");
    step.display();
    steps.push(step);
  }

  document.getElementById("process-add-step").onclick = function (event) {
    var step = new Step(draw, previousBox.cx - 150, previousBox.cy - 75, "TASK", "Step", "Description");
    step.display();
    steps.push(step);
  }

  document.getElementById("process-add-end").onclick = function (event) {
    var step = new Step(draw, previousBox.cx - 150, previousBox.cy - 75, "END", "End", "Description");
    step.display();
    steps.push(step);
  }

  var isProcessSidebarShown = true;

  document.getElementById('process-sidebar-button').onclick = function() {
    isProcessSidebarShown = !isProcessSidebarShown;
    updateProcessSidebarButtonIcon();
  };

  function updateProcessSidebarButtonIcon() {
    if (isProcessSidebarShown) {
      document.getElementById("process-sidebar-button").innerHTML ='<i class="fa-solid fa-xmark"></i>';
      return;
    }
    document.getElementById("process-sidebar-button").innerHTML ='<i class="fa-solid fa-bars"></i>';
  }

  document.getElementById("process-title").oninput = function (event) {
    checkPublishability();
  }

  document.getElementById("process-description").oninput = function (event) {
    checkPublishability();
  }

  document.getElementById("process-run").onclick = function (event) {
    activeStep(findStartStep());
  }

  function activeStep(step) {
    step.activate();
    display(previousBox);
    setTimeout(function() {
      step.deactivate();
      var connection = findStepConnection(step);
      if (connection != null) {
        connection.activate();
        setTimeout(function() {
          connection.deactivate();
          activeStep(connection.destination);
        }, 800);
      }
      display(previousBox);
    }, 800);
  }

  function checkPublishability() {
    if (document.getElementById("process-title").value === "" ||
      document.getElementById("process-description").value === "" ||
      !checkProcessIntegrity()
    ) {
      updatePublishability(false);
      return;
    }
    updatePublishability(true);
  }

  function checkProcessIntegrity() {
    var currentStep = findStartStep();
    while (currentStep != null) {
      var connection = findStepConnection(currentStep);
      if (connection == null) {
        currentStep = null;
        continue;
      }
      currentStep = connection.destination;
      if (currentStep.type === "END") {
        return true;
      }
    }
    return false;
  }

  function findStartStep() {
    for (var i = 0; i < steps.length; i++) {
      var step = steps[i];
      if (step.type === "START") {
        return step;
      }
    }
    return null;
  }

  function findStepConnection(step) {
    for (var i = 0; i < connections.length; i++) {
      var connection = connections[i];
      if (connection.origin === step) {
        return connection;
      }
    }
    return null;
  }

  function updatePublishability(isPublishable) {
    var publishButton = document.getElementById("process-publish");
    if (isPublishable) {
      publishButton.classList.remove("disabled");
    } else {
      publishButton.classList.add("disabled");
    }
  }

  document.getElementById("process-publish").onclick = function (event) {
    if (process == null) {
      addProcess();
      return;
    }
    updateProcess();
  }

  function addProcess() {
    let request = new HttpRequest("https://api.taskwolf.net/v1/process/add/", "POST",
      [], createProcessPayload());
    request.send(function (status, responseText) {
      window.location.href = "/processes/";
    });
  }

  function updateProcess() {
    var payload = createProcessPayload();
    payload.process = process.id;
    let request = new HttpRequest("https://api.taskwolf.net/v1/process/update/", "POST",
      [], payload);
    request.send(function (status, responseText) {
      window.location.href = "/processes/";
    });
  }

  function createProcessPayload() {
    var stepsPayload = [];
    for (var i = 0; i < steps.length; i++) {
      stepsPayload[i] = createStepPayload(steps[i]);
    }
    var connectionsPayload = [];
    for (var i = 0; i < connections.length; i++) {
      connectionsPayload[i] = createConnectionPayload(connections[i]);
    }
    return {
      name: document.getElementById("process-title").value,
      description: document.getElementById("process-description").value,
      steps: stepsPayload,
      connections: connectionsPayload
    }
  }

  function createStepPayload(step) {
    return {
      name: step.title,
      description: step.description,
      type: step.type,
      xCoordinate: step.x,
      yCoordinate: step.y
    }
  }

  function createConnectionPayload(connection) {
    return {
      originStep: steps.indexOf(connection.origin),
      destinationStep: steps.indexOf(connection.destination)
    }
  }

  document.getElementById("process-delete").onclick = function (event) {
    swal({
      title: "{% trans 'product.process.delete.title' %}",
      text: "{% trans 'product.process.delete.body' %}",
      icon: "warning",
      dangerMode: true,
      buttons: true,
    }).then(willDelete => {
      if (willDelete) {
        let request = new HttpRequest("https://api.taskwolf.net/v1/process/remove/", "POST",
          [], {process: process.id});
        request.send(function (status, responseText) {
          swal("{% trans 'product.process.delete.successful.title' %}", "{% trans 'product.process.delete.successful.body' %}", "success").then(success => window.location.href = "/processes/");
        });
      }
    });
  }
</script>

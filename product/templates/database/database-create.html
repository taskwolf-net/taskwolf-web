{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <form>
        <h1>{% trans 'product.database.create.headline' %}</h1></br>
        <div class="form-outline mb-4">
          <label for="name" class="form-label">{% trans 'product.database.create.name' %}</label>
          <input type="name" id="name" class="form-control" maxlength=64 placeholder="{% trans 'product.database.create.name' %}">
        </div>
        <button type="button" id="create" class="btn btn-primary mb-4">{% trans 'product.database.create.button' %}</button></br>
      </form>
    </div>
  </body>
</html>

<script>
  $(document).ready(function() {
    for (let element of [...document.querySelectorAll('input[maxlength]')]) {
      element.addEventListener('input', tickInputMaxLength)
      element.parentElement.classList.add('max-length-badged');
      tickInputMaxLength(element)
    }
  });

  function tickInputMaxLength(element) {
    if (element.target) {
      element = element.target
    }
    let limit = element.maxLength;
    let parent = element.parentElement;
    let length = element.value.length;
    parent.dataset['limit'] = limit;
    parent.dataset['remaining'] = limit - length;
    parent.classList.remove('max-length-reached');
    if (length === limit) {
      parent.classList.add('max-length-reached');
    }
  }

  document.getElementById("name").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.getElementById("create").click();
    }
  });

  document.getElementById('create').onclick = function() {
    let createButton = document.getElementById("create");
    createButton.classList.add("disabled");
    createButton.innerHTML = `
      {% trans 'product.database.create.button' %}
      <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true"></span>
      <span class="visually-hidden" role="status">Loading...</span>
    `;
    let name = document.getElementById("name").value;
    if (name === "") {
      Swal.fire("{% trans 'product.database.create.empty.title' %}", "{% trans 'product.database.create.empty.body' %}", "error");
      return;
    }
    let request = new HttpRequest("https://api.dulno.com/v1/table/create/", "POST",
      [], {name: document.getElementById("name").value});
    request.send(function (status, responseText) {
      if (status !== 200) {
        createButton.classList.remove("disabled");
        createButton.innerHTML = "{% trans 'product.database.create.button' %}";
      }
      if (status === 400) {
        Swal.fire("{% trans 'product.database.create.limit.reached.title' %}",
          "{% trans 'product.database.create.limit.reached.body' %}", "error");
        return;
      }
      window.location.href = "/database/" + JSON.parse(responseText).table + "/";
    });
  };
</script>

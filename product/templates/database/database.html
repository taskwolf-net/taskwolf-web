{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="database-container">
        <div id="database-wrapper" class="d-none">
          <div id="database-header">
            <h2 id="database-name"></h2>
            <div id="database-modification">
              <button id="database-delete" type="button" class="btn btn-danger">{% trans 'product.database.delete' %}</button>
              <button id="database-rename" type="button" class="fa-solid fa-pen-to-square"></button>
            </div>
          </div>
          <div id="database-table-wrapper">
            <div id="database-table-container">
              <table id="database-table">
                <thead id="database-table-head">
                </thead>
                <tbody id="database-table-body">
                </tbody>
              </table>
              <div id="database-table-paging">
                <button id="database-remove" type="button" class="btn btn-danger disabled">{% trans 'product.database.remove' %}</button>
                <div class="mx-auto">
                  <div id="database-table-page-control" class="d-flex justify-content-center align-items-center">
                    <a id="database-previous-page" class="database-page me-4"><i class="fa-solid fa-chevron-left"></i></a>
                    <div id="database-pages"></div>
                    <a id="database-next-page" class="database-page ms-4"><i class="fa-solid fa-chevron-right"></i></a>
                  </div>
                </div>
                <button id="database-insert" type="button" class="btn btn-primary">{% trans 'product.database.insert' %}</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  let database;
  let currentPageContent;
  let inserting = false;
  let rowCheckboxes = [];

  $(document).ready(function() {
    displayLoader();
    fetchDatabaseData(function(result) {
      database = result;
      document.getElementById("database-name").innerHTML = database.name;
      fillTableHead();
      fetchDatabasePage(0, function(content, pageState, pageNumber) {
        removeLoader();
        updatePaging(pageNumber, 0, pageState, content);
      });
    });
  });

  function fetchDatabaseData(callback) {
    let location = window.location;
    let id = location.href.replace(location.host, "").replace(location.protocol, "")
      .replace("database", "").replaceAll("/", "");
    let request = new HttpRequest("https://api.dulno.com/v1/table/find/", "POST",
      [], {table: id});
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText));
    });
  }

  function fillTableHead() {
    let head = document.createElement("tr");
    let checkbox = createCheckboxElement(function(event) {
      clickGlobalCheckbox();
    });
    checkbox.firstChild.id = "database-table-checkbox-global";
    head.appendChild(checkbox);
    let columns = database.columns;
    for (let i = 0; i < columns.length; i++) {
      head.appendChild(createTableColumnHead(columns[i].name));
    }
    head.appendChild(createTableAddColumnButton());
    document.getElementById("database-table-head").appendChild(head);
  }

  function clickGlobalCheckbox() {
    let checkboxSelected = document.getElementById("database-table-checkbox-global").checked;
    for (let i = 0; i < rowCheckboxes.length; i++) {
      rowCheckboxes[i].checkbox.checked = checkboxSelected;
    }
    let removeButton = document.getElementById("database-remove");
    if (!checkboxSelected) {
      removeButton.classList.add("disabled");
    } else if (currentPageContent.length > 0) {
      removeButton.classList.remove("disabled");
    }
  }

  function createTableColumnHead(name) {
    let entry = document.createElement("th");
    let columnWidth = ((document.getElementById("database-table-container").offsetWidth - 240) / database.columns.length) + "px";
    entry.style = "width: " + columnWidth + "; max-width: " + columnWidth;
    let head = document.createElement("div");
    head.classList.add("database-column-head");
    let columnName = document.createElement("b");
    columnName.innerText = name;
    head.appendChild(columnName);
    let settingsButton = document.createElement("button");
    settingsButton.type = "button";
    settingsButton.classList.add("database-column-settings", "fa-solid",
      "fa-angle-down");
    settingsButton.setAttribute("data-bs-toggle", "dropdown");
    settingsButton.setAttribute("aria-expanded", "false");
    head.appendChild(settingsButton);
    let dropdown = createTableSettingsDropdown([
        {icon: "fa-trash", content: "{% trans 'product.database.column.settings.delete' %}",
          color: "text-danger", click: () => openRemoveColumnMenu(name)}
      ], []);
    head.appendChild(dropdown);
    entry.appendChild(head);
    return entry;
  }

  function openRemoveColumnMenu(column) {
    Swal.fire({
      title: "{% trans 'product.database.column.remove.title' %}",
      text: "{% trans 'product.database.column.remove.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        loaderPopup();
        let request = new HttpRequest("https://api.dulno.com/v1/table/column/remove/", "POST",
          [], {table: database.id, columnName: column});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.database.column.remove.successful.title' %}",
            "{% trans 'product.database.column.remove.successful.body' %}", "success")
            .then(success => window.location.reload());
        });
      }
    });
  }

  function createTableAddColumnButton() {
    let entry = document.createElement("th");
    entry.id = "database-column-add-head";
    let button = document.createElement("button");
    button.id = "database-column-add";
    button.type = "button";
    button.classList.add("btn", "btn-secondary");
    button.innerText = "{% trans 'product.database.column.add' %}";
    button.onclick = function(event) {
      openAddColumnMenu();
    }
    entry.appendChild(button);
    return entry;
  }

  function openAddColumnMenu() {
    let content = document.createElement("div");
    content.classList.add("database-column-add-content");
    let text = document.createElement("p");
    text.innerText = "{% trans 'product.database.column.add.body' %}";
    content.appendChild(text);
    let inputContainer = document.createElement("div");
    inputContainer.classList.add("mb-3", "mx-auto");
    inputContainer.style.width = "min(260px, 100%)";
    let input = document.createElement("input");
    input.classList.add("w-100");
    input.placeholder = "{% trans 'product.database.column.add.name' %}";
    input.maxLength = 64;
    input.addEventListener('input', tickInputMaxLength);
    inputContainer.appendChild(input);
    input.parentElement.classList.add('max-length-badged');
    tickInputMaxLength(input);
    content.appendChild(inputContainer);
    Swal.fire({
      title: "{% trans 'product.database.column.add.title' %}",
      html: content,
      icon: "info",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        if (input.value.replaceAll(" ", "") === "") {
          Swal.fire("{% trans 'product.database.rename.empty.title' %}",
            "{% trans 'product.database.column.add.empty.body' %}", "error");
          return;
        }
        loaderPopup();
        let request = new HttpRequest("https://api.dulno.com/v1/table/column/add/", "POST",
          [], {table: database.id, columnName: input.value});
        request.send(function (status, responseText) {
          let response = JSON.parse(responseText);
          if (response.success === true) {
            Swal.fire("{% trans 'product.database.column.add.successful.title' %}",
              "{% trans 'product.database.column.add.successful.body' %}", "success")
              .then(success => window.location.reload());
          } else {
            if (response.errorCode === 1000) {
              Swal.fire("{% trans 'product.database.column.add.failed.title' %}",
                "{% trans 'product.database.column.add.failed.ineligible' %}", "error");
            } else if (response.errorCode === 1001) {
              Swal.fire("{% trans 'product.database.column.add.failed.title' %}",
                "{% trans 'product.database.column.add.failed.pattern' %}", "error");
            } else if (response.errorCode === 1002) {
              Swal.fire("{% trans 'product.database.column.add.failed.title' %}",
                "{% trans 'product.database.column.add.failed.occupied' %}", "error");
            } else if (response.errorCode === 1003) {
              Swal.fire("{% trans 'product.database.column.add.failed.title' %}",
                "{% trans 'product.database.column.add.failed.limit' %}", "error");
            } else {
              Swal.fire("{% trans 'product.database.column.add.failed.title' %}",
                "", "error");
            }
          }
        });
      }
    });
  }

  function fillTableContent(content) {
    let body = document.getElementById("database-table-body");
    body.innerHTML = "";
    for (let i = 0; i < content.length; i++) {
      body.appendChild(displayTableRow(content[i]));
    }
    if (content.length === 0) {
      displayTableEmptyLabel();
    }
  }

  function displayTableRow(entry) {
    let row = document.createElement("tr");
    let checkbox = createCheckboxElement(function(event) {
      clickRowCheckbox();
    });
    rowCheckboxes.push({checkbox: checkbox.firstChild, row: entry})
    row.appendChild(checkbox);
    let columns = database.columns;
    let cellWidth = ((document.getElementById("database-table-container").offsetWidth - 240) / database.columns.length) + "px";
    let cells = entry.cells;
    for (let i = 0; i < columns.length; i++) {
      let column = columns[i].name;
      let cell = document.createElement("td");
      cell.style = "width: " + cellWidth + "; max-width: " + cellWidth;
      cell.innerText = cells.filter((cell) => cell.column === column)[0].value;
      row.appendChild(cell);
    }
    row.appendChild(createTableRowSettingsElement(() => editTableRow(entry, row),
      () => deleteTableRow(entry)));
    return row;
  }

  function editTableRow(entry, row) {
    let originalContent = [...row.childNodes];
    row.innerHTML = "";
    row.appendChild(document.createElement("td"));
    let columns = database.columns;
    let cells = [];
    for (let i = 0; i < columns.length; i++) {
      let column = columns[i].name;
      let cell = document.createElement("td");
      cell.classList.add("database-row-edit-cell");
      let input = document.createElement("input");
      input.classList.add("database-row-edit-cell-input");
      input.value = entry.cells.filter((cell) => cell.column === column)[0].value;
      cell.appendChild(input);
      row.appendChild(cell);
      cells.push({column: column, input: input})
    }
    let modificationCell = document.createElement("td");
    modificationCell.classList.add("database-row-edit-modification");
    modificationCell.appendChild(createRowEditSubmitButton(() => submitTableEdit(entry, cells)));
    modificationCell.appendChild(createRowEditExitButton(() => exitTableEdit(row, originalContent)));
    row.appendChild(modificationCell);
  }

  function submitTableEdit(entry, cells) {
    let rowData = {};
    for (let i = 0; i < cells.length; i++) {
      let cell = cells[i];
      rowData[cell.column] = cell.input.value;
    }
    let request = new HttpRequest("https://api.dulno.com/v1/table/entry/update/", "POST",
      [], {table: database.id, row: findRowId(entry), content: rowData});
    request.send(function (status, responseText) {
      if (status === 400) {
        Swal.fire("{% trans 'product.database.row.edit.failed.limit.reached.title' %}",
          "{% trans 'product.database.row.edit.failed.limit.reached.body' %}", "error")
          .then(success => window.location.reload());
        return;
      }
      Swal.fire("{% trans 'product.database.row.edit.successful.title' %}",
        "{% trans 'product.database.row.edit.successful.body' %}", "success")
        .then(success => window.location.reload());
    });
  }

  function exitTableEdit(row, originalContent) {
    row.innerHTML = "";
    for (let i = 0; i < originalContent.length; i++) {
      row.appendChild(originalContent[i]);
    }
  }

  function deleteTableRow(entry) {
    let request = new HttpRequest("https://api.dulno.com/v1/table/entry/remove/", "POST",
      [], {table: database.id, row: findRowId(entry)});
    request.send(function (status, responseText) {
      Swal.fire("{% trans 'product.database.row.delete.successful.title' %}",
        "{% trans 'product.database.row.delete.successful.body' %}", "success")
        .then(success => window.location.reload());
    });
  }

  function clickRowCheckbox() {
    let checkboxSelected = false;
    for (let i = 0; i < rowCheckboxes.length; i++) {
      if (rowCheckboxes[i].checkbox.checked) {
        checkboxSelected = true;
        break;
      }
    }
    let removeButton = document.getElementById("database-remove");
    if (!checkboxSelected) {
      removeButton.classList.add("disabled");
    } else {
      removeButton.classList.remove("disabled");
    }
  }

  function createTableRowSettingsElement(submitEdit, submitDelete) {
    let entry = document.createElement("td");
    let entryDiv = document.createElement("div");
    entryDiv.classList.add("database-row-settings-container");
    let settingsButton = document.createElement("button");
    settingsButton.type = "button";
    settingsButton.classList.add("database-row-settings", "fa-solid",
      "fa-ellipsis-vertical");
    settingsButton.setAttribute("data-bs-toggle", "dropdown");
    settingsButton.setAttribute("aria-expanded", "false");
    entryDiv.appendChild(settingsButton);
    let dropdown = createTableSettingsDropdown([
        {icon: "fa-pen", content: "{% trans 'product.database.row.settings.edit' %}",
          click: submitEdit},
        {icon: "fa-trash", content: "{% trans 'product.database.row.settings.delete' %}",
          color: "text-danger", click: submitDelete}
      ], [1]);
    entryDiv.appendChild(dropdown);
    entry.appendChild(entryDiv);
    return entry;
  }

  function createTableSettingsDropdown(buttons, dividers) {
    let dropdown = document.createElement("ul");
    dropdown.classList.add("database-table-settings-dropdown", "dropdown-menu");
    for (let i = 0; i < buttons.length; i++) {
      for (let j = 0; j < dividers.length; j++) {
        if (dividers[j] === i) {
          dropdown.appendChild(createTableSettingsDropdownDivider());
          break;
        }
      }
      let button = buttons[i];
      dropdown.appendChild(createTableSettingsDropdownButton(dropdown, button.icon,
        button.content, button.color, button.click));
    }
    return dropdown;
  }

  function createTableSettingsDropdownDivider() {
    let dropdownDivider = document.createElement("li");
    dropdownDivider.classList.add("database-table-settings-dropdown-divider");
    return dropdownDivider;
  }

  function createTableSettingsDropdownButton(dropdown, icon, content, color, click) {
    let dropdownEntry = document.createElement("li");
    dropdownEntry.classList.add("database-table-settings-dropdown-entry", "dropdown-item");
    let dropdownEntryIcon = document.createElement("i");
    dropdownEntryIcon.classList.add("fa-solid", icon);
    dropdownEntry.appendChild(dropdownEntryIcon);
    let dropdownEntryLabel = document.createElement("label");
    dropdownEntryLabel.innerText = content;
    dropdownEntry.appendChild(dropdownEntryLabel);
    if (color !== undefined) {
      dropdownEntryIcon.classList.add(color);
      dropdownEntryLabel.classList.add(color);
    }
    dropdownEntry.onclick = function (event) {
      $(dropdown).dropdown('toggle');
      click();
    };
    return dropdownEntry;
  }

  function createCheckboxElement(click) {
    let entry = document.createElement("td");
    let input = document.createElement("input");
    input.classList.add("form-check-input");
    input.type = "checkbox";
    input.onchange = click;
    entry.appendChild(input);
    return entry;
  }

  const pageVisibilityRange = 2;
  let pagingStartingPoint = "";

  function displayPaging(pages, currentPage, pageState) {
    displayPagingShiftButton("database-previous-page", currentPage > 0,
      pages, currentPage, pageState, -1);
    displayPagingShiftButton("database-next-page", currentPage < pages - 1,
      pages, currentPage, pageState, 1);
    let pagesElement = document.getElementById("database-pages");
    pagesElement.innerHTML = "";
    createPageButton(pagesElement, pages, currentPage, pageState, 0, currentPage === 0);
    if (pages === 1) {
      return;
    }
    if (currentPage - pageVisibilityRange > 0) {
      pagesElement.insertAdjacentHTML("beforeend",
        "<i class='database-paging-ellipsis database-paging-ellipsis-start " +
        "fa-solid fa-ellipsis mx-4'></i>");
    }
    for (let i = -pageVisibilityRange + 1; i < pageVisibilityRange; i++) {
      let page = currentPage + i;
      if (page < 1 || page >= pages - 1) {
        continue;
      }
      createPageButton(pagesElement, pages, currentPage, pageState, page,
        page === currentPage);
    }
    if (currentPage + pageVisibilityRange < pages - 1) {
      pagesElement.insertAdjacentHTML("beforeend",
        "<i class='database-paging-ellipsis database-paging-ellipsis-end " +
        "fa-solid fa-ellipsis mx-4'></i>");
    }
    createPageButton(pagesElement, pages, currentPage, pageState, pages - 1, currentPage === pages - 1);
  }

  function displayPagingShiftButton(id, isEnabled, pages, currentPage, pageState, direction) {
    let button = document.getElementById(id);
    if (isEnabled) {
      button.classList.remove("database-page-disabled");
    } else {
      button.classList.add("database-page-disabled");
    }
    button.onclick = function (event) {
      if (!isEnabled) {
        return;
      }
      shiftPage(pages, currentPage, pageState, direction);
    }
  }

  function createPageButton(pagesElement, pages, currentPage, pageState, page, isActive) {
    let button = document.createElement("a");
    button.classList.add("database-page");
    if (isActive) {
      button.classList.add("database-page-active");
    }
    button.innerHTML = page + 1;
    button.onclick = function (event) {
      onPageButtonClick(pages, currentPage, pageState, page);
    };
    pagesElement.appendChild(button);
  }

  function onPageButtonClick(pages, currentPage, pageState, page) {
    if (page === currentPage) {
      return;
    }
    if (Math.abs(page - currentPage) === 1) {
      shiftPage(pages, currentPage, pageState, page - currentPage);
      return;
    }
    fetchDatabasePage(page, function(database, pageState, pageNumber) {
      updatePaging(pageNumber, page, pageState, database);
    });
  }

  function fetchDatabasePage(targetPage, callback) {
    let body = {};
    body.table = database.id;
    body.targetPage = targetPage;
    let request = new HttpRequest("https://api.dulno.com/v1/table/content/page/",
      "POST", [], body);
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      pagingStartingPoint = targetPage === 0 ? "FORWARD" : "BACKWARD";
      callback(response.content, response.page, response.pageNumber);
    });
  }

  function shiftPage(pages, currentPage, pageState, direction) {
    let newPage = currentPage + direction;
    if (newPage === 0 || newPage === pages - 1) {
      pagingStartingPoint = newPage === 0 ? "FORWARD" : "BACKWARD";
      fetchDatabasePage(newPage, function(database, pageState, pageNumber) {
        updatePaging(pageNumber, newPage, pageState, database);
      });
      return;
    }
    let body = {};
    body.table = database.id;
    body.pageState = pageState;
    body.startingPoint = pagingStartingPoint;
    body.direction = direction < 0 ? "BACKWARD" : "FORWARD";
    let request = new HttpRequest("https://api.dulno.com/v1/table/content/page/shift/",
      "POST", [], body);
    request.send(function (status, responseText) {
      let response = JSON.parse(responseText);
      let newPage = currentPage + direction;
      updatePaging(response.pageNumber, newPage, response.page, response.content);
    });
  }

  function updatePaging(pageNumber, currentPage, pageState, database) {
    document.getElementById("database-table-checkbox-global").checked = false;
    rowCheckboxes = [];
    currentPageContent = database;
    document.getElementById("database-remove").classList.add("disabled");
    fillTableContent(database);
    if (database.length === 0) {
      document.getElementById("database-table-page-control").classList.add("d-none");
    } else {
      displayPaging(pageNumber, currentPage, pageState);
      document.getElementById("database-table-page-control").classList.remove("d-none");
    }
  }

  document.getElementById("database-delete").onclick = function (event) {
    Swal.fire({
      title: "{% trans 'product.database.delete.title' %}",
      text: "{% trans 'product.database.delete.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://api.dulno.com/v1/table/delete/", "POST",
          [], {table: database.id});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.database.delete.successful.title' %}",
            "{% trans 'product.database.delete.successful.body' %}", "success")
            .then(success => window.location.href = "/databases/");
        });
      }
    });
  }

  document.getElementById("database-rename").onclick = function (event) {
    let content = document.createElement("div");
    content.classList.add("database-rename-content");
    let text = document.createElement("p");
    text.innerText = "{% trans 'product.database.rename.body' %}";
    content.appendChild(text);
    let inputContainer = document.createElement("div");
    inputContainer.classList.add("mb-3", "mx-auto");
    inputContainer.style.width = "min(260px, 100%)";
    let input = document.createElement("input");
    input.classList.add("w-100");
    input.placeholder = "{% trans 'product.database.rename.name' %}";
    input.maxLength = 64;
    input.addEventListener('input', tickInputMaxLength);
    inputContainer.appendChild(input);
    input.parentElement.classList.add('max-length-badged');
    tickInputMaxLength(input);
    content.appendChild(inputContainer);
    Swal.fire({
      title: "{% trans 'product.database.rename.title' %}",
      html: content,
      icon: "info",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        if (input.value.replaceAll(" ", "") === "") {
          Swal.fire("{% trans 'product.database.rename.empty.title' %}",
            "{% trans 'product.database.rename.empty.body' %}", "error");
          return;
        }
        let request = new HttpRequest("https://api.dulno.com/v1/table/rename/", "POST",
          [], {table: database.id, name: input.value});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.database.rename.successful.title' %}",
            "{% trans 'product.database.rename.successful.body' %}", "success")
            .then(success => window.location.reload());
        });
      }
    });
  }

  function tickInputMaxLength(element) {
    if (element.target) {
      element = element.target
    }
    let limit = element.maxLength;
    let parent = element.parentElement;
    let length = element.value.length;
    parent.dataset['limit'] = limit;
    parent.dataset['remaining'] = limit - length;
    parent.classList.remove('max-length-reached');
    if (length === limit) {
      parent.classList.add('max-length-reached');
    }
  }

  document.getElementById("database-remove").onclick = function (event) {
    for (let i = 0; i < rowCheckboxes.length; i++) {
      let entry = rowCheckboxes[i];
      if (entry.checkbox.checked) {
        let request = new HttpRequest("https://api.dulno.com/v1/table/entry/remove/", "POST",
          [], {table: database.id, row: findRowId(entry.row)});
        request.send(function (status, responseText) {
        });
      }
    }
    Swal.fire("{% trans 'product.database.remove.successful.title' %}",
      "{% trans 'product.database.remove.successful.body' %}", "success")
      .then(success => window.location.reload());
  }

  function findRowId(row) {
    let id;
    let cells = row.cells;
    for (let i = 0; i < cells.length; i++) {
      let cell = cells[i];
      if (cell.column === "id") {
        id = cell.value;
        break;
      }
    }
    return id;
  }

  document.getElementById("database-insert").onclick = function (event) {
    if (inserting) {
      return;
    }
    displayTableInsertRow();
    inserting = true;
    document.getElementById("database-insert").classList.add("disabled");
    removeTableEmptyLabel();
  }

  function displayTableInsertRow() {
    let row = document.createElement("tr");
    row.appendChild(document.createElement("td"));
    let columns = database.columns;
    let cells = [];
    for (let i = 0; i < columns.length; i++) {
      let cell = document.createElement("td");
      cell.classList.add("database-row-edit-cell");
      let input = document.createElement("input");
      input.classList.add("database-row-edit-cell-input");
      cell.appendChild(input);
      row.appendChild(cell);
      cells.push({column: columns[i].name, input: input})
    }
    let modificationCell = document.createElement("td");
    modificationCell.classList.add("database-row-edit-modification");
    modificationCell.appendChild(createRowEditSubmitButton(() => submitTableInsert(cells)));
    modificationCell.appendChild(createRowEditExitButton(() => exitTableInsert(row)));
    row.appendChild(modificationCell);
    document.getElementById("database-table-body").appendChild(row);
  }

  function submitTableInsert(cells) {
    let rowData = {};
    for (let i = 0; i < cells.length; i++) {
      let cell = cells[i];
      rowData[cell.column] = cell.input.value;
    }
    let request = new HttpRequest("https://api.dulno.com/v1/table/entry/insert/", "POST",
      [], {table: database.id, row: rowData});
    request.send(function (status, responseText) {
      if (status === 400) {
        Swal.fire("{% trans 'product.database.insert.failed.limit.reached.title' %}",
          "{% trans 'product.database.insert.failed.limit.reached.body' %}", "error")
          .then(success => window.location.reload());
        return;
      }
      Swal.fire("{% trans 'product.database.insert.successful.title' %}",
        "{% trans 'product.database.insert.successful.body' %}", "success")
        .then(success => window.location.reload());
    });
  }

  function exitTableInsert(row) {
    document.getElementById("database-table-body").removeChild(row);
    inserting = false;
    document.getElementById("database-insert").classList.remove("disabled");
    if (currentPageContent.length === 0) {
      displayTableEmptyLabel();
    }
  }

  function createRowEditSubmitButton(click) {
    let button = document.createElement("button");
    button.classList.add("database-row-edit-submit", "btn", "btn-success");
    button.type = "button";
    button.innerText = "{% trans 'product.database.insert.submit' %}";
    button.onclick = function(event) {
      button.classList.add("disabled");
      click();
    };
    return button;
  }

  function createRowEditExitButton(click) {
    let exitButton = document.createElement("button");
    exitButton.type = "button";
    exitButton.classList.add("database-row-edit-exit", "fa-regular",
      "fa-circle-xmark");
    exitButton.onclick = click;
    return exitButton;
  }

  function displayTableEmptyLabel() {
    let emptyLabel = document.createElement("h5");
    emptyLabel.id = "database-table-empty";
    emptyLabel.innerText = "{% trans 'product.database.empty' %}";
    document.getElementById("database-table-container").insertBefore(emptyLabel,
      document.getElementById("database-table-paging"));
  }

  function removeTableEmptyLabel() {
    if (currentPageContent.length > 0) {
      return;
    }
    document.getElementById("database-table-container").removeChild(
      document.getElementById("database-table-empty"));
  }

  function loaderPopup() {
    Swal.fire({
      html: `
        <div style="display: flex; justify-content: center; align-items: center; height: calc(340px - 4rem)">
          <div class="spinner-border" role="status" style="width: 4rem; height: 4rem;">
            <span class="visually-hidden">Loading</span>
          </div>
        </div>
      `,
      showConfirmButton: false
    });
  }

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("database-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("database-container").removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("database-wrapper").classList.remove("d-none");
  }
</script>

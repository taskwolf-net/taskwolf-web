{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="account-apps-wrapper">
        <div id="account-apps-header">
          <h1 id="account-apps-headline">{% trans 'product.account.apps.headline' %}</h1>
        </div>
        <div id="account-apps-search-box">
          <input id="account-apps-search-input" placeholder="{% trans 'product.account.apps.search' %}" type="text" class="form-control" value="" autocomplete="off">
          <button type="button">
            <i class="fa fa-search"></i>
          </button>
        </div>
        <ul id="account-apps-list">
        </ul>
        <div id="account-apps-loader">
        </div>
        <div id="account-apps-empty">
          <b id="account-apps-empty-headline">{% trans 'product.account.apps.empty' %}</b>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  let apps;
  let appsCurrentNameFilter = "";

  $(document).ready(function() {
    displayLoader();
    fetchAppsData(function() {
      displayApps();
      if (apps.length === 0) {
        document.getElementById("account-apps-empty").style.display = "block";
      } else {
        document.getElementById("account-apps-empty").style.display = "none";
      }
    });
  });

  function fetchAppsData(callback) {
    let request = new HttpRequest("https://api.dulno.com/v1/account/apps/", "GET",
      []);
    request.send(function (status, responseText) {
      apps = JSON.parse(responseText).apps;
      removeLoader();
      callback();
    });
  }

  function displayApps() {
    document.getElementById("account-apps-list").innerHTML = "";
    for (let i = 0; i < apps.length; i++) {
      let entry = apps[i];
      if(!(shouldDisplayAppEntry(entry))) {
        continue;
      }
      displayApp(entry.id, entry.name, entry.logo);
    }
  }

  function shouldDisplayAppEntry(entry) {
    return appsCurrentNameFilter.length === 0 ||
      entry.name.toLowerCase().includes(appsCurrentNameFilter.toLowerCase());
  }

  function displayApp(id, name, logo) {
    let entryElement = document.createElement("li");
    entryElement.role = "button";
    entryElement.classList.add("account-application-entry");
    let logoElement = document.createElement("img");
    logoElement.src = "{% static '' %}" + "img/applications/" + logo.split(".")[0] + ".webp";
    logoElement.width = 64;
    logoElement.height = 64;
    entryElement.appendChild(logoElement);
    let nameElement = document.createElement("b");
    nameElement.innerHTML = name;
    entryElement.appendChild(nameElement);
    entryElement.onclick = function(event) {
      sessionStorage.setItem("account-app-identifier", id);
      sessionStorage.setItem("account-app-name", name);
      sessionStorage.setItem("account-app-logo", logo);
      window.location.href = "/accounts/";
    }
    let arrowElement = document.createElement("i");
    arrowElement.classList.add("fa-solid", "fa-angle-right");
    entryElement.appendChild(arrowElement);
    document.getElementById("account-apps-list").appendChild(entryElement);
  }

  document.getElementById("account-apps-search-input").oninput = function(event) {
    appsCurrentNameFilter = event.target.value;
    displayApps();
  };

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader", "loader-list");
    document.getElementById("account-apps-loader").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("account-apps-loader").removeChild(
      document.getElementsByClassName("loader")[0]);
  }
</script>

{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'templates/head.html' %}
  <body>
    {% include 'templates/product-header.html' %}
    {% include 'templates/product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="account-apps-wrapper">
        <div id="account-apps-header">
          <div id="account-apps-target-dropdown" class="dropdown">
            <button id="account-apps-target-dropdown-button" class="btn btn-secondary dropdown-toggle bg-dark" type="button" data-bs-toggle="dropdown">
              {% trans 'target' %}
            </button>
            <ul id="account-apps-target-dropdown-list" class="dropdown-menu dropdown-menu-dark">
            </ul>
          </div>
          <h1 id="account-apps-headline">{% trans 'product.account.apps.headline' %}</h1>
        </div>
        <div id="account-apps-search-box">
          <input id="account-apps-search-input" placeholder="{% trans 'product.account.apps.search' %}" type="text" class="form-control" value="" autocomplete="off">
          <button type="button">
            <i class="fa fa-search"></i>
          </button>
        </div>
        <ul id="account-apps-list">
        </ul>
        <div id="account-apps-empty">
          <b id="account-apps-empty-headline">{% trans 'product.account.apps.empty' %}</b>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  var apps;
  var appsCurrentNameFilter = "";

  $(document).ready(function() {
    fetchTargetsData(function(response) {
      var targets = response.targets;
      var currentTarget = response.currentTarget;
      for (var i = 0; i < targets.length; i++) {
        addTarget(targets[i]);
      }
      selectTarget(targets.filter((target) => target.id === currentTarget)[0]);
    });
    displayAccountApps();
  });

  function fetchTargetsData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/targets/all/", "GET",
      []);
    request.send(function (status, responseText) {
      callback(JSON.parse(responseText));
    });
  }

  function addTarget(target) {
    var targetElement = document.createElement("li");
    targetElement.classList.add("dropdown-item");
    var targetNameName = document.createElement("b");
    targetNameName.innerHTML = target.name;
    targetElement.appendChild(targetNameName);
    targetElement.onclick = function(event) {
      selectTarget(target);
    }
    document.getElementById("account-apps-target-dropdown-list").appendChild(targetElement);
  }

  function selectTarget(target) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/target/change/", "POST",
      [], {target: target.id});
    request.send(function (status, responseText) {
      document.getElementById("account-apps-target-dropdown-button").innerHTML = "{% trans 'target' %}: " + target.name;
      displayAccountApps();
    });
  }

  function displayAccountApps() {
    fetchAppsData(function() {
      displayApps();
      if (apps.length === 0) {
        document.getElementById("account-apps-empty").style.display = "block";
      } else {
        document.getElementById("account-apps-empty").style.display = "none";
      }
    });
  }

  function fetchAppsData(callback) {
    let request = new HttpRequest("https://api.taskwolf.net/v1/account/apps/", "GET",
      []);
    request.send(function (status, responseText) {
      apps = JSON.parse(responseText).apps;
      callback();
    });
  }

  function displayApps() {
    document.getElementById("account-apps-list").innerHTML = "";
    for (var i = 0; i < apps.length; i++) {
      var entry = apps[i];
      if(!(shouldDisplayAppEntry(entry))) {
        continue;
      }
      displayApp(entry.name, entry.logo);
    }
  }

  function shouldDisplayAppEntry(entry) {
    return appsCurrentNameFilter.length === 0 ||
      entry.name.toLowerCase().includes(appsCurrentNameFilter.toLowerCase());
  }

  function displayApp(name, logo) {
    var entryElement = document.createElement("li");
    entryElement.role = "button";
    entryElement.classList.add("account-application-entry");
    var logoElement = document.createElement("img");
    logoElement.src = "{% static '' %}" + "img/applications/" + logo;
    logoElement.width = 64;
    logoElement.height = 64;
    entryElement.appendChild(logoElement);
    var nameElement = document.createElement("b");
    nameElement.innerHTML = name;
    entryElement.appendChild(nameElement);
    entryElement.onclick = function(event) {
      sessionStorage.setItem("account-app-identifier", name.toLowerCase());
      sessionStorage.setItem("account-app-name", name.charAt(0).toUpperCase() + name.slice(1));
      sessionStorage.setItem("account-app-logo", logo);
      window.location.href = "/accounts/";
    }
    var arrowElement = document.createElement("i");
    arrowElement.classList.add("fa-solid", "fa-angle-right");
    entryElement.appendChild(arrowElement);
    document.getElementById("account-apps-list").appendChild(entryElement);
  }

  document.getElementById("account-apps-search-input").oninput = function(event) {
    appsCurrentNameFilter = event.target.value;
    displayApps();
  };
</script>

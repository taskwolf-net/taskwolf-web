{% load static %}
{% load i18n %}
<html lang="en">
  {% include 'head.html' %}
  <body class="dark" data-bs-theme="dark">
    {% include 'product-header.html' %}
    {% include 'product-sidebar.html' %}
    <div class="sidebar-influenced">
      <div id="accounts-container">
        <div id="accounts-wrapper" class="d-none">
          <div id="accounts-page-back-container">
            <button id="accounts-page-back"><i class="fa-solid fa-arrow-left-long"></i></button>
          </div>
          <div id="accounts-header">
            <img id="accounts-logo"></img>
            <h1 id="accounts-headline"></h1>
          </div>
          <h1 id="accounts-list-headline">{% trans 'product.accounts.headline' %}</h1>
          <ul id="accounts-list">
          </ul>
          <div id="accounts-empty">
            <b id="accounts-empty-headline"></b>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  let accounts;

  $(document).ready(function() {
    displayLoader();
    document.getElementById("accounts-logo").src = "{% static '' %}" +
      "img/applications/" + sessionStorage.getItem("account-app-logo").split(".")[0] + ".webp";
    document.getElementById("accounts-headline").innerHTML =
      sessionStorage.getItem("account-app-name");
    fetchAccountsData(function() {
      displayAccounts();
      if (accounts.length === 0) {
        document.getElementById("accounts-empty").style.display = "block";
        document.getElementById("accounts-empty-headline").innerHTML = "{% trans 'product.accounts.empty' %}".replace("%APP%", sessionStorage.getItem("account-app-name"));
      }
      removeLoader();
    });
  });

  function fetchAccountsData(callback) {
    let request = new HttpRequest("https://api.dulno.com/v1/accounts/", "POST",
      [], {module: sessionStorage.getItem("account-app-identifier")});
    request.send(function (status, responseText) {
      accounts = JSON.parse(responseText).accounts;
      callback();
    });
  }

  function displayAccounts() {
    document.getElementById("accounts-list").innerHTML = "";
    for (let i = 0; i < accounts.length; i++) {
      let entry = accounts[i];
      displayAccount(entry.identifier, entry.name);
    }
  }

  function displayAccount(identifier, name) {
    let entryElement = document.createElement("li");
    entryElement.classList.add("account-entry");
    let nameElement = document.createElement("b");
    nameElement.innerHTML = name;
    entryElement.appendChild(nameElement);
    let deleteButton = document.createElement("button");
    deleteButton.classList.add("btn", "btn-danger");
    deleteButton.type = "button";
    deleteButton.innerHTML = "{% trans 'product.accounts.account.delete' %}";
    deleteButton.onclick = function (event) {
      openDeleteMenu(identifier);
    }
    entryElement.appendChild(deleteButton);
    document.getElementById("accounts-list").appendChild(entryElement);
  }

  function openDeleteMenu(identifier) {
    Swal.fire({
      title: "{% trans 'product.accounts.account.delete.title' %}",
      text: "{% trans 'product.accounts.account.delete.body' %}",
      icon: "warning",
      confirmButtonColor: "#dc3545",
      showCancelButton: true,
    }).then(result => {
      if (result.isConfirmed) {
        let request = new HttpRequest("https://api.dulno.com/v1/account/remove/", "POST",
          [], {module: sessionStorage.getItem("account-app-identifier"), identifier: identifier});
        request.send(function (status, responseText) {
          Swal.fire("{% trans 'product.accounts.account.delete.successful.title' %}", "{% trans 'product.accounts.account.delete.successful.body' %}", "success").then(success => window.location.reload());
        });
      }
    });
  }

  document.getElementById("accounts-page-back").onclick = function (event) {
    window.location.href = "/account/apps/";
  }

  function displayLoader() {
    let loader = document.createElement("div");
    loader.classList.add("loader");
    document.getElementById("accounts-container").appendChild(loader);
  }

  function removeLoader() {
    document.getElementById("accounts-container").removeChild(document.getElementsByClassName("loader")[0]);
    document.getElementById("accounts-wrapper").classList.remove("d-none");
  }
</script>

{% load static %}
{% load i18n %}
<nav id="navbar" >
  <button id="sidebar-button" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar" aria-expanded="false" aria-controls="sidebar"></button>
  <div id="navbar-content">
    <a href="/" id="close-settings"><i class="fa-solid fa-circle-xmark"></i></a>
  </div>
</nav>
<div id="header-space"></div>

<script>
  var isSidebarShown;

  window.onload = function() {
    if (sessionStorage.getItem("taskwolf-sidebar") === null) {
      sessionStorage.setItem("taskwolf-sidebar", "true");
    }
    isSidebarShown = window.innerWidth > 575;
    if (isSidebarShown) {
      document.getElementById("sidebar").classList.add("show");
    }
    updateSidebarSpacing();
    updateSidebarButtonIcon();
  };

  document.getElementById('sidebar-button').onclick = function() {
    isSidebarShown = !isSidebarShown;
    sessionStorage.setItem("taskwolf-sidebar", isSidebarShown);
    updateSidebarSpacing();
    updateSidebarButtonIcon();
  };

  function updateSidebarSpacing() {
    var elements = document.getElementsByClassName('sidebar-influenced');
    for (var i = 0; i < elements.length; i++) {
      if (isSidebarShown && window.innerWidth > 800 && window.innerWidth < 1400) {
        elements[i].style.marginLeft = '260px';
      } else {
        elements[i].style.marginLeft = '0';
      }
    }
  }

  function updateSidebarButtonIcon() {
    if (isSidebarShown) {
      document.getElementById("sidebar-button").innerHTML ='<i class="fa-solid fa-xmark"></i>';
      return;
    }
    document.getElementById("sidebar-button").innerHTML ='<i class="fa-solid fa-bars"></i>';
  }
</script>
